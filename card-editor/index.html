let importTargetCardCode = null, importTargetSlotType = null;

function openImportJson(cardCode, slotType) {
  importTargetCardCode = cardCode;
  importTargetSlotType = slotType;
  document.getElementById('importJsonInput').value = '';
  document.getElementById('importJsonError').textContent = '';
  document.getElementById('importJsonOverlay').classList.add('open');
}
function closeImportJson() {
  document.getElementById('importJsonOverlay').classList.remove('open');
  importTargetCardCode = null; importTargetSlotType = null;
}
function confirmImportJson() {
  const raw = document.getElementById('importJsonInput').value.trim();
  const errEl = document.getElementById('importJsonError');
  errEl.textContent = '';
  let data;
  try { data = JSON.parse(raw); } catch (e) { errEl.textContent = T('toast-import-error') + 'Invalid JSON'; return; }
  const result = importAssetJSON(importTargetCardCode, importTargetSlotType, data);
  if (result.error) { errEl.textContent = T('toast-import-error') + result.error; return; }
  closeImportJson();
  toast(T('toast-imported'));
}

function importAssetJSON(cardCode, slotType, jsonData) {
  // Parse if string
  if (typeof jsonData === 'string') {
    try { jsonData = JSON.parse(jsonData); } catch (e) { return { error: 'Invalid JSON' }; }
  }
  // Validate grid
  if (!jsonData.grid || !Array.isArray(jsonData.grid)) return { error: 'Missing grid' };
  const spec = ASSET_TYPES[slotType];
  if (!spec) return { error: 'Invalid slot type: ' + slotType };
  const expectedH = spec.h, expectedW = spec.w;
  if (jsonData.grid.length !== expectedH) return { error: `Grid height: expected ${expectedH}, got ${jsonData.grid.length}` };
  for (let r = 0; r < expectedH; r++) {
    if (!Array.isArray(jsonData.grid[r]) || jsonData.grid[r].length !== expectedW)
      return { error: `Row ${r}: expected width ${expectedW}` };
  }

  // Build partTypes & customColors
  const card = CARD_DATA[cardCode];
  if (!card) return { error: 'Invalid card code: ' + cardCode };
  let pts, cc;
  if (jsonData.partTypes && Array.isArray(jsonData.partTypes)) {
    pts = jsonData.partTypes;
    cc = jsonData.customColors || {};
    pts.forEach(pt => { if (pt.color && !cc[pt.value]) cc[pt.value] = pt.color; });
  } else {
    // Use defaults for this slot type
    const defaults = ASSET_PART_DEFAULTS[slotType] || ASSET_PART_DEFAULTS.character;
    const tierColors = TIER_COLORS[card.tier];
    pts = defaults.map(d => {
      const pt = { ...d };
      if (slotType !== 'character' && tierColors) {
        if (d.label === 'Border' || d.label === 'Base' || d.label === 'Digit') pt.color = tierColors.back;
        if (d.label === 'Accent' || d.label === 'Main') pt.color = tierColors.accent;
      }
      return pt;
    });
    cc = jsonData.customColors || {};
    pts.forEach(pt => { if (!cc[pt.value]) cc[pt.value] = pt.color; });
  }

  // Create asset
  const assetId = crypto.randomUUID();
  store.assets[assetId] = {
    id: assetId,
    type: slotType,
    label: (lang === 'ja' ? card.name : card.nameEn) + ' ' + T(spec.i18nKey),
    width: expectedW,
    height: expectedH,
    grid: jsonData.grid.map(r => Int8Array.from(r)),
    partTypes: pts.map(pt => ({ value: pt.value, label: pt.label, labelJa: pt.labelJa || pt.label, color: cc[pt.value] || pt.color, custom: pt.custom || false })),
    customColors: { ...cc },
    animations: jsonData.animations || {},
    meta: getMetaForSlot(slotType, card),
    createdAt: Date.now(),
    updatedAt: Date.now(),
  };

  // Assign to card
  const assign = getAssignments(cardCode);
  assign[slotType] = assetId;
  store.cardAssignments[cardCode] = assign;
  saveStore();

  // Refresh dashboard if visible
  if (currentView === 'viewDashboard' && selectedCardCode === cardCode) {
    initDashboard(cardCode);
  }

  return { success: true, assetId };
}

// ═══════════════════════════════════════════════════════════════
// SECTION 10: Utilities
// ═══════════════════════════════════════════════════════════════
function toggleDrawer(btn) { btn.classList.toggle('open'); btn.nextElementSibling.classList.toggle('open'); }
let toastTimer = null;
function toast(msg) { const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); if(toastTimer)clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2000); }
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if ((e.metaKey||e.ctrlKey) && e.key==='z') { e.preventDefault(); if(e.shiftKey) redo(); else undo(); }
});
window.addEventListener('resize', () => { if (currentView === 'viewEditor') render(); });

// ═══════════════════════════════════════════════════════════════
// SECTION 11: Init
// ═══════════════════════════════════════════════════════════════
function init() {
  loadStore();
  if (store.settings.lang) {
    setLang(store.settings.lang);
  } else if ((navigator.language||'').startsWith('ja')) {
    setLang('ja');
  }
  buildCardGrid();
}
init();
</script>
</body>
</html>
