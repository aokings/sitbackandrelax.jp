      const row = document.createElement('div');
      row.className = 'anim-row';
      const lbl = document.createElement('label');
      lbl.title = lang === 'ja' ? (def.descJa || def.desc) : def.desc;
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!fx[def.id];
      cb.onchange = () => { fx[def.id] = cb.checked; onFxChange(); };
      lbl.appendChild(cb);
      const span = document.createElement('span');
      span.textContent = ' ' + T(def.i18n);
      lbl.appendChild(span);
      row.appendChild(lbl);
      if (def.hasStrength) {
        const slider = document.createElement('input');
        slider.type = 'range'; slider.min = 0; slider.max = 100;
        slider.value = fx[def.id + '_str'] ?? def.defaultStr;
        slider.style.maxWidth = '80px';
        const valSpan = document.createElement('span');
        valSpan.className = 'range-val';
        valSpan.textContent = slider.value + '%';
        slider.oninput = () => { fx[def.id + '_str'] = +slider.value; valSpan.textContent = slider.value + '%'; onFxChange(); };
        row.appendChild(slider);
        row.appendChild(valSpan);
      }
      container.appendChild(row);
    });
  });
}

function onFxChange() {
  buildFxPartChips(); // update stars
  render();
  // Start/stop FX animation loop based on whether animated effects are active
  if (hasAnimatedFx()) startFxAnimLoop();
  else stopFxAnimLoop();
}

// ── Color helpers for effects ──
function hexToRgb(hex) {
  if (!hex || hex.length < 7) return [128,128,128];
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}
function rgbToHex(r,g,b) { return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function adjustBrightness(hex, amt) { const [r,g,b]=hexToRgb(hex); return rgbToHex(r+amt,g+amt,b+amt); }

// Seeded random for deterministic noise
function seededRand(seed) { let s=seed; return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }

// ── Sub-pixel effect rendering ──
// Effects are applied at sub-pixel resolution (finer than grid) for smooth results.
// sr, sc = sub-pixel coords within the cell (0..subDiv-1)
// subDiv = how many sub-pixels per grid cell per axis
// time = animation time in seconds (0 = static/export)
let fxAnimTime = 0;    // current effect animation time (seconds)
let fxAnimId = null;    // requestAnimationFrame ID for effect animation loop

function applyFxToColorSub(hex, val, r, c, sr, sc, subDiv, gridW, gridH, gridRef, time, useNativeOverlay) {
  const fx = partEffects[val];
  if (!fx) return hex;
  const t = time || 0;
  const native = useNativeOverlay || false; // true = Canvas API handles Gradient/Emboss
  let [cr, cg, cb] = hexToRgb(hex);

  // fractional position within the whole grid (0..1)
  const fracY = (r + sr / subDiv) / gridH;
  const fracX = (c + sc / subDiv) / gridW;
  // fractional position within the cell (0..1)
  const cellFracY = sr / subDiv;
  const cellFracX = sc / subDiv;

  // Edge detection (grid-level)
  const isTop = r > 0 && gridRef[r-1]?.[c] !== val;
  const isLeft = c > 0 && gridRef[r][c-1] !== val;
  const isBottom = r < gridH-1 && gridRef[r+1]?.[c] !== val;
  const isRight = c < gridW-1 && gridRef[r][c+1] !== val;

  // Gradient: dramatic top-to-bottom shading (skip if Canvas native overlay handles it)
  if (fx.gradient && !native) {
    const gradStr = (fx.gradient_str ?? 50) / 100;
    const shift = (0.5 - fracY) * 80 * gradStr;
    cr += shift; cg += shift; cb += shift;
  }

  // Forged: bold metallic edge highlight/shadow with animated shimmer (skip if Canvas native)
  if (fx.forged && !native) {
    const forgedStr = (fx.forged_str ?? 50) / 100;
    const edgeFade = 0.5;
    let highlight = 0, shadow = 0;
    if (isTop) highlight += Math.max(0, 1 - cellFracY / edgeFade);
    if (isLeft) highlight += Math.max(0, 1 - cellFracX / edgeFade);
    if (isBottom) shadow += Math.max(0, 1 - (1 - cellFracY) / edgeFade);
    if (isRight) shadow += Math.max(0, 1 - (1 - cellFracX) / edgeFade);
    highlight = Math.min(highlight, 1.2); shadow = Math.min(shadow, 1.2);
    const shimmer = t > 0 ? Math.sin(t * 1.5 + fracX * 8 + fracY * 6) * 0.25 + 1 : 1;
    // Strong metallic: warm highlight, cool shadow
    cr += (80 * highlight - 55 * shadow) * shimmer * forgedStr;
    cg += (70 * highlight - 55 * shadow) * shimmer * forgedStr;
    cb += (90 * highlight - 40 * shadow) * shimmer * forgedStr;
    // Inner metallic tint (shift toward steel blue)
    cr -= 8 * forgedStr; cb += 12 * forgedStr;
  }

  // Weathered: coarse noise + dark speckles for dirt/damage
  // (intentionally runs in BOTH native and export mode — noise texture works best as RGB math, no Canvas API version)
  if (fx.weathered) {
    const str = (fx.weathered_str ?? 40) / 100;
    const rng = seededRand(r * 1000 + c * 7 + sr * 137 + sc * 53 + val * 31);
    const noise = (rng() - 0.5) * 120 * str;
    cr += noise; cg += noise * 0.9; cb += noise * 0.7; // yellowed noise
    // Dark damage speckles
    if (rng() > 0.85) {
      const dmg = rng() * 50 * str;
      cr -= dmg; cg -= dmg * 0.8; cb -= dmg * 0.6;
    }
  }

  // Emboss: pronounced 3D edge with sub-pixel fade (skip if Canvas native overlay handles it)
  if (fx.emboss && !native) {
    const str = (fx.emboss_str ?? 50) / 100;
    const edgeFade = 0.5;
    let highlight = 0, shadow = 0;
    if (isTop) highlight += Math.max(0, 1 - cellFracY / edgeFade);
    if (isLeft) highlight += Math.max(0, 1 - cellFracX / edgeFade);
    if (isBottom) shadow += Math.max(0, 1 - (1 - cellFracY) / edgeFade);
    if (isRight) shadow += Math.max(0, 1 - (1 - cellFracX) / edgeFade);
    highlight = Math.min(highlight, 1.2); shadow = Math.min(shadow, 1.2);
    const h = 55 * str * highlight, s = 45 * str * shadow;
    cr += h - s; cg += h - s; cb += h - s;
  }

  // Arcane: vivid magical glow — not just edges, also inner shimmer (skip if Canvas native)
  if (fx.arcane && !native) {
    const arcStr = (fx.arcane_str ?? 50) / 100;
    const isEdge = isTop || isBottom || isLeft || isRight;
    const huePhase = t > 0 ? t * 0.8 : 0;
    const pulse = (t > 0 ? 0.6 + Math.sin(t * 2.5) * 0.4 : 1) * arcStr;
    if (isEdge) {
      let glow = 0;
      if (isTop) glow += Math.max(0, 1 - cellFracY / 0.6);
      if (isLeft) glow += Math.max(0, 1 - cellFracX / 0.6);
      if (isBottom) glow += Math.max(0, 1 - (1 - cellFracY) / 0.6);
      if (isRight) glow += Math.max(0, 1 - (1 - cellFracX) / 0.6);
      glow = Math.min(glow, 1.3);
      const hueShift = Math.sin(fracX * 10 + fracY * 7 + huePhase) * 0.5 + 0.5;
      // Strong purple-blue-cyan glow
      cr += 50 * glow * hueShift * pulse;
      cg += 20 * glow * (1 - hueShift * 0.5) * pulse;
      cb += 120 * glow * pulse;
    }
    // Inner magical shimmer across the whole part
    const innerGlow = Math.sin(fracX * 15 + fracY * 11 + huePhase * 1.3) * 0.5 + 0.5;
    cr += 10 * innerGlow * pulse;
    cb += 25 * innerGlow * pulse;
  }

  // Moss: vivid green growth on lower half with organic clumps
  // (intentionally runs in BOTH native and export mode — organic noise works best as RGB math, no Canvas API version)
  if (fx.moss) {
    const mossStr = (fx.moss_str ?? 50) / 100;
    const swayOffset = t > 0 ? Math.sin(t * 0.6 + fracX * 4) * 0.05 : 0;
    const adjustedFracY = fracY + swayOffset;
    if (adjustedFracY > 0.35) {
      const rng = seededRand(r * 503 + c * 13 + sr * 71 + sc * 29);
      const baseIntensity = Math.min((adjustedFracY - 0.35) * 1.8, 1.0);
      const noise = 0.1 + rng() * 0.9;
      const clump = rng() > 0.3 ? 1 : 0.2; // patchy clumps
      const intensity = baseIntensity * noise * clump * mossStr;
      cg += 70 * intensity; cr -= 30 * intensity; cb -= 25 * intensity;
      // Darker spots in heavy moss
      if (intensity > 0.5 && rng() > 0.6) {
        cr -= 15 * mossStr; cg -= 5 * mossStr; cb -= 10 * mossStr;
      }
    }
  }

  // Sparkle: bright twinkling stars — larger, more frequent, more visible (skip if Canvas native)
  if (fx.sparkle && !native) {
    const spkStr = (fx.sparkle_str ?? 50) / 100;
    const phase = t > 0 ? Math.floor(t * 3) : 0;
    const rng = seededRand(r * 337 + c * 61 + sr * 199 + sc * 83 + val * 17 + phase * 997);
    const threshold = rng();
    if (threshold > 1 - 0.12 * spkStr) {
      const sparkleLife = t > 0 ? (t * 3) % 1 : 1;
      const fade = Math.sin(sparkleLife * Math.PI);
      const intensity = (0.5 + rng() * 0.5) * (t > 0 ? fade : 1);
      if (intensity > 0.05) {
        const boost = 200 * intensity * spkStr;
        cr += boost; cg += boost; cb += boost;
      }
    }
  }

  // Frost: cool blue tint + bright edges (fallback for export)
  if (fx.frost && !native) {
    const frostStr = (fx.frost_str ?? 50) / 100;
    cr -= 10 * frostStr; cg += 5 * frostStr; cb += 20 * frostStr;
    if (isTop || isLeft) { cr += 30 * frostStr; cg += 35 * frostStr; cb += 40 * frostStr; }
    if (isBottom || isRight) { cr -= 10 * frostStr; cg -= 5 * frostStr; cb += 5 * frostStr; }
  }

  // Flame: warm orange tint, hotter at bottom (fallback for export)
  if (fx.flame && !native) {
    const flameStr = (fx.flame_str ?? 50) / 100;
    const heat = fracY * 0.7 * flameStr;
    cr += 40 * heat; cg -= 20 * heat; cb -= 30 * heat;
  }

  // Holy: golden tint with radial brightening from center (fallback for export)
  if (fx.holy && !native) {
    const holyStr = (fx.holy_str ?? 50) / 100;
    const dist = Math.sqrt((fracX - 0.5) ** 2 + (fracY - 0.5) ** 2);
    const glow = Math.max(0, 1 - dist * 2) * 30 * holyStr;
    cr += (20 + glow) * holyStr; cg += (15 + glow * 0.8) * holyStr; cb -= 5 * holyStr;
  }

  // Shadow: dark purple tint (fallback for export)
  if (fx.shadow && !native) {
    const shadowStr = (fx.shadow_str ?? 50) / 100;
    cr -= 15 * shadowStr; cg -= 20 * shadowStr; cb -= 5 * shadowStr;
    if (isTop || isLeft || isBottom || isRight) { cr -= 10 * shadowStr; cb += 15 * shadowStr; }
  }

  // Holographic: position-based hue tint (fallback for export)
  if (fx.holographic && !native) {
    const holoStr = (fx.holographic_str ?? 50) / 100;
    const hue = (fracX + fracY) * 180;
    const shift = Math.sin(hue * Math.PI / 180) * 25 * holoStr;
    cr += shift; cg += shift * 0.6; cb -= shift * 0.3;
  }

  // Outline: dark border fallback for export (simple darken at edges)
  if (fx.outline && !native) {
    const outStr = (fx.outline_str ?? 50) / 100;
    if (isTop || isLeft || isBottom || isRight) {
      cr -= 60 * outStr; cg -= 60 * outStr; cb -= 60 * outStr;
    }
  }

  // Ethereal: ghostly transparency fallback
  if (fx.ethereal && !native) {
    const ethStr = (fx.ethereal_str ?? 50) / 100;
    const ghostly = 40 * ethStr;
    cr += ghostly; cg += ghostly; cb += ghostly;
  }

  // Poison: green-purple tint fallback
  if (fx.poison && !native) {
    const poisStr = (fx.poison_str ?? 50) / 100;
    cg += 30 * poisStr; cr -= 10 * poisStr; cb += 20 * poisStr;
  }

  // Wood: warm brown tint fallback
  if (fx.wood && !native) {
    const woodStr = (fx.wood_str ?? 50) / 100;
    cr += 15 * woodStr; cg += 5 * woodStr; cb -= 15 * woodStr;
  }

  // Stone: gray tint fallback
  if (fx.stone && !native) {
    const stoneStr = (fx.stone_str ?? 50) / 100;
    const avg = (cr + cg + cb) / 3;
    cr += (avg - cr) * 0.3 * stoneStr; cg += (avg - cg) * 0.3 * stoneStr; cb += (avg - cb) * 0.3 * stoneStr;
  }

  // Marble: slight brightness fallback
  if (fx.marble && !native) {
    const marbStr = (fx.marble_str ?? 50) / 100;
    cr += 10 * marbStr; cg += 10 * marbStr; cb += 12 * marbStr;
  }

  // Fur: slight warm tint fallback
  if (fx.fur && !native) {
    const furStr = (fx.fur_str ?? 50) / 100;
    cr += 8 * furStr; cg += 4 * furStr; cb -= 4 * furStr;
  }

  // Scales: slight green shift fallback
  if (fx.scales && !native) {
    const scStr = (fx.scales_str ?? 50) / 100;
    cg += 10 * scStr; cr -= 5 * scStr;
  }

  // Tint: hue rotation fallback
  if (fx.tint && !native) {
    const tintStr = (fx.tint_str ?? 50) / 100;
    const degrees = tintStr * 3.6; // 0-360
    const rad = degrees * Math.PI / 180;
    const cosA = Math.cos(rad), sinA = Math.sin(rad);
    const rr = cr, gg = cg, bb = cb;
    cr = rr * (0.213 + cosA * 0.787 - sinA * 0.213) + gg * (0.715 - cosA * 0.715 - sinA * 0.715) + bb * (0.072 - cosA * 0.072 + sinA * 0.928);
    cg = rr * (0.213 - cosA * 0.213 + sinA * 0.143) + gg * (0.715 + cosA * 0.285 + sinA * 0.140) + bb * (0.072 - cosA * 0.072 - sinA * 0.283);
    cb = rr * (0.213 - cosA * 0.213 - sinA * 0.787) + gg * (0.715 - cosA * 0.715 + sinA * 0.715) + bb * (0.072 + cosA * 0.928 + sinA * 0.072);
  }

  // Blink: handled only in canvas mode (no RGB fallback needed)
  // Glow: brightness boost fallback
  if (fx.glow && !native) {
    const glowStr = (fx.glow_str ?? 50) / 100;
    cr += 20 * glowStr; cg += 20 * glowStr; cb += 20 * glowStr;
  }

  // Drip: no RGB fallback (canvas-only visual)

  return rgbToHex(cr, cg, cb);
}

// Backward-compat wrapper for non-sub-pixel callers (e.g. composite export — static, time=0)
function applyFxToColor(hex, val, r, c, gridW, gridH) {
  return applyFxToColorSub(hex, val, r, c, 0, 0, 1, gridW, gridH, grid, 0);
}

// ── Canvas-native post-processing overlays ──
// These use Canvas API (gradients, strokes) for smooth results that beat per-pixel math.
// Called AFTER all cells are drawn for a given part.

function applyCanvasGradient(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY) {
  const fx = partEffects[partVal];
  if (!fx || !fx.gradient) return;
  const str = (fx.gradient_str ?? 50) / 100;
  const ox = offsetX || 0, oy = offsetY || 0;
  // Single vertical gradient: light at top, dark at bottom
  const grad = ctx.createLinearGradient(0, oy, 0, oy + gridH * bh);
  grad.addColorStop(0, `rgba(255,255,255,${0.3 * str})`);
  grad.addColorStop(0.45, 'rgba(0,0,0,0)');
  grad.addColorStop(1, `rgba(0,0,0,${0.3 * str})`);
  // Apply only to cells belonging to this part
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      ctx.fillStyle = grad;
      ctx.fillRect(ox + c * bw, oy + r * bh, bw, bh);
    }
  }
}

function applyCanvasEmboss(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY) {
  const fx = partEffects[partVal];
  if (!fx || !fx.emboss) return;
  const ox = offsetX || 0, oy = offsetY || 0;
  const str = (fx.emboss_str ?? 50) / 100;
  const lw = Math.max(0.5, Math.min(bw, bh) * 0.15 * str);

  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      const x = ox + c * bw, y = oy + r * bh;

      // Check neighbors — only draw edges at part boundary
      const top    = r > 0       && gridRef[r-1]?.[c] === partVal;
      const left   = c > 0       && gridRef[r][c-1] === partVal;
      const bottom = r < gridH-1 && gridRef[r+1]?.[c] === partVal;
      const right  = c < gridW-1 && gridRef[r][c+1] === partVal;

      ctx.lineWidth = lw;

      // Highlight: top + left edges where boundary exists
      if (!top) {
        ctx.strokeStyle = `rgba(255,255,255,${0.35 * str})`;
        ctx.beginPath(); ctx.moveTo(x, y + lw/2); ctx.lineTo(x + bw, y + lw/2); ctx.stroke();
      }
      if (!left) {
        ctx.strokeStyle = `rgba(255,255,255,${0.3 * str})`;
        ctx.beginPath(); ctx.moveTo(x + lw/2, y); ctx.lineTo(x + lw/2, y + bh); ctx.stroke();
      }

      // Shadow: bottom + right edges where boundary exists
      if (!bottom) {
        ctx.strokeStyle = `rgba(0,0,0,${0.3 * str})`;
        ctx.beginPath(); ctx.moveTo(x, y + bh - lw/2); ctx.lineTo(x + bw, y + bh - lw/2); ctx.stroke();
      }
      if (!right) {
        ctx.strokeStyle = `rgba(0,0,0,${0.25 * str})`;
        ctx.beginPath(); ctx.moveTo(x + bw - lw/2, y); ctx.lineTo(x + bw - lw/2, y + bh); ctx.stroke();
      }
    }
  }
}

// Canvas-native Sparkle: draw glowing ✦ star shapes with shadowBlur
function applyCanvasSparkle(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time) {
  const fx = partEffects[partVal];
  if (!fx || !fx.sparkle) return;
  const str = (fx.sparkle_str ?? 50) / 100;
  const ox = offsetX || 0, oy = offsetY || 0;
  const t = time || 0;
  const phase = t > 0 ? Math.floor(t * 3) : 0;

  // Collect cells belonging to this part
  const cells = [];
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] === partVal) cells.push({ r, c });
    }
  }
  if (cells.length === 0) return;

  // Deterministic sparkle positions using seeded random
  const rng = seededRand(partVal * 773 + phase * 997);
  const sparkleCount = Math.max(2, Math.floor(cells.length * 0.12 * str));

  ctx.save();
  for (let i = 0; i < sparkleCount; i++) {
    const idx = Math.floor(rng() * cells.length);
    const cell = cells[idx];
    const cx = ox + (cell.c + 0.2 + rng() * 0.6) * bw;
    const cy = oy + (cell.r + 0.2 + rng() * 0.6) * bh;

    // Animated fade in/out
    const life = t > 0 ? ((t * 3 + rng() * 6.28) % 1) : 1;
    const fade = Math.sin(life * Math.PI);
    const alpha = (0.5 + rng() * 0.5) * fade;
    if (alpha < 0.05) continue;

    const starSize = bw * (0.3 + rng() * 0.5);

    // Glow effect
    ctx.shadowBlur = starSize * 2;
    ctx.shadowColor = `rgba(255,255,255,${alpha})`;

    // Draw 4-pointed star ✦
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.beginPath();
    const armLen = starSize;
    const armW = starSize * 0.15;
    // Horizontal arm
    ctx.moveTo(cx - armLen, cy);
    ctx.lineTo(cx, cy - armW);
    ctx.lineTo(cx + armLen, cy);
    ctx.lineTo(cx, cy + armW);
    ctx.closePath();
    ctx.fill();
    // Vertical arm
    ctx.beginPath();
    ctx.moveTo(cx, cy - armLen);
    ctx.lineTo(cx + armW, cy);
    ctx.lineTo(cx, cy + armLen);
    ctx.lineTo(cx - armW, cy);
    ctx.closePath();
    ctx.fill();

    // Bright center dot
    ctx.shadowBlur = starSize * 3;
    ctx.beginPath();
    ctx.arc(cx, cy, armW * 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';
  ctx.restore();
}

// Canvas-native Arcane: glowing purple-blue aura around part edges with shadowBlur
function applyCanvasArcane(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time) {
  const fx = partEffects[partVal];
  if (!fx || !fx.arcane) return;
  const str = (fx.arcane_str ?? 50) / 100;
  const ox = offsetX || 0, oy = offsetY || 0;
  const t = time || 0;
  const pulse = (t > 0 ? 0.6 + Math.sin(t * 2.5) * 0.4 : 1) * str;
  const hueShift = t > 0 ? t * 0.8 : 0;

  ctx.save();

  // Pass 1: Inner shimmer overlay on all cells
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      const x = ox + c * bw, y = oy + r * bh;
      const shimmer = Math.sin((c / gridW) * 15 + (r / gridH) * 11 + hueShift * 1.3) * 0.5 + 0.5;
      const a = 0.08 * shimmer * pulse;
      ctx.fillStyle = `rgba(120,60,255,${a})`;
      ctx.fillRect(x, y, bw, bh);
    }
  }

  // Pass 2: Glowing edge strokes with shadowBlur
  const glowSize = Math.max(bw, bh) * 0.6;
  ctx.lineWidth = Math.max(1, Math.min(bw, bh) * 0.2);

  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      const x = ox + c * bw, y = oy + r * bh;
      const top    = r > 0       && gridRef[r-1]?.[c] === partVal;
      const left   = c > 0       && gridRef[r][c-1] === partVal;
      const bottom = r < gridH-1 && gridRef[r+1]?.[c] === partVal;
      const right  = c < gridW-1 && gridRef[r][c+1] === partVal;

      if (top && left && bottom && right) continue; // inner cell, skip

      const hue = Math.sin((c / gridW) * 10 + (r / gridH) * 7 + hueShift) * 0.5 + 0.5;
      const rr = Math.round(80 + 70 * hue);
      const gg = Math.round(30 + 30 * (1 - hue));
      const bb = Math.round(200 + 55 * pulse);
      const alpha = 0.5 * pulse;

      ctx.shadowBlur = glowSize * pulse;
      ctx.shadowColor = `rgba(${rr},${gg},${bb},${alpha})`;
      ctx.strokeStyle = `rgba(${rr},${gg},${bb},${alpha * 0.8})`;

      if (!top) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + bw, y); ctx.stroke(); }
      if (!bottom) { ctx.beginPath(); ctx.moveTo(x, y + bh); ctx.lineTo(x + bw, y + bh); ctx.stroke(); }
      if (!left) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + bh); ctx.stroke(); }
      if (!right) { ctx.beginPath(); ctx.moveTo(x + bw, y); ctx.lineTo(x + bw, y + bh); ctx.stroke(); }
    }
  }
  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';
  ctx.restore();
}

// Canvas-native Forged: diagonal metallic reflection band with shimmer
function applyCanvasForged(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time) {
  const fx = partEffects[partVal];
  if (!fx || !fx.forged) return;
  const str = (fx.forged_str ?? 50) / 100;
  const ox = offsetX || 0, oy = offsetY || 0;
  const t = time || 0;

  ctx.save();

  // Pass 1: Steel blue tint on all cells
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      const x = ox + c * bw, y = oy + r * bh;
      ctx.fillStyle = `rgba(70,80,110,${0.1 * str})`;
      ctx.fillRect(x, y, bw, bh);
    }
  }

  // Pass 2: Moving diagonal shine band
  const bandPos = t > 0 ? ((t * 0.4) % 2.0) - 0.5 : 0.3; // 0..1.5 sweeping position
  const bandWidth = 0.25;
  const totalW = gridW * bw, totalH = gridH * bh;

  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      const x = ox + c * bw, y = oy + r * bh;
      // Diagonal position (top-left to bottom-right)
      const diag = (c / gridW + r / gridH) / 2;
      const dist = Math.abs(diag - bandPos);
      if (dist < bandWidth) {
        const intensity = 1 - dist / bandWidth;
        const shine = intensity * intensity; // quadratic falloff for soft edge
        // Bright white band
        const grad = ctx.createLinearGradient(x, y, x + bw, y + bh);
        grad.addColorStop(0, `rgba(255,255,255,${shine * 0.4})`);
        grad.addColorStop(0.5, `rgba(200,210,255,${shine * 0.5})`);
        grad.addColorStop(1, `rgba(255,255,255,${shine * 0.3})`);
        ctx.fillStyle = grad;
        ctx.fillRect(x, y, bw, bh);
      }
    }
  }

  // Pass 3: Strong metallic edge highlights (like polished metal)
  const lw = Math.max(0.5, Math.min(bw, bh) * 0.12 * str);
  const shimmer = (t > 0 ? Math.sin(t * 1.5) * 0.15 + 1 : 1) * str;
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      const x = ox + c * bw, y = oy + r * bh;
      const top    = r > 0       && gridRef[r-1]?.[c] === partVal;
      const left   = c > 0       && gridRef[r][c-1] === partVal;
      const bottom = r < gridH-1 && gridRef[r+1]?.[c] === partVal;
      const right  = c < gridW-1 && gridRef[r][c+1] === partVal;

      ctx.lineWidth = lw;
      // Warm metallic highlight (top + left)
      if (!top) {
        ctx.strokeStyle = `rgba(220,200,160,${0.45 * shimmer})`;
        ctx.beginPath(); ctx.moveTo(x, y + lw/2); ctx.lineTo(x + bw, y + lw/2); ctx.stroke();
      }
      if (!left) {
        ctx.strokeStyle = `rgba(200,185,150,${0.35 * shimmer})`;
        ctx.beginPath(); ctx.moveTo(x + lw/2, y); ctx.lineTo(x + lw/2, y + bh); ctx.stroke();
      }
      // Cool metallic shadow (bottom + right)
      if (!bottom) {
        ctx.strokeStyle = `rgba(30,30,50,${0.35 * shimmer})`;
        ctx.beginPath(); ctx.moveTo(x, y + bh - lw/2); ctx.lineTo(x + bw, y + bh - lw/2); ctx.stroke();
      }
      if (!right) {
        ctx.strokeStyle = `rgba(20,20,40,${0.3 * shimmer})`;
        ctx.beginPath(); ctx.moveTo(x + bw - lw/2, y); ctx.lineTo(x + bw - lw/2, y + bh); ctx.stroke();
      }
    }
  }
  ctx.restore();
}

// Canvas-native Frost: icy crystalline shimmer with cyan/white highlights
function applyCanvasFrost(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time) {
  const fx = partEffects[partVal];
  if (!fx || !fx.frost) return;
  const str = (fx.frost_str ?? 50) / 100;
  const ox = offsetX || 0, oy = offsetY || 0;
  const t = time || 0;

  ctx.save();

  // Pass 1: Cool blue tint overlay
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      const x = ox + c * bw, y = oy + r * bh;
      ctx.fillStyle = `rgba(180,220,255,${0.12 * str})`;
      ctx.fillRect(x, y, bw, bh);
    }
  }

  // Pass 2: Icy edge highlights (white-cyan, brighter than emboss)
  const lw = Math.max(0.5, Math.min(bw, bh) * 0.15);
  const shimmer = t > 0 ? Math.sin(t * 2) * 0.15 + 1 : 1;
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      const x = ox + c * bw, y = oy + r * bh;
      const top    = r > 0       && gridRef[r-1]?.[c] === partVal;
      const left   = c > 0       && gridRef[r][c-1] === partVal;
      const bottom = r < gridH-1 && gridRef[r+1]?.[c] === partVal;
      const right  = c < gridW-1 && gridRef[r][c+1] === partVal;
      ctx.lineWidth = lw;
      if (!top) {
        ctx.strokeStyle = `rgba(200,240,255,${0.5 * shimmer})`;
        ctx.beginPath(); ctx.moveTo(x, y + lw/2); ctx.lineTo(x + bw, y + lw/2); ctx.stroke();
      }
      if (!left) {
        ctx.strokeStyle = `rgba(180,230,255,${0.4 * shimmer})`;
        ctx.beginPath(); ctx.moveTo(x + lw/2, y); ctx.lineTo(x + lw/2, y + bh); ctx.stroke();
      }
      if (!bottom) {
        ctx.strokeStyle = `rgba(100,180,220,${0.3 * shimmer})`;
        ctx.beginPath(); ctx.moveTo(x, y + bh - lw/2); ctx.lineTo(x + bw, y + bh - lw/2); ctx.stroke();
      }
      if (!right) {
        ctx.strokeStyle = `rgba(120,190,230,${0.25 * shimmer})`;
        ctx.beginPath(); ctx.moveTo(x + bw - lw/2, y); ctx.lineTo(x + bw - lw/2, y + bh); ctx.stroke();
      }
    }
  }

  // Pass 3: Crystal sparkle points (fewer, larger, cyan-white)
  const cells = [];
  for (let r = 0; r < gridH; r++)
    for (let c = 0; c < gridW; c++)
      if (gridRef[r]?.[c] === partVal) cells.push({ r, c });
  const phase = t > 0 ? Math.floor(t * 1.5) : 0;
  const rng = seededRand(partVal * 311 + phase * 577);
  const count = Math.max(1, Math.floor(cells.length * 0.06));
  for (let i = 0; i < count; i++) {
    const cell = cells[Math.floor(rng() * cells.length)];
    const cx = ox + (cell.c + 0.3 + rng() * 0.4) * bw;
    const cy = oy + (cell.r + 0.3 + rng() * 0.4) * bh;
    const life = t > 0 ? ((t * 1.5 + rng() * 6.28) % 1) : 1;
    const alpha = Math.sin(life * Math.PI) * (0.4 + rng() * 0.6);
    if (alpha < 0.05) continue;
    const sz = bw * (0.2 + rng() * 0.3);
    ctx.shadowBlur = sz * 2;
    ctx.shadowColor = `rgba(180,230,255,${alpha})`;
    ctx.fillStyle = `rgba(220,245,255,${alpha})`;
    // 6-pointed snowflake-ish star
    ctx.beginPath();
    for (let a = 0; a < 6; a++) {
      const ang = a * Math.PI / 3;
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(ang) * sz, cy + Math.sin(ang) * sz);
    }
    ctx.lineWidth = sz * 0.15;
    ctx.strokeStyle = `rgba(220,245,255,${alpha})`;
    ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, sz * 0.15, 0, Math.PI * 2); ctx.fill();
  }
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  ctx.restore();
}

// Canvas-native Flame: animated fire glow rising from bottom edges
function applyCanvasFlame(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time) {
  const fx = partEffects[partVal];
  if (!fx || !fx.flame) return;
  const str = (fx.flame_str ?? 50) / 100;
  const ox = offsetX || 0, oy = offsetY || 0;
  const t = time || 0;

  ctx.save();

  // Pass 1: Warm tint on lower portions
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      const fracY = r / gridH;
      const warmth = Math.max(0, (fracY - 0.3) * 1.4);
      if (warmth > 0) {
        const x = ox + c * bw, y = oy + r * bh;
        ctx.fillStyle = `rgba(255,80,0,${warmth * 0.15 * str})`;
        ctx.fillRect(x, y, bw, bh);
      }
    }
  }

  // Pass 2: Fiery edge glow (bottom and sides, with flicker)
  const glowSize = Math.max(bw, bh) * 0.8;
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      const x = ox + c * bw, y = oy + r * bh;
      const bottom = r < gridH-1 && gridRef[r+1]?.[c] === partVal;
      const left   = c > 0       && gridRef[r][c-1] === partVal;
      const right  = c < gridW-1 && gridRef[r][c+1] === partVal;
      const top    = r > 0       && gridRef[r-1]?.[c] === partVal;

      if (bottom && left && right && top) continue;

      const flicker = t > 0 ? 0.6 + Math.sin(t * 8 + c * 2.3 + r * 1.7) * 0.4 : 1;
      const fracY = r / gridH;
      const heat = 0.3 + fracY * 0.7; // hotter at bottom

      // Color shifts from yellow (top) to red-orange (bottom)
      const rr = 255;
      const gg = Math.round(200 - fracY * 150);
      const bb = Math.round(50 - fracY * 50);
      const alpha = 0.4 * flicker * heat;

      ctx.shadowBlur = glowSize * flicker;
      ctx.shadowColor = `rgba(${rr},${gg},${bb},${alpha})`;
      ctx.strokeStyle = `rgba(${rr},${gg},${bb},${alpha * 0.7})`;
      ctx.lineWidth = Math.max(1, Math.min(bw, bh) * 0.18);

      if (!bottom) { ctx.beginPath(); ctx.moveTo(x, y + bh); ctx.lineTo(x + bw, y + bh); ctx.stroke(); }
      if (!left) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + bh); ctx.stroke(); }
      if (!right) { ctx.beginPath(); ctx.moveTo(x + bw, y); ctx.lineTo(x + bw, y + bh); ctx.stroke(); }
      if (!top) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + bw, y); ctx.stroke(); }
    }
  }

  // Pass 3: Rising ember particles
  const cells = [];
  for (let r = 0; r < gridH; r++)
    for (let c = 0; c < gridW; c++)
      if (gridRef[r]?.[c] === partVal) cells.push({ r, c });
  const phase = t > 0 ? Math.floor(t * 4) : 0;
  const rng = seededRand(partVal * 433 + phase * 821);
  const count = Math.max(1, Math.floor(cells.length * 0.08));
  for (let i = 0; i < count; i++) {
    const cell = cells[Math.floor(rng() * cells.length)];
    const rise = t > 0 ? ((t * 2 + rng() * 10) % 1) : 0;
    const cx = ox + (cell.c + 0.2 + rng() * 0.6) * bw;
    const cy = oy + (cell.r + 0.5 - rise * 0.8) * bh;
    const alpha = Math.sin(rise * Math.PI) * (0.5 + rng() * 0.5);
    if (alpha < 0.05) continue;
    const sz = bw * (0.1 + rng() * 0.15);
    ctx.shadowBlur = sz * 3;
    ctx.shadowColor = `rgba(255,150,0,${alpha})`;
    ctx.fillStyle = `rgba(255,${Math.round(180 + rng() * 75)},0,${alpha})`;
    ctx.beginPath(); ctx.arc(cx, cy, sz, 0, Math.PI * 2); ctx.fill();
  }
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  ctx.restore();
}

// Canvas-native Holy: golden divine radial glow pulsing from center
function applyCanvasHoly(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time) {
  const fx = partEffects[partVal];
  if (!fx || !fx.holy) return;
  const str = (fx.holy_str ?? 50) / 100;
  const ox = offsetX || 0, oy = offsetY || 0;
  const t = time || 0;

  // Find centroid of this part
  let sx = 0, sy = 0, cnt = 0;
  for (let r = 0; r < gridH; r++)
    for (let c = 0; c < gridW; c++)
      if (gridRef[r]?.[c] === partVal) { sx += c; sy += r; cnt++; }
  if (cnt === 0) return;

  ctx.save();
  const centerX = ox + (sx / cnt + 0.5) * bw;
  const centerY = oy + (sy / cnt + 0.5) * bh;
  const maxR = Math.max(gridW * bw, gridH * bh) * 0.6;

  // Pass 1: Golden radial glow from center (pulsing)
  const pulse = (t > 0 ? 0.7 + Math.sin(t * 1.8) * 0.3 : 1) * str;
  const grad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, maxR * pulse);
  grad.addColorStop(0, `rgba(255,230,140,${0.25 * pulse})`);
  grad.addColorStop(0.4, `rgba(255,200,80,${0.12 * pulse})`);
  grad.addColorStop(1, 'rgba(255,180,40,0)');

  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      const x = ox + c * bw, y = oy + r * bh;
      ctx.fillStyle = grad;
      ctx.fillRect(x, y, bw, bh);
    }
  }

  // Pass 2: Bright golden edge highlights
  const lw = Math.max(0.5, Math.min(bw, bh) * 0.12);
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      const x = ox + c * bw, y = oy + r * bh;
      const top    = r > 0       && gridRef[r-1]?.[c] === partVal;
      const left   = c > 0       && gridRef[r][c-1] === partVal;
      const bottom = r < gridH-1 && gridRef[r+1]?.[c] === partVal;
      const right  = c < gridW-1 && gridRef[r][c+1] === partVal;
      if (top && left && bottom && right) continue;

      ctx.lineWidth = lw;
      ctx.shadowBlur = bw * 0.5 * pulse;
      ctx.shadowColor = `rgba(255,210,80,${0.4 * pulse})`;

      if (!top) {
        ctx.strokeStyle = `rgba(255,230,130,${0.4 * pulse})`;
        ctx.beginPath(); ctx.moveTo(x, y + lw/2); ctx.lineTo(x + bw, y + lw/2); ctx.stroke();
      }
      if (!left) {
        ctx.strokeStyle = `rgba(255,220,110,${0.35 * pulse})`;
        ctx.beginPath(); ctx.moveTo(x + lw/2, y); ctx.lineTo(x + lw/2, y + bh); ctx.stroke();
      }
      if (!bottom) {
        ctx.strokeStyle = `rgba(200,170,60,${0.3 * pulse})`;
        ctx.beginPath(); ctx.moveTo(x, y + bh - lw/2); ctx.lineTo(x + bw, y + bh - lw/2); ctx.stroke();
      }
      if (!right) {
        ctx.strokeStyle = `rgba(210,180,70,${0.25 * pulse})`;
        ctx.beginPath(); ctx.moveTo(x + bw - lw/2, y); ctx.lineTo(x + bw - lw/2, y + bh); ctx.stroke();
      }
    }
  }

  // Pass 3: Floating light motes
  const cells = [];
  for (let r = 0; r < gridH; r++)
    for (let c = 0; c < gridW; c++)
      if (gridRef[r]?.[c] === partVal) cells.push({ r, c });
  const phase = t > 0 ? Math.floor(t * 2) : 0;
  const rng = seededRand(partVal * 199 + phase * 641);
  const moteCount = Math.max(1, Math.floor(cells.length * 0.05));
  for (let i = 0; i < moteCount; i++) {
    const cell = cells[Math.floor(rng() * cells.length)];
    const float = t > 0 ? ((t * 0.8 + rng() * 10) % 1) : 0.5;
    const cx = ox + (cell.c + 0.3 + rng() * 0.4) * bw;
    const cy = oy + (cell.r + 0.8 - float * 0.6) * bh;
    const alpha = Math.sin(float * Math.PI) * (0.5 + rng() * 0.5);
    if (alpha < 0.05) continue;
    const sz = bw * (0.12 + rng() * 0.12);
    ctx.shadowBlur = sz * 4;
    ctx.shadowColor = `rgba(255,220,100,${alpha})`;
    ctx.fillStyle = `rgba(255,240,180,${alpha})`;
    ctx.beginPath(); ctx.arc(cx, cy, sz, 0, Math.PI * 2); ctx.fill();
  }
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  ctx.restore();
}

// Canvas-native Shadow: dark purple-black aura creeping along edges
function applyCanvasShadow(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time) {
  const fx = partEffects[partVal];
  if (!fx || !fx.shadow) return;
  const str = (fx.shadow_str ?? 50) / 100;
  const ox = offsetX || 0, oy = offsetY || 0;
  const t = time || 0;
  const pulse = (t > 0 ? 0.7 + Math.sin(t * 2) * 0.3 : 1) * str;
  const drift = t > 0 ? t * 0.5 : 0;

  ctx.save();

  // Pass 1: Dark inner overlay (darkens the part)
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      const x = ox + c * bw, y = oy + r * bh;
      const wave = Math.sin(c * 0.8 + r * 0.6 + drift) * 0.5 + 0.5;
      ctx.fillStyle = `rgba(20,0,40,${0.08 + 0.06 * wave * pulse})`;
      ctx.fillRect(x, y, bw, bh);
    }
  }

  // Pass 2: Dark glowing edges with shadowBlur
  const glowSize = Math.max(bw, bh) * 0.7;
  ctx.lineWidth = Math.max(1, Math.min(bw, bh) * 0.2);

  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      const x = ox + c * bw, y = oy + r * bh;
      const top    = r > 0       && gridRef[r-1]?.[c] === partVal;
      const left   = c > 0       && gridRef[r][c-1] === partVal;
      const bottom = r < gridH-1 && gridRef[r+1]?.[c] === partVal;
      const right  = c < gridW-1 && gridRef[r][c+1] === partVal;
      if (top && left && bottom && right) continue;

      const wave = Math.sin(c * 1.2 + r * 0.9 + drift * 2) * 0.5 + 0.5;
      const rr = Math.round(60 + 40 * wave);
      const gg = 0;
      const bb = Math.round(80 + 60 * (1 - wave));
      const alpha = 0.45 * pulse;

      ctx.shadowBlur = glowSize * pulse;
      ctx.shadowColor = `rgba(${rr},${gg},${bb},${alpha})`;
      ctx.strokeStyle = `rgba(${rr},${gg},${bb},${alpha * 0.6})`;

      if (!top) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + bw, y); ctx.stroke(); }
      if (!bottom) { ctx.beginPath(); ctx.moveTo(x, y + bh); ctx.lineTo(x + bw, y + bh); ctx.stroke(); }
      if (!left) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + bh); ctx.stroke(); }
      if (!right) { ctx.beginPath(); ctx.moveTo(x + bw, y); ctx.lineTo(x + bw, y + bh); ctx.stroke(); }
    }
  }

  // Pass 3: Shadow wisps (dark particles drifting)
  const cells = [];
  for (let r = 0; r < gridH; r++)
    for (let c = 0; c < gridW; c++)
      if (gridRef[r]?.[c] === partVal) cells.push({ r, c });
  const phase = t > 0 ? Math.floor(t * 2.5) : 0;
  const rng = seededRand(partVal * 557 + phase * 733);
  const count = Math.max(1, Math.floor(cells.length * 0.06));
  for (let i = 0; i < count; i++) {
    const cell = cells[Math.floor(rng() * cells.length)];
    const driftX = t > 0 ? Math.sin(t * 1.5 + rng() * 10) * 0.3 : 0;
    const cx = ox + (cell.c + 0.5 + driftX) * bw;
    const cy = oy + (cell.r + 0.3 + rng() * 0.4) * bh;
    const alpha = (0.3 + rng() * 0.4) * pulse;
    const sz = bw * (0.15 + rng() * 0.2);
    ctx.shadowBlur = sz * 2;
    ctx.shadowColor = `rgba(60,0,80,${alpha})`;
    ctx.fillStyle = `rgba(40,0,60,${alpha * 0.5})`;
    ctx.beginPath(); ctx.arc(cx, cy, sz, 0, Math.PI * 2); ctx.fill();
  }
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  ctx.restore();
}

// Canvas-native Holographic: animated rainbow hue shift across the part
function applyCanvasHolographic(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time) {
  const fx = partEffects[partVal];
  if (!fx || !fx.holographic) return;
  const str = (fx.holographic_str ?? 50) / 100;
  const ox = offsetX || 0, oy = offsetY || 0;
  const t = time || 0;

  ctx.save();

  // Pass 1: Rainbow tint that shifts with position and time
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      const x = ox + c * bw, y = oy + r * bh;
      // Hue based on position + time
      const hue = ((c / gridW + r / gridH) * 180 + (t > 0 ? t * 60 : 0)) % 360;
      const alpha = (0.15 + Math.sin((c + r) * 0.5 + (t > 0 ? t * 2 : 0)) * 0.05) * str;
      ctx.fillStyle = `hsla(${hue},80%,60%,${alpha})`;
      ctx.fillRect(x, y, bw, bh);
    }
  }

  // Pass 2: Iridescent edge highlights
  const lw = Math.max(0.5, Math.min(bw, bh) * 0.12);
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      const x = ox + c * bw, y = oy + r * bh;
      const top    = r > 0       && gridRef[r-1]?.[c] === partVal;
      const left   = c > 0       && gridRef[r][c-1] === partVal;
      const bottom = r < gridH-1 && gridRef[r+1]?.[c] === partVal;
      const right  = c < gridW-1 && gridRef[r][c+1] === partVal;
      if (top && left && bottom && right) continue;

      const hue = ((c / gridW + r / gridH) * 180 + (t > 0 ? t * 80 : 0)) % 360;
      ctx.lineWidth = lw;
      ctx.shadowBlur = bw * 0.4;
      ctx.shadowColor = `hsla(${hue},90%,70%,0.3)`;

      if (!top) {
        ctx.strokeStyle = `hsla(${hue},90%,80%,0.4)`;
        ctx.beginPath(); ctx.moveTo(x, y + lw/2); ctx.lineTo(x + bw, y + lw/2); ctx.stroke();
      }
      if (!left) {
        ctx.strokeStyle = `hsla(${(hue+30)%360},90%,75%,0.35)`;
        ctx.beginPath(); ctx.moveTo(x + lw/2, y); ctx.lineTo(x + lw/2, y + bh); ctx.stroke();
      }
      if (!bottom) {
        ctx.strokeStyle = `hsla(${(hue+60)%360},80%,50%,0.3)`;
        ctx.beginPath(); ctx.moveTo(x, y + bh - lw/2); ctx.lineTo(x + bw, y + bh - lw/2); ctx.stroke();
      }
      if (!right) {
        ctx.strokeStyle = `hsla(${(hue+90)%360},80%,55%,0.25)`;
        ctx.beginPath(); ctx.moveTo(x + bw - lw/2, y); ctx.lineTo(x + bw - lw/2, y + bh); ctx.stroke();
      }
    }
  }

  // Pass 3: Moving shine band (like a holographic card tilt)
  const bandPos = t > 0 ? ((t * 0.3) % 2.0) - 0.5 : 0.5;
  const bandWidth = 0.2;
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      const diag = (c / gridW + r / gridH) / 2;
      const dist = Math.abs(diag - bandPos);
      if (dist < bandWidth) {
        const intensity = 1 - dist / bandWidth;
        const shine = intensity * intensity;
        const x = ox + c * bw, y = oy + r * bh;
        ctx.fillStyle = `rgba(255,255,255,${shine * 0.3})`;
        ctx.fillRect(x, y, bw, bh);
      }
    }
  }

  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  ctx.restore();
}

// Canvas-native Outline: dark border around part silhouette edges
function applyCanvasOutline(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY) {
  const fx = partEffects[partVal];
  if (!fx || !fx.outline) return;
  const str = (fx.outline_str ?? 50) / 100;
  const ox = offsetX || 0, oy = offsetY || 0;
  const baseColor = customColors[partVal] || '#888888';
  const outColor = adjustBrightness(baseColor, -80);
  const [oR, oG, oB] = hexToRgb(outColor);
  const lw = Math.max(0.5, Math.min(bw, bh) * 0.18 * str);

  ctx.save();
  ctx.strokeStyle = `rgba(${oR},${oG},${oB},${0.7 * str})`;
  ctx.lineWidth = lw;

  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      const x = ox + c * bw, y = oy + r * bh;
      const top    = r > 0       && gridRef[r-1]?.[c] === partVal;
      const left   = c > 0       && gridRef[r][c-1] === partVal;
      const bottom = r < gridH-1 && gridRef[r+1]?.[c] === partVal;
      const right  = c < gridW-1 && gridRef[r][c+1] === partVal;
      if (top && left && bottom && right) continue;
      if (!top)    { ctx.beginPath(); ctx.moveTo(x, y + lw/2); ctx.lineTo(x + bw, y + lw/2); ctx.stroke(); }
      if (!bottom) { ctx.beginPath(); ctx.moveTo(x, y + bh - lw/2); ctx.lineTo(x + bw, y + bh - lw/2); ctx.stroke(); }
      if (!left)   { ctx.beginPath(); ctx.moveTo(x + lw/2, y); ctx.lineTo(x + lw/2, y + bh); ctx.stroke(); }
      if (!right)  { ctx.beginPath(); ctx.moveTo(x + bw - lw/2, y); ctx.lineTo(x + bw - lw/2, y + bh); ctx.stroke(); }
    }
  }
  ctx.restore();
}

// Canvas-native Blink: periodic blink animation (brief invisibility)
function applyCanvasBlink(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time) {
  const fx = partEffects[partVal];
  if (!fx || !fx.blink) return;
  const str = (fx.blink_str ?? 50) / 100;
  const ox = offsetX || 0, oy = offsetY || 0;
  const t = time || 0;
  if (t === 0) return; // no blink in static mode

  const cycle = t % (3 + partVal * 0.7);
  const blinking = cycle > 2.85;
  if (!blinking) return;

  ctx.save();
  ctx.fillStyle = `rgba(0,0,0,${0.8 * str})`;
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      ctx.fillRect(ox + c * bw, oy + r * bh, bw, bh);
    }
  }
  ctx.restore();
}

// Canvas-native Glow: inner glow using part's base color with pulsing
function applyCanvasGlow(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time) {
  const fx = partEffects[partVal];
  if (!fx || !fx.glow) return;
  const str = (fx.glow_str ?? 50) / 100;
  const ox = offsetX || 0, oy = offsetY || 0;
  const t = time || 0;
  const baseColor = customColors[partVal] || '#888888';
  const [bR, bG, bB] = hexToRgb(baseColor);
  const pulse = t > 0 ? 0.6 + Math.sin(t * 2.5) * 0.4 : 1;

  ctx.save();

  // Pass 1: Soft glow overlay on all cells
  const glowAlpha = 0.2 * str * pulse;
  ctx.shadowBlur = Math.max(bw, bh) * 0.8 * str;
  ctx.shadowColor = `rgba(${bR},${bG},${bB},${0.6 * str * pulse})`;
  ctx.fillStyle = `rgba(${bR},${bG},${bB},${glowAlpha})`;
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      ctx.fillRect(ox + c * bw, oy + r * bh, bw, bh);
    }
  }

  // Pass 2: Brighter edge glow
  const brightR = Math.min(255, bR + 80), brightG = Math.min(255, bG + 80), brightB = Math.min(255, bB + 80);
  ctx.shadowBlur = Math.max(bw, bh) * 1.2 * str;
  ctx.shadowColor = `rgba(${brightR},${brightG},${brightB},${0.4 * str * pulse})`;
  const lw = Math.max(0.5, Math.min(bw, bh) * 0.15 * str);
  ctx.lineWidth = lw;
  ctx.strokeStyle = `rgba(${brightR},${brightG},${brightB},${0.3 * str * pulse})`;
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      const x = ox + c * bw, y = oy + r * bh;
      const top    = r > 0       && gridRef[r-1]?.[c] === partVal;
      const left   = c > 0       && gridRef[r][c-1] === partVal;
      const bottom = r < gridH-1 && gridRef[r+1]?.[c] === partVal;
      const right  = c < gridW-1 && gridRef[r][c+1] === partVal;
      if (top && left && bottom && right) continue;
      if (!top)    { ctx.beginPath(); ctx.moveTo(x, y + lw/2); ctx.lineTo(x + bw, y + lw/2); ctx.stroke(); }
      if (!bottom) { ctx.beginPath(); ctx.moveTo(x, y + bh - lw/2); ctx.lineTo(x + bw, y + bh - lw/2); ctx.stroke(); }
      if (!left)   { ctx.beginPath(); ctx.moveTo(x + lw/2, y); ctx.lineTo(x + lw/2, y + bh); ctx.stroke(); }
      if (!right)  { ctx.beginPath(); ctx.moveTo(x + bw - lw/2, y); ctx.lineTo(x + bw - lw/2, y + bh); ctx.stroke(); }
    }
  }
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  ctx.restore();
}

// Canvas-native Ethereal: semi-transparent ghostly overlay with pulsing
function applyCanvasEthereal(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time) {
  const fx = partEffects[partVal];
  if (!fx || !fx.ethereal) return;
  const str = (fx.ethereal_str ?? 50) / 100;
  const ox = offsetX || 0, oy = offsetY || 0;
  const t = time || 0;
  const pulse = t > 0 ? 0.7 + Math.sin(t * 1.5) * 0.3 : 1;

  ctx.save();
  const alpha = 0.2 * str * pulse;
  ctx.fillStyle = `rgba(200,220,255,${alpha})`;
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      ctx.fillRect(ox + c * bw, oy + r * bh, bw, bh);
    }
  }

  // Bright silhouette shimmer
  const shimAlpha = 0.1 * str * pulse;
  ctx.shadowBlur = Math.max(bw, bh) * 0.5 * str;
  ctx.shadowColor = `rgba(180,200,255,${0.3 * str * pulse})`;
  ctx.fillStyle = `rgba(220,230,255,${shimAlpha})`;
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      const wave = Math.sin((r / gridH) * 6 + (t > 0 ? t * 2 : 0)) * 0.5 + 0.5;
      ctx.globalAlpha = shimAlpha * wave;
      ctx.fillRect(ox + c * bw, oy + r * bh, bw, bh);
    }
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  ctx.restore();
}

// Canvas-native Drip: liquid dripping from bottom edges
function applyCanvasDrip(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time) {
  const fx = partEffects[partVal];
  if (!fx || !fx.drip) return;
  const str = (fx.drip_str ?? 50) / 100;
  const ox = offsetX || 0, oy = offsetY || 0;
  const t = time || 0;
  const baseColor = customColors[partVal] || '#888888';
  const [bR, bG, bB] = hexToRgb(baseColor);

  // Find bottom-edge cells (cell has the part, but cell below does not)
  const bottomEdges = [];
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      const below = r < gridH - 1 && gridRef[r+1]?.[c] === partVal;
      if (!below) bottomEdges.push({ r, c });
    }
  }
  if (bottomEdges.length === 0) return;

  ctx.save();
  const rng = seededRand(partVal * 431);
  const dripCount = Math.max(1, Math.floor(bottomEdges.length * 0.3 * str));
  for (let i = 0; i < dripCount; i++) {
    const edge = bottomEdges[Math.floor(rng() * bottomEdges.length)];
    const dropSpeed = 0.5 + rng() * 1.0;
    const dropPhase = t > 0 ? ((t * dropSpeed + rng() * 10) % 2.5) : 0;
    const dropY = dropPhase * bh * 1.2;
    const dropAlpha = Math.max(0, 1 - dropPhase / 2.5) * str;
    if (dropAlpha < 0.05) continue;

    const cx = ox + (edge.c + 0.3 + rng() * 0.4) * bw;
    const cy = oy + (edge.r + 1) * bh + dropY;
    const dropW = bw * (0.15 + rng() * 0.15) * str;
    const dropH = bh * (0.3 + rng() * 0.3) * str;

    ctx.fillStyle = `rgba(${bR},${bG},${bB},${dropAlpha * 0.7})`;
    ctx.beginPath();
    ctx.ellipse(cx, cy, dropW, dropH, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// Canvas-native Poison: toxic green-purple bubbling effect
function applyCanvasPoison(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time) {
  const fx = partEffects[partVal];
  if (!fx || !fx.poison) return;
  const str = (fx.poison_str ?? 50) / 100;
  const ox = offsetX || 0, oy = offsetY || 0;
  const t = time || 0;

  ctx.save();

  // Pass 1: Green-purple tint overlay
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      const x = ox + c * bw, y = oy + r * bh;
      const wave = Math.sin((c * 0.5 + r * 0.3) + (t > 0 ? t * 1.5 : 0)) * 0.5 + 0.5;
      const greenA = 0.1 * str * (1 - wave);
      const purpleA = 0.08 * str * wave;
      ctx.fillStyle = `rgba(0,255,80,${greenA})`;
      ctx.fillRect(x, y, bw, bh);
      ctx.fillStyle = `rgba(160,0,200,${purpleA})`;
      ctx.fillRect(x, y, bw, bh);
    }
  }

  // Pass 2: Rising bubbles from bottom edges
  const bottomEdges = [];
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      const below = r < gridH - 1 && gridRef[r+1]?.[c] === partVal;
      if (!below) bottomEdges.push({ r, c });
    }
  }
  const phase = t > 0 ? Math.floor(t * 3) : 0;
  const rng = seededRand(partVal * 613 + phase * 337);
  const bubbleCount = Math.max(1, Math.floor(bottomEdges.length * 0.2 * str));
  for (let i = 0; i < bubbleCount; i++) {
    const edge = bottomEdges.length > 0 ? bottomEdges[Math.floor(rng() * bottomEdges.length)] : { r: gridH - 1, c: Math.floor(rng() * gridW) };
    const rise = t > 0 ? ((t * 1.5 + rng() * 10) % 2) : 0;
    const cx = ox + (edge.c + 0.2 + rng() * 0.6) * bw;
    const cy = oy + (edge.r + 1 - rise * 1.5) * bh;
    const alpha = Math.sin(rise / 2 * Math.PI) * str * (0.4 + rng() * 0.4);
    if (alpha < 0.05) continue;
    const sz = bw * (0.1 + rng() * 0.15) * str;
    const isGreen = rng() > 0.4;
    ctx.shadowBlur = sz * 2;
    ctx.shadowColor = isGreen ? `rgba(0,255,80,${alpha})` : `rgba(160,0,200,${alpha})`;
    ctx.fillStyle = isGreen ? `rgba(50,255,100,${alpha})` : `rgba(180,50,220,${alpha})`;
    ctx.beginPath(); ctx.arc(cx, cy, sz, 0, Math.PI * 2); ctx.fill();
  }
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  ctx.restore();
}

// Canvas-native Wood: vertical wood grain pattern
function applyCanvasWood(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY) {
  const fx = partEffects[partVal];
  if (!fx || !fx.wood) return;
  const str = (fx.wood_str ?? 50) / 100;
  const ox = offsetX || 0, oy = offsetY || 0;

  ctx.save();

  // Pass 1: Warm brown tint
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      ctx.fillStyle = `rgba(120,80,30,${0.1 * str})`;
      ctx.fillRect(ox + c * bw, oy + r * bh, bw, bh);
    }
  }

  // Pass 2: Vertical grain lines
  const rng = seededRand(partVal * 271);
  const grainCount = Math.max(3, Math.floor(gridW * 0.8));
  ctx.lineWidth = Math.max(0.5, bw * 0.08 * str);

  for (let i = 0; i < grainCount; i++) {
    const grainX = rng() * gridW;
    const alpha = (0.08 + rng() * 0.12) * str;
    const dark = rng() > 0.5;
    ctx.strokeStyle = dark ? `rgba(60,30,0,${alpha})` : `rgba(160,120,60,${alpha})`;
    ctx.beginPath();
    for (let r = 0; r < gridH; r++) {
      const c = Math.floor(grainX + Math.sin(r * 0.3 + i) * 0.5);
      if (c < 0 || c >= gridW || gridRef[r]?.[c] !== partVal) continue;
      const x = ox + (grainX + Math.sin(r * 0.3 + i) * 0.5) * bw;
      const y = oy + r * bh;
      if (r === 0 || gridRef[r-1]?.[c] !== partVal) ctx.moveTo(x, y);
      else ctx.lineTo(x, y + bh);
    }
    ctx.stroke();
  }
  ctx.restore();
}

// Canvas-native Stone: gray noise overlay + crack lines
function applyCanvasStone(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY) {
  const fx = partEffects[partVal];
  if (!fx || !fx.stone) return;
  const str = (fx.stone_str ?? 50) / 100;
  const ox = offsetX || 0, oy = offsetY || 0;

  ctx.save();

  // Pass 1: Gray desaturation overlay
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      const rng = seededRand(r * 137 + c * 59 + partVal * 23);
      const noise = (rng() - 0.5) * 40 * str;
      const gray = 128 + noise;
      ctx.fillStyle = `rgba(${Math.round(gray)},${Math.round(gray)},${Math.round(gray)},${0.15 * str})`;
      ctx.fillRect(ox + c * bw, oy + r * bh, bw, bh);
    }
  }

  // Pass 2: Crack lines
  const rng = seededRand(partVal * 389);
  const crackCount = Math.max(1, Math.floor(Math.sqrt(gridW * gridH) * 0.3 * str));
  ctx.strokeStyle = `rgba(40,35,30,${0.25 * str})`;
  ctx.lineWidth = Math.max(0.5, Math.min(bw, bh) * 0.06 * str);

  for (let i = 0; i < crackCount; i++) {
    let cx = Math.floor(rng() * gridW);
    let cy = Math.floor(rng() * gridH);
    if (gridRef[cy]?.[cx] !== partVal) continue;
    ctx.beginPath();
    ctx.moveTo(ox + (cx + 0.5) * bw, oy + (cy + 0.5) * bh);
    const segments = 3 + Math.floor(rng() * 4);
    for (let s = 0; s < segments; s++) {
      cx += Math.floor(rng() * 3) - 1;
      cy += Math.floor(rng() * 2);
      if (cx < 0 || cx >= gridW || cy < 0 || cy >= gridH) break;
      if (gridRef[cy]?.[cx] !== partVal) break;
      ctx.lineTo(ox + (cx + 0.5) * bw, oy + (cy + 0.5) * bh);
    }
    ctx.stroke();
  }
  ctx.restore();
}

// Canvas-native Marble: smooth surface with serpentine dark veins
function applyCanvasMarble(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY) {
  const fx = partEffects[partVal];
  if (!fx || !fx.marble) return;
  const str = (fx.marble_str ?? 50) / 100;
  const ox = offsetX || 0, oy = offsetY || 0;

  ctx.save();

  // Pass 1: Slight brightening overlay
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      ctx.fillStyle = `rgba(240,240,245,${0.08 * str})`;
      ctx.fillRect(ox + c * bw, oy + r * bh, bw, bh);
    }
  }

  // Pass 2: Serpentine vein lines using sin-based paths
  const rng = seededRand(partVal * 523);
  const veinCount = Math.max(1, Math.floor(Math.sqrt(gridW * gridH) * 0.25 * str));
  ctx.lineWidth = Math.max(0.5, Math.min(bw, bh) * 0.08 * str);

  for (let i = 0; i < veinCount; i++) {
    const startY = rng() * gridH;
    const startX = rng() * gridW;
    const freq = 0.3 + rng() * 0.5;
    const amp = 0.5 + rng() * 1.5;
    const alpha = (0.1 + rng() * 0.15) * str;
    ctx.strokeStyle = `rgba(60,50,70,${alpha})`;
    ctx.beginPath();
    let started = false;
    for (let step = 0; step < gridW * 1.5; step++) {
      const x = startX + step * 0.3;
      const y = startY + Math.sin(step * freq + i * 2) * amp;
      const gx = Math.floor(x), gy = Math.floor(y);
      if (gx < 0 || gx >= gridW || gy < 0 || gy >= gridH) { started = false; continue; }
      if (gridRef[gy]?.[gx] !== partVal) { started = false; continue; }
      const px = ox + x * bw, py = oy + y * bh;
      if (!started) { ctx.moveTo(px, py); started = true; }
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  ctx.restore();
}

// Canvas-native Fur: short diagonal hair strokes with highlighted tips
function applyCanvasFur(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time) {
  const fx = partEffects[partVal];
  if (!fx || !fx.fur) return;
  const str = (fx.fur_str ?? 50) / 100;
  const ox = offsetX || 0, oy = offsetY || 0;
  const t = time || 0;

  ctx.save();

  // Pass 1: Warm tint
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      ctx.fillStyle = `rgba(140,110,70,${0.06 * str})`;
      ctx.fillRect(ox + c * bw, oy + r * bh, bw, bh);
    }
  }

  // Pass 2: Hair strokes
  const rng = seededRand(partVal * 347);
  const cells = [];
  for (let r = 0; r < gridH; r++)
    for (let c = 0; c < gridW; c++)
      if (gridRef[r]?.[c] === partVal) cells.push({ r, c });

  const hairCount = Math.max(2, Math.floor(cells.length * 0.3 * str));
  const sway = t > 0 ? Math.sin(t * 1.8) * 0.15 : 0;

  for (let i = 0; i < hairCount; i++) {
    const cell = cells[Math.floor(rng() * cells.length)];
    const startX = ox + (cell.c + 0.2 + rng() * 0.6) * bw;
    const startY = oy + (cell.r + 0.2 + rng() * 0.6) * bh;
    const angle = -0.5 + rng() * 1.0 + sway; // mostly downward-diagonal
    const len = bh * (0.3 + rng() * 0.4) * str;
    const endX = startX + Math.sin(angle) * len;
    const endY = startY + Math.cos(angle) * len;

    // Hair strand
    const alpha = (0.15 + rng() * 0.2) * str;
    ctx.strokeStyle = `rgba(80,60,30,${alpha})`;
    ctx.lineWidth = Math.max(0.3, bw * 0.04 * str);
    ctx.beginPath(); ctx.moveTo(startX, startY); ctx.lineTo(endX, endY); ctx.stroke();

    // Highlighted tip
    ctx.strokeStyle = `rgba(200,180,140,${alpha * 0.8})`;
    ctx.lineWidth = Math.max(0.2, bw * 0.03 * str);
    const midX = (startX + endX) / 2, midY = (startY + endY) / 2;
    ctx.beginPath(); ctx.moveTo(midX, midY); ctx.lineTo(endX, endY); ctx.stroke();
  }
  ctx.restore();
}

// Canvas-native Scales: diamond-shaped repeating pattern
function applyCanvasScales(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time) {
  const fx = partEffects[partVal];
  if (!fx || !fx.scales) return;
  const str = (fx.scales_str ?? 50) / 100;
  const ox = offsetX || 0, oy = offsetY || 0;
  const t = time || 0;

  ctx.save();

  // Pass 1: Subtle green shift
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      ctx.fillStyle = `rgba(0,60,20,${0.06 * str})`;
      ctx.fillRect(ox + c * bw, oy + r * bh, bw, bh);
    }
  }

  // Pass 2: Diamond scale pattern
  const scaleW = bw * 0.8;
  const scaleH = bh * 0.6;
  const shimmer = t > 0 ? Math.sin(t * 1.2) * 0.1 : 0;

  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      const x = ox + c * bw + bw / 2;
      const y = oy + r * bh + bh / 2;
      const offsetRow = r % 2 === 0 ? 0 : bw * 0.4;

      // Diamond shape
      const alpha = (0.12 + shimmer) * str;

      // Highlight top edge of scale
      ctx.strokeStyle = `rgba(200,220,180,${alpha})`;
      ctx.lineWidth = Math.max(0.3, bw * 0.05 * str);
      ctx.beginPath();
      ctx.moveTo(x - scaleW/2 + offsetRow, y);
      ctx.lineTo(x + offsetRow, y - scaleH/2);
      ctx.lineTo(x + scaleW/2 + offsetRow, y);
      ctx.stroke();

      // Shadow bottom edge of scale
      ctx.strokeStyle = `rgba(20,40,10,${alpha * 0.8})`;
      ctx.beginPath();
      ctx.moveTo(x - scaleW/2 + offsetRow, y);
      ctx.lineTo(x + offsetRow, y + scaleH/2);
      ctx.lineTo(x + scaleW/2 + offsetRow, y);
      ctx.stroke();
    }
  }
  ctx.restore();
}

// Canvas-native Tint: hue rotation overlay
function applyCanvasTint(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY) {
  const fx = partEffects[partVal];
  if (!fx || !fx.tint) return;
  const str = (fx.tint_str ?? 50) / 100;
  const ox = offsetX || 0, oy = offsetY || 0;
  const degrees = str * 360; // full range

  ctx.save();

  // Use hue-rotate filter if available, otherwise overlay approach
  const hue = degrees % 360;
  for (let r = 0; r < gridH; r++) {
    for (let c = 0; c < gridW; c++) {
      if (gridRef[r]?.[c] !== partVal) continue;
      const x = ox + c * bw, y = oy + r * bh;
      // Use HSL overlay at the target hue with blend
      ctx.fillStyle = `hsla(${hue},70%,50%,0.2)`;
      ctx.fillRect(x, y, bw, bh);
    }
  }
  ctx.restore();
}

// Unified helper: apply all canvas-native effects in the correct order
// Order: Gradient > Forged > Wood > Stone > Marble > Fur > Scales > Frost > Flame > Holy > Shadow > Arcane > Moss > Poison > Holographic > Ethereal > Emboss > Outline > Glow > Sparkle > Blink > Drip > Tint
function applyAllCanvasEffects(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time) {
  const fx = partEffects[partVal];
  if (!fx) return;
  if (fx.gradient)    applyCanvasGradient(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY);
  if (fx.forged)      applyCanvasForged(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time);
  if (fx.wood)        applyCanvasWood(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY);
  if (fx.stone)       applyCanvasStone(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY);
  if (fx.marble)      applyCanvasMarble(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY);
  if (fx.fur)         applyCanvasFur(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time);
  if (fx.scales)      applyCanvasScales(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time);
  if (fx.frost)       applyCanvasFrost(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time);
  if (fx.flame)       applyCanvasFlame(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time);
  if (fx.holy)        applyCanvasHoly(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time);
  if (fx.shadow)      applyCanvasShadow(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time);
  if (fx.arcane)      applyCanvasArcane(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time);
  if (fx.poison)      applyCanvasPoison(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time);
  if (fx.holographic) applyCanvasHolographic(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time);
  if (fx.ethereal)    applyCanvasEthereal(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time);
  if (fx.emboss)      applyCanvasEmboss(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY);
  if (fx.outline)     applyCanvasOutline(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY);
  if (fx.glow)        applyCanvasGlow(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time);
  if (fx.sparkle)     applyCanvasSparkle(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time);
  if (fx.blink)       applyCanvasBlink(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time);
  if (fx.drip)        applyCanvasDrip(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY, time);
  if (fx.tint)        applyCanvasTint(ctx, partVal, gridRef, gridW, gridH, bw, bh, offsetX, offsetY);
}

// Check if any animated effect is active
const FX_ANIMATED = ['sparkle', 'arcane', 'moss', 'forged', 'frost', 'flame', 'holy', 'shadow', 'holographic', 'blink', 'glow', 'drip', 'poison', 'fur', 'scales', 'ethereal'];
function hasAnimatedFx() {
  return Object.values(partEffects).some(fx =>
    fx && FX_ANIMATED.some(id => fx[id] === true)
  );
}

// Effect animation loop — runs alongside (not conflicting with) part animations
function startFxAnimLoop() {
  if (fxAnimId) return; // already running
  const t0 = performance.now();
  function tick(now) {
    fxAnimTime = (now - t0) / 1000;
    render(); // update both grid and preview with animated effects
    if (hasAnimatedFx()) fxAnimId = requestAnimationFrame(tick);
    else { fxAnimId = null; fxAnimTime = 0; }
  }
  fxAnimId = requestAnimationFrame(tick);
}

function stopFxAnimLoop() {
  if (fxAnimId) { cancelAnimationFrame(fxAnimId); fxAnimId = null; }
  fxAnimTime = 0;
}

function render() { renderGrid(); updateEditorPreview(); }

// ── Grid interaction ──
function getPointerXY(e) {
  if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  if (e.changedTouches && e.changedTouches.length > 0) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}
function cellFromEvent(e) {
  const rect = gridCanvas.getBoundingClientRect();
  const { x: cx, y: cy } = getPointerXY(e);
  const col = Math.floor((cx - rect.left) / rect.width * GRID_W);
  const row = Math.floor((cy - rect.top) / rect.height * GRID_H);
  if (col < 0 || col >= GRID_W || row < 0 || row >= GRID_H) return null;
  return { row, col };
}
function startPaint(e) {
  e.preventDefault(); const cell = cellFromEvent(e); if (!cell) return;
  pushUndo(); isPainting = true;
  paintVal = grid[cell.row][cell.col] === selectedColor ? 0 : selectedColor;
  if (paintVal !== 0 && !partVisible[paintVal]) return;
  grid[cell.row][cell.col] = paintVal; render();
}
function movePaint(e) {
  e.preventDefault(); if (!isPainting) return; const cell = cellFromEvent(e); if (!cell) return;
  if (paintVal !== 0 && !partVisible[paintVal]) return;
  grid[cell.row][cell.col] = paintVal; render();
}
function endPaint() { isPainting = false; }
gridCanvas.addEventListener('mousedown', startPaint);
gridCanvas.addEventListener('mousemove', movePaint);
document.addEventListener('mouseup', endPaint);
gridCanvas.addEventListener('touchstart', startPaint, { passive: false });
gridCanvas.addEventListener('touchmove', movePaint, { passive: false });
document.addEventListener('touchend', endPaint);

// ── Tools ──
function clearGrid() { pushUndo(); grid = Array.from({length:GRID_H}, ()=>new Int8Array(GRID_W)); render(); toast(T('toast-cleared')); }
function fillSelected() { pushUndo(); for(let r=0;r<GRID_H;r++) for(let c=0;c<GRID_W;c++) if(grid[r][c]===0) grid[r][c]=selectedColor; render(); toast(T('toast-filled')); }
function clearPart() { pushUndo(); for(let r=0;r<GRID_H;r++) for(let c=0;c<GRID_W;c++) if(grid[r][c]===selectedColor) grid[r][c]=0; render(); toast(T('toast-part-cleared')); }

// ── Image Import ──
let importedImageData = null;
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.classList.remove('drag-over'); const f=e.dataTransfer.files[0]; if(f&&f.type.startsWith('image/')) loadImageFile(f); });
fileInput.addEventListener('change', () => { const f=fileInput.files[0]; if(f) loadImageFile(f); });

function loadImageFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const cvs = document.createElement('canvas'); cvs.width = GRID_W; cvs.height = GRID_H;
      const ctx = cvs.getContext('2d'); ctx.imageSmoothingEnabled = true;
      ctx.drawImage(img, 0, 0, GRID_W, GRID_H);
      importedImageData = ctx.getImageData(0, 0, GRID_W, GRID_H);
      document.getElementById('applyImportBtn').disabled = false;
      toast(T('toast-image-loaded'));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function applyImportedImage() {
  if (!importedImageData) return; pushUndo();
  const mode = document.getElementById('mapMode').value, data = importedImageData.data;
  for (let r=0;r<GRID_H;r++) for (let c=0;c<GRID_W;c++) {
    const idx=(r*GRID_W+c)*4, pr=data[idx], pg=data[idx+1], pb=data[idx+2], pa=data[idx+3];
    if (pa < 30) { grid[r][c]=0; continue; }
    if (mode==='brightness') { grid[r][c]=(0.299*pr+0.587*pg+0.114*pb)/255<0.9?1:0; }
    else { grid[r][c]=findNearestPart(pr,pg,pb); }
  }
  render(); importedImageData=null; document.getElementById('applyImportBtn').disabled=true;
}

function findNearestPart(r,g,b) {
  let best=Infinity, val=0;
  for (let i=1;i<PART_TYPES.length;i++) {
    const hex=customColors[PART_TYPES[i].value];
    const pr=parseInt(hex.slice(1,3),16), pg=parseInt(hex.slice(3,5),16), pb=parseInt(hex.slice(5,7),16);
    const d=(r-pr)**2*0.299+(g-pg)**2*0.587+(b-pb)**2*0.114;
    if (d<best) { best=d; val=PART_TYPES[i].value; }
  }
  if ((0.299*r+0.587*g+0.114*b)/255>0.92 && best>2000) return 0;
  return val;
}
