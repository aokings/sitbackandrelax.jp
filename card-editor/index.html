// ── Animation Drawer UI ──
function buildAnimPartChips() {
  const container = document.getElementById('animPartChips');
  if (!container) return;
  container.innerHTML = '';
  PART_TYPES.filter(pt => pt.value > 0).forEach(pt => {
    const chip = document.createElement('div');
    chip.className = 'anim-chip' + (selectedAnimPart === pt.value ? ' active' : '');
    const hasAnim = animations[String(pt.value)] && animations[String(pt.value)].type;
    chip.innerHTML = `<span class="chip-dot" style="background:${customColors[pt.value]||'#888'}"></span>`
      + `<span>${lang==='ja'&&pt.labelJa?pt.labelJa:pt.label}</span>`
      + (hasAnim ? '<span class="chip-star">★</span>' : '');
    chip.onclick = () => selectAnimPart(pt.value);
    container.appendChild(chip);
  });
  // Hide controls if no part selected
  const ctrl = document.getElementById('animControls');
  if (ctrl && selectedAnimPart === null) ctrl.style.display = 'none';
}

function selectAnimPart(val) {
  selectedAnimPart = val;
  buildAnimPartChips();
  const ctrl = document.getElementById('animControls');
  ctrl.style.display = '';
  const key = String(val);
  const anim = animations[key] || { type: '', enabled: true, params: {} };
  document.getElementById('animTypeSelect').value = anim.type || '';
  document.getElementById('animEnabled').checked = anim.enabled !== false;
  buildAnimParams();
}

function onAnimTypeChange() {
  if (selectedAnimPart === null) return;
  const key = String(selectedAnimPart);
  const type = document.getElementById('animTypeSelect').value;
  if (!type) {
    delete animations[key];
  } else {
    const defaults = getDefaultParams(type);
    animations[key] = { type, enabled: document.getElementById('animEnabled').checked, params: defaults };
  }
  buildAnimParams();
  buildAnimPartChips();
}

function onAnimEnabledChange() {
  if (selectedAnimPart === null) return;
  const key = String(selectedAnimPart);
  if (animations[key]) {
    animations[key].enabled = document.getElementById('animEnabled').checked;
  }
  buildAnimPartChips();
}

function getDefaultParams(type) {
  switch (type) {
    case 'shake':  return { speed: 3, amplitude: 2, axis: 'x' };
    case 'move':   return { speed: 2, distance: 3, direction: 'up' };
    case 'fade':   return { speed: 2, minOpacity: 0.2 };
    case 'color':  return { speed: 2, targetColor: '#ffffff' };
    case 'rotate': return { speed: 2, angle: 15 };
    default: return {};
  }
}

function buildAnimParams() {
  const container = document.getElementById('animParams');
  container.innerHTML = '';
  if (selectedAnimPart === null) return;
  const key = String(selectedAnimPart);
  const anim = animations[key];
  if (!anim || !anim.type) return;
  const p = anim.params;

  function addSlider(i18nKey, param, min, max, step, val) {
    const row = document.createElement('div'); row.className = 'anim-row';
    const valSpan = `<span class="range-val">${val}</span>`;
    row.innerHTML = `<label data-i18n="${i18nKey}">${T(i18nKey)}</label>`
      + `<input type="range" min="${min}" max="${max}" step="${step}" value="${val}" oninput="updateAnimParam('${param}', Number(this.value)); this.nextElementSibling.textContent=this.value">`
      + valSpan;
    container.appendChild(row);
  }

  function addSelect(i18nKey, param, options, val) {
    const row = document.createElement('div'); row.className = 'anim-row';
    const opts = options.map(o => `<option value="${o.value}" ${o.value===val?'selected':''}>${T(o.i18n)}</option>`).join('');
    row.innerHTML = `<label data-i18n="${i18nKey}">${T(i18nKey)}</label>`
      + `<select onchange="updateAnimParam('${param}', this.value)">${opts}</select>`;
    container.appendChild(row);
  }

  function addColorInput(i18nKey, param, val) {
    const row = document.createElement('div'); row.className = 'anim-row';
    row.innerHTML = `<label data-i18n="${i18nKey}">${T(i18nKey)}</label>`
      + `<input type="color" value="${val||'#ffffff'}" oninput="updateAnimParam('${param}', this.value)">`;
    container.appendChild(row);
  }

  // Common: speed slider
  addSlider('anim-speed', 'speed', 1, 5, 0.5, p.speed || 3);

  switch (anim.type) {
    case 'shake':
      addSlider('anim-amplitude', 'amplitude', 1, 4, 0.5, p.amplitude || 2);
      addSelect('anim-axis', 'axis', [
        { value: 'x', i18n: 'anim-axis-x' }, { value: 'y', i18n: 'anim-axis-y' }, { value: 'xy', i18n: 'anim-axis-xy' }
      ], p.axis || 'x');
      break;
    case 'move':
      addSlider('anim-distance', 'distance', 1, 8, 1, p.distance || 3);
      addSelect('anim-direction', 'direction', [
        { value: 'up', i18n: 'anim-dir-up' }, { value: 'down', i18n: 'anim-dir-down' },
        { value: 'left', i18n: 'anim-dir-left' }, { value: 'right', i18n: 'anim-dir-right' }
      ], p.direction || 'up');
      break;
    case 'fade':
      addSlider('anim-min-opacity', 'minOpacity', 0, 0.8, 0.1, p.minOpacity ?? 0.2);
      break;
    case 'color':
      addColorInput('anim-target-color', 'targetColor', p.targetColor || '#ffffff');
      break;
    case 'rotate':
      addSlider('anim-angle', 'angle', 5, 45, 5, p.angle || 15);
      break;
  }
}

function updateAnimParam(param, value) {
  if (selectedAnimPart === null) return;
  const key = String(selectedAnimPart);
  if (animations[key]) {
    animations[key].params[param] = value;
  }
}

// ── Animation Engine ──
function lerpColor(c1, c2, t) {
  const p = (hex) => [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
  const [r1,g1,b1] = p(c1), [r2,g2,b2] = p(c2);
  const mix = (a,b) => Math.round(a + (b-a)*t);
  return '#' + [mix(r1,r2),mix(g1,g2),mix(b1,b2)].map(v => v.toString(16).padStart(2,'0')).join('');
}

function calcAnimOffset(anim, t) {
  if (!anim || !anim.enabled || !anim.type) return { dx:0, dy:0, opacity:1, color:null, rotation:0 };
  const p = anim.params;
  const spd = p.speed || 3;
  const cycle = Math.sin(t * spd * 0.004);
  switch (anim.type) {
    case 'shake': {
      const amp = p.amplitude || 2;
      return { dx: cycle*amp*(p.axis!=='y'?1:0), dy: cycle*amp*(p.axis!=='x'?1:0), opacity:1, color:null, rotation:0 };
    }
    case 'move': {
      const dist = p.distance || 3;
      const d = p.direction || 'up';
      const dx = d==='left' ? -cycle*dist : d==='right' ? cycle*dist : 0;
      const dy = d==='up' ? -cycle*dist : d==='down' ? cycle*dist : 0;
      return { dx, dy, opacity:1, color:null, rotation:0 };
    }
    case 'fade': {
      const minOp = p.minOpacity ?? 0.2;
      return { dx:0, dy:0, opacity: minOp + (1-minOp)*(cycle*0.5+0.5), color:null, rotation:0 };
    }
    case 'color': {
      const tc = p.targetColor || '#ffffff';
      return { dx:0, dy:0, opacity:1, color: tc, colorT: cycle*0.5+0.5, rotation:0 };
    }
    case 'rotate': {
      const ang = p.angle || 15;
      return { dx:0, dy:0, opacity:1, color:null, rotation: cycle * ang * Math.PI/180 };
    }
    default: return { dx:0, dy:0, opacity:1, color:null, rotation:0 };
  }
}

function renderAnimFrame(timestamp) {
  const t = timestamp - animStartTime;
  const canvas = document.getElementById('gridCanvas');
  const ctx = canvas.getContext('2d');
  const pw = canvas.width, ph = canvas.height;
  const bw = pw / GRID_W, bh = ph / GRID_H;
  const s = bw; // scale factor = cell pixel size
  ctx.clearRect(0, 0, pw, ph);

  // Precompute offsets per animated part
  const offsets = {};
  animatingParts.forEach(v => {
    offsets[v] = calcAnimOffset(animations[String(v)], t);
  });

  // For rotate: precompute centroids
  const centroids = {};
  animatingParts.forEach(v => {
    const off = offsets[v];
    if (off && off.rotation !== 0) {
      let sx=0, sy=0, cnt=0;
      for (let r=0; r<GRID_H; r++) for (let c=0; c<GRID_W; c++) {
        if (grid[r][c] === v) { sx += c; sy += r; cnt++; }
      }
      if (cnt > 0) centroids[v] = { cx: (sx/cnt+0.5)*bw, cy: (sy/cnt+0.5)*bh };
    }
  });

  // Draw background (empty cells) + grid lines
  ctx.fillStyle = '#F5F5F5'; ctx.fillRect(0, 0, pw, ph);

  // Draw all pixels: non-animated first, then animated on top
  for (let r = 0; r < GRID_H; r++) for (let c = 0; c < GRID_W; c++) {
    const val = grid[r][c]; if (val === 0 || !partVisible[val]) continue;
    if (offsets[val]) continue;
    const baseColor = customColors[val] || '#888';
    const fx = partEffects[val];
    const partHasFx = fx && Object.values(fx).some(v => v === true);
    if (partHasFx && bw >= 4) {
      const subDiv = Math.min(Math.floor(bw / 2), 4);
      const sw = bw / subDiv;
      const x = c * bw, y = r * bh;
      for (let sr = 0; sr < subDiv; sr++) for (let sc = 0; sc < subDiv; sc++) {
        ctx.fillStyle = applyFxToColorSub(baseColor, val, r, c, sr, sc, subDiv, GRID_W, GRID_H, grid, fxAnimTime, true);
        ctx.fillRect(x + sc * sw, y + sr * sw, Math.ceil(sw), Math.ceil(sw));
      }
    } else {
      ctx.fillStyle = partHasFx ? applyFxToColorSub(baseColor, val, r, c, 0, 0, 1, GRID_W, GRID_H, grid, fxAnimTime, true) : baseColor;
      ctx.fillRect(c*bw, r*bh, bw, bh);
    }
  }
  // Canvas-native post-processing for non-animated parts
  PART_TYPES.forEach(pt => {
    if (pt.value === 0 || offsets[pt.value]) return;
    applyAllCanvasEffects(ctx, pt.value, grid, GRID_W, GRID_H, bw, bh, 0, 0, fxAnimTime);
  });

  animatingParts.forEach(v => {
    const off = offsets[v];
    if (!off) return;
    ctx.save();
    if (off.rotation !== 0 && centroids[v]) {
      ctx.translate(centroids[v].cx, centroids[v].cy);
      ctx.rotate(off.rotation);
      ctx.translate(-centroids[v].cx, -centroids[v].cy);
    }
    ctx.globalAlpha = off.opacity;
    for (let r = 0; r < GRID_H; r++) for (let c = 0; c < GRID_W; c++) {
      if (grid[r][c] !== v || !partVisible[v]) continue;
      let col = customColors[v] || '#888';
      if (off.color) col = lerpColor(col, off.color, off.colorT || 0);
      const fx = partEffects[v];
      const partHasFx = fx && Object.values(fx).some(fv => fv === true);
      const px = c*bw + off.dx*s, py = r*bh + off.dy*s;
      if (partHasFx && bw >= 4) {
        const subDiv = Math.min(Math.floor(bw / 2), 4);
        const sw = bw / subDiv;
        for (let sr = 0; sr < subDiv; sr++) for (let sc = 0; sc < subDiv; sc++) {
          ctx.fillStyle = applyFxToColorSub(col, v, r, c, sr, sc, subDiv, GRID_W, GRID_H, grid, fxAnimTime, true);
          ctx.fillRect(px + sc * sw, py + sr * sw, Math.ceil(sw), Math.ceil(sw));
        }
      } else {
        ctx.fillStyle = partHasFx ? applyFxToColorSub(col, v, r, c, 0, 0, 1, GRID_W, GRID_H, grid, fxAnimTime, true) : col;
        ctx.fillRect(px, py, bw, bh);
      }
    }
    // Canvas-native post-processing for this animated part (within transform context)
    applyAllCanvasEffects(ctx, v, grid, GRID_W, GRID_H, bw, bh, 0, 0, fxAnimTime);
    ctx.restore();
  });

  animFrameId = requestAnimationFrame(renderAnimFrame);
}

function playPartAnim() {
  if (selectedAnimPart === null) return;
  const key = String(selectedAnimPart);
  if (!animations[key] || !animations[key].type) return;
  stopAnims();
  animatingParts = [selectedAnimPart];
  animStartTime = performance.now();
  document.getElementById('btnPlayPart').classList.add('playing');
  animFrameId = requestAnimationFrame(renderAnimFrame);
}

function playAllAnims() {
  stopAnims();
  animatingParts = Object.keys(animations)
    .filter(k => animations[k].enabled && animations[k].type)
    .map(Number);
  if (animatingParts.length === 0) return;
  animStartTime = performance.now();
  document.getElementById('btnPlayAll').classList.add('playing');
  animFrameId = requestAnimationFrame(renderAnimFrame);
}

function stopAnims() {
  if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
  animatingParts = [];
  stopFxAnimLoop();
  document.querySelectorAll('.anim-play-btns button').forEach(b => b.classList.remove('playing'));
  render();
}

    return { width: a.width, height: a.height, grid: a.grid.map(r=>Array.from(r)), customColors: { ...a.customColors }, animations: a.animations || {} };
  };
  // Build composite grid (32×48, hex color strings, null for transparent)
  const compositeGrid = Array.from({length:48}, ()=>Array(32).fill(null));
  function layComposite(asset, gx, gy) {
    if (!asset) return;
    const base = getAssetBaseSize(asset);
    const scaleX = asset.width / base.w, scaleY = asset.height / base.h;
    const effects = asset.effects || {};
    const savedPE = partEffects; partEffects = effects;
    if (scaleX > 1 || scaleY > 1) {
      for (let br = 0; br < base.h; br++) for (let bc = 0; bc < base.w; bc++) {
        const sr = Math.floor(br * scaleY), sc2 = Math.floor(bc * scaleX);
        const vals = {};
        for (let dr = 0; dr < scaleY && sr+dr < asset.height; dr++)
          for (let dc = 0; dc < scaleX && sc2+dc < asset.width; dc++) {
            const v = asset.grid[sr+dr][sc2+dc]; if (v !== 0) vals[v] = (vals[v] || 0) + 1;
          }
        const best = Object.entries(vals).sort((a,b) => b[1] - a[1])[0];
        if (!best) continue;
        const val = parseInt(best[0]);
        const tr = gy + br, tc = gx + bc;
        if (tr >= 0 && tr < 48 && tc >= 0 && tc < 32) {
          const baseColor = asset.customColors[val] || '#888';
          compositeGrid[tr][tc] = applyFxToColorSub(baseColor, val, br, bc, 0, 0, 1, base.w, base.h, asset.grid);
        }
      }
    } else {
      for (let r=0;r<asset.height;r++) for (let c=0;c<asset.width;c++) {
        const val=asset.grid[r][c]; if (val===0) continue;
        const tr=gy+r, tc=gx+c;
        if (tr>=0&&tr<48&&tc>=0&&tc<32) {
          const baseColor = asset.customColors[val]||'#888';
          compositeGrid[tr][tc] = applyFxToColorSub(baseColor, val, r, c, 0, 0, 1, asset.width, asset.height, asset.grid);
        }
      }
    }
    partEffects = savedPE;
  }
  const eOffsets = assign.offsets || {};
  const layEx = (lt, asset) => { if (!asset) return; const p = getLayerPos(lt, asset, eOffsets); layComposite(asset, p.x, p.y); };
  layEx('frame', store.assets[assign.frame]);
  layEx('character', store.assets[assign.character]);
  if (assign.points&&store.assets[assign.points]) layEx('points', store.assets[assign.points]);
  if (assign.icon&&store.assets[assign.icon]) layEx('icon', store.assets[assign.icon]);

  const data = {
    version: 2, cardCode: selectedCardCode,
    card: { name: card.name, nameEn: card.nameEn, points: card.points, category: card.category, tier: card.tier },
    assets: {
      character: exportAsset(assign.character),
      frame: exportAsset(assign.frame),
      back: exportAsset(assign.back),
      icon: exportAsset(assign.icon),
      points: exportAsset(assign.points),
    },
    compositeGrid,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const link = document.createElement('a'); link.download = `card-${selectedCardCode}.json`;
  link.href = URL.createObjectURL(blob); link.click(); URL.revokeObjectURL(link.href);
  toast(T('toast-json'));
}

function copyCardJSON() {
  const assign = getAssignments(selectedCardCode);
  if (!assign.character || !store.assets[assign.character] || !assign.frame || !store.assets[assign.frame]) {
    toast(T('toast-export-block')); return;
  }
  const card = CARD_DATA[selectedCardCode];
  const exportAsset = (id) => {
    if (!id || !store.assets[id]) return null;
    const a = store.assets[id];
    return { width: a.width, height: a.height, grid: a.grid.map(r=>Array.from(r)), customColors: { ...a.customColors }, animations: a.animations || {} };
  };
  const data = {
    version: 2, cardCode: selectedCardCode,
    card: { name: card.name, nameEn: card.nameEn, points: card.points, category: card.category, tier: card.tier },
    assets: {
      character: exportAsset(assign.character), frame: exportAsset(assign.frame),
      back: exportAsset(assign.back), icon: exportAsset(assign.icon), points: exportAsset(assign.points),
    },
  };
  navigator.clipboard.writeText(JSON.stringify(data)).then(() => toast(T('toast-copied-json')));
}

function copyAllData() {
  const exportData = {
    _frogCardEditor: true,
    version: 1,
    assets: {},
    cardAssignments: store.cardAssignments,
    settings: store.settings,
  };
  // Deep-copy assets with plain arrays
  Object.entries(store.assets).forEach(([id, a]) => {
    exportData.assets[id] = {
      ...a,
      grid: a.grid.map(r => Array.from(r)),
    };
  });
  navigator.clipboard.writeText(JSON.stringify(exportData)).then(() => toast(T('toast-all-copied')));
}

async function loadAllData() {
  try {
    const text = await navigator.clipboard.readText();
    const data = JSON.parse(text);
    if (!data._frogCardEditor) { toast(T('toast-import-error') + 'Not editor data'); return; }
    // Restore assets with Int8Array grids
    Object.entries(data.assets || {}).forEach(([id, a]) => {
      store.assets[id] = { ...a, grid: a.grid.map(r => Int8Array.from(r)) };
    });
    store.cardAssignments = data.cardAssignments || {};
    if (data.settings) store.settings = data.settings;
    saveStore();
    toast(T('toast-all-loaded'));
    // Refresh current view
    if (currentView === 'viewDashboard') initDashboard(selectedCardCode);
    else if (currentView === 'viewCardSelect') buildCardGrid();
  } catch (e) {
    toast(T('toast-import-error') + (e.message || 'Clipboard error'));
  }
}

// ═══════════════════════════════════════════════════════════════
// SECTION 9b: JSON Import
// ═══════════════════════════════════════════════════════════════
let importTargetCardCode = null, importTargetSlotType = null;

function openImportJson(cardCode, slotType) {
  importTargetCardCode = cardCode;
  importTargetSlotType = slotType;
  document.getElementById('importJsonInput').value = '';
  document.getElementById('importJsonError').textContent = '';
  document.getElementById('importJsonOverlay').classList.add('open');
}
function closeImportJson() {
  document.getElementById('importJsonOverlay').classList.remove('open');
  importTargetCardCode = null; importTargetSlotType = null;
}
function confirmImportJson() {
  const raw = document.getElementById('importJsonInput').value.trim();
  const errEl = document.getElementById('importJsonError');
  errEl.textContent = '';
  let data;
  try { data = JSON.parse(raw); } catch (e) { errEl.textContent = T('toast-import-error') + 'Invalid JSON'; return; }
  const result = importAssetJSON(importTargetCardCode, importTargetSlotType, data);
  if (result.error) { errEl.textContent = T('toast-import-error') + result.error; return; }
  closeImportJson();
  toast(T('toast-imported'));
}

function importAssetJSON(cardCode, slotType, jsonData) {
  // Parse if string
  if (typeof jsonData === 'string') {
    try { jsonData = JSON.parse(jsonData); } catch (e) { return { error: 'Invalid JSON' }; }
  }
  // Validate grid
  if (!jsonData.grid || !Array.isArray(jsonData.grid)) return { error: 'Missing grid' };
  const spec = ASSET_TYPES[slotType];
  if (!spec) return { error: 'Invalid slot type: ' + slotType };
  const expectedH = spec.h, expectedW = spec.w;
  if (jsonData.grid.length !== expectedH) return { error: `Grid height: expected ${expectedH}, got ${jsonData.grid.length}` };
  for (let r = 0; r < expectedH; r++) {
    if (!Array.isArray(jsonData.grid[r]) || jsonData.grid[r].length !== expectedW)
      return { error: `Row ${r}: expected width ${expectedW}` };
  }

  // Build partTypes & customColors
  const card = CARD_DATA[cardCode];
  if (!card) return { error: 'Invalid card code: ' + cardCode };
  let pts, cc;
  if (jsonData.partTypes && Array.isArray(jsonData.partTypes)) {
    pts = jsonData.partTypes;
    cc = jsonData.customColors || {};
    pts.forEach(pt => { if (pt.color && !cc[pt.value]) cc[pt.value] = pt.color; });
  } else {
    // Use defaults for this slot type
    const defaults = ASSET_PART_DEFAULTS[slotType] || ASSET_PART_DEFAULTS.character;
    const tierColors = TIER_COLORS[card.tier];
    pts = defaults.map(d => {
      const pt = { ...d };
      if (slotType !== 'character' && tierColors) {
        if (d.label === 'Border' || d.label === 'Base' || d.label === 'Digit') pt.color = tierColors.back;
        if (d.label === 'Accent' || d.label === 'Main') pt.color = tierColors.accent;
      }
      return pt;
    });
    cc = jsonData.customColors || {};
    pts.forEach(pt => { if (!cc[pt.value]) cc[pt.value] = pt.color; });
  }

  // Create asset
  const assetId = crypto.randomUUID();
  store.assets[assetId] = {
    id: assetId,
    type: slotType,
    label: (lang === 'ja' ? card.name : card.nameEn) + ' ' + T(spec.i18nKey),
    width: expectedW,
    height: expectedH,
    grid: jsonData.grid.map(r => Int8Array.from(r)),
    partTypes: pts.map(pt => ({ value: pt.value, label: pt.label, labelJa: pt.labelJa || pt.label, color: cc[pt.value] || pt.color, custom: pt.custom || false })),
    customColors: { ...cc },
    animations: jsonData.animations || {},
    meta: getMetaForSlot(slotType, card),
    createdAt: Date.now(),
    updatedAt: Date.now(),
  };

  // Assign to card
  const assign = getAssignments(cardCode);
  assign[slotType] = assetId;
  store.cardAssignments[cardCode] = assign;
  saveStore();

  // Refresh dashboard if visible
  if (currentView === 'viewDashboard' && selectedCardCode === cardCode) {
    initDashboard(cardCode);
  }

  return { success: true, assetId };
}

// ═══════════════════════════════════════════════════════════════
// SECTION 10: Utilities
// ═══════════════════════════════════════════════════════════════
function toggleDrawer(btn) { btn.classList.toggle('open'); btn.nextElementSibling.classList.toggle('open'); }
let toastTimer = null;
function toast(msg) { const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); if(toastTimer)clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2000); }
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if ((e.metaKey||e.ctrlKey) && e.key==='z') { e.preventDefault(); if(e.shiftKey) redo(); else undo(); }
});
window.addEventListener('resize', () => { if (currentView === 'viewEditor') render(); });

// ═══════════════════════════════════════════════════════════════
// SECTION 11: Init
// ═══════════════════════════════════════════════════════════════
function init() {
  loadStore();
  if (store.settings.lang) {
    setLang(store.settings.lang);
  } else if ((navigator.language||'').startsWith('ja')) {
    setLang('ja');
  }
  buildCardGrid();
}
init();
</script>
