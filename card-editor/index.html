<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frog Card Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,500;9..40,700&family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --off-white: #f2f0ed;
      --warm-gray: #e8e4df;
      --text-primary: #1a1a1a;
      --text-secondary: #6b6560;
      --text-muted: #9e9890;
      --accent: #8B6914;
      --accent-dark: #6B4F10;
      --card-bg: #ffffff;
      --card-border: #e8e4df;
      --shadow-soft: 0 2px 20px rgba(0,0,0,0.04);
      --shadow-hover: 0 8px 40px rgba(0,0,0,0.08);
      --mob-back: #2d1518; --mob-accent: #e8b4b8;
      --elite-back: #0a3070; --elite-accent: #7eaadc;
      --legend-back: #501a60; --legend-accent: #c48ed0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--off-white); color: var(--text-primary); min-height: 100vh; min-width: 340px; }

    /* Header */
    header { padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto; }
    .back-link { font-family: 'Outfit', sans-serif; font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); text-decoration: none; display: flex; align-items: center; gap: 0.4rem; cursor: pointer; transition: color 0.2s; }
    .back-link:hover { color: var(--text-primary); }
    .lang-switcher { display: flex; background: var(--warm-gray); border-radius: 8px; overflow: hidden; border: 1px solid var(--card-border); }
    .lang-btn { font-family: 'Outfit', sans-serif; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; padding: 0.4rem 0.8rem; border: none; background: transparent; color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
    .lang-btn.active { background: var(--card-bg); color: var(--text-primary); box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .page-title { text-align: center; padding: 0.3rem 2rem 1rem; }
    .page-title h1 { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: clamp(1.4rem, 4vw, 2rem); line-height: 1.1; }
    .page-title .subtitle { font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.2rem; }
    .main-wrap { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem 2rem; }

    /* Card Grid (View 1) */
    .card-group-title { font-family: 'Outfit', sans-serif; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin: 1.2rem 0 0.5rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--card-border); }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .card-tile { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 0.5rem; cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .card-tile:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
    .card-tile .tile-preview { width: 100%; aspect-ratio: 2/3; border-radius: 6px; image-rendering: pixelated; }
    .card-tile .cname { font-size: 0.78rem; font-weight: 700; }
    .card-tile .cinfo { font-size: 0.65rem; color: var(--text-muted); }
    .card-tile .progress { display: flex; gap: 3px; margin-top: 2px; }
    .card-tile .dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--card-border); }
    .card-tile .dot.filled { background: var(--accent); border-color: var(--accent); }
    .card-group-header { display: flex; align-items: center; justify-content: space-between; }
    .card-group-header .gear-btn { background: none; border: none; cursor: pointer; font-size: 1rem; color: var(--text-muted); padding: 2px 6px; border-radius: 4px; }
    .card-group-header .gear-btn:hover { background: var(--card-border); color: var(--text-base); }
    .tier-badge { display: inline-block; font-size: 0.55rem; font-weight: 700; padding: 1px 5px; border-radius: 4px; color: #fff; text-transform: uppercase; letter-spacing: 0.05em; }
    .tier-mob { background: var(--mob-back); }
    .tier-elite { background: var(--elite-back); }
    .tier-legend { background: var(--legend-back); }

    /* Preset bar */
    .preset-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; padding: 0.8rem; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; box-shadow: var(--shadow-soft); }
    .preset-bar .preset-label { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); font-family: 'Outfit', sans-serif; letter-spacing: 0.06em; }
    .preset-bar .preset-hint { font-size: 0.65rem; color: var(--text-muted); }

    /* Shared Assets */
    .shared-section-title { font-family: 'Outfit', sans-serif; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin: 1.2rem 0 0.5rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--card-border); }
    .shared-group { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 0.7rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .shared-group-label { display: flex; align-items: center; gap: 6px; min-width: 90px; }
    .shared-group-cards { font-size: 0.65rem; color: var(--text-muted); flex: 1; min-width: 100px; }
    .shared-slots-row { display: flex; gap: 6px; }
    .shared-slot { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border: 1px solid var(--card-border); border-radius: 8px; cursor: pointer; transition: all 0.15s; background: var(--off-white); }
    .shared-slot:hover { border-color: var(--accent); background: #fdf8ef; transform: translateY(-1px); }
    .shared-slot .slot-thumb { width: 32px; height: 32px; background: var(--warm-gray); border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
    .shared-slot .slot-thumb canvas { image-rendering: pixelated; }
    .shared-slot-label { font-size: 0.65rem; font-weight: 600; color: var(--text-secondary); }
    .shared-slot .badge-done { font-size: 0.55rem; padding: 1px 4px; }
    .shared-inline-group { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 0.5rem; }
    .shared-inline-slot { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px; border: 1px solid var(--card-border); border-radius: 8px; cursor: pointer; transition: all 0.15s; background: var(--card-bg); min-width: 52px; }
    .shared-inline-slot:hover { border-color: var(--accent); background: #fdf8ef; }
    .shared-inline-slot .slot-thumb { width: 28px; height: 28px; background: var(--warm-gray); border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .shared-inline-slot .slot-thumb canvas { image-rendering: pixelated; }
    .shared-inline-label { font-size: 0.6rem; color: var(--text-muted); font-weight: 500; }

    /* Dashboard (View 2) */
    .dash-header { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .dash-header .emoji { font-size: 2.5rem; }
    .dash-header h2 { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 1.4rem; }
    .dash-header .dinfo { font-size: 0.78rem; color: var(--text-secondary); }
    .slot-list { display: flex; flex-direction: column; gap: 10px; }
    .slot-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 0.8rem; display: flex; align-items: center; gap: 12px; transition: all 0.15s; }
    .slot-thumb { width: 60px; height: 60px; background: var(--warm-gray); border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
    .slot-thumb canvas { image-rendering: pixelated; }
    .slot-info { flex: 1; }
    .slot-info .sname { font-size: 0.82rem; font-weight: 700; }
    .slot-info .sdesc { font-size: 0.68rem; color: var(--text-muted); }
    .slot-badge { font-size: 0.6rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
    .badge-required { background: #fdecea; color: #c62828; }
    .badge-optional { background: #fff8e1; color: #f57f17; }
    .badge-done { background: #e8f5e9; color: #2e7d32; }
    .slot-actions { display: flex; gap: 6px; }

    /* Preview section in dashboard */
    .preview-section { margin-top: 1.2rem; text-align: center; }
    .preview-section canvas { image-rendering: pixelated; border: 1px solid var(--card-border); border-radius: 6px; }

    /* Editor (View 3) */
    .editor-layout { display: flex; gap: 16px; align-items: flex-start; }
    .editor-main { flex: 1; min-width: 0; overflow: hidden; }
    .editor-sidebar { width: 240px; position: sticky; top: 16px; align-self: flex-start; display: flex; flex-direction: column; gap: 12px; }
    .editor-sidebar .sidebar-preview { background: var(--card-bg); border-radius: 10px; padding: 8px; box-shadow: var(--shadow-soft); border: 1px solid var(--card-border); text-align: center; }
    .editor-sidebar .sidebar-preview canvas { image-rendering: pixelated; max-width: 100%; }
    .editor-sidebar .sidebar-preview .preview-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .editor-area { display: flex; gap: 1.2rem; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
    .canvas-col { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; }
    .canvas-label { font-family: 'Outfit', sans-serif; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
    .canvas-wrapper { background: var(--card-bg); border-radius: 12px; padding: 10px; box-shadow: var(--shadow-soft); border: 1px solid var(--card-border); display: flex; align-items: center; justify-content: center; overflow: hidden; max-width: 100%; }
    .canvas-wrapper canvas { max-width: 100%; height: auto; }
    canvas#gridCanvas { cursor: crosshair; display: block; image-rendering: pixelated; touch-action: none; }
    /* previewCanvas removed — effects render directly on editor grid */

    /* Drawers */
    .drawer { max-width: 700px; margin: 0.8rem auto 0; }
    .drawer-toggle { font-family: 'Outfit', sans-serif; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; color: var(--text-secondary); background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0; width: 100%; text-align: left; transition: color 0.2s; }
    .drawer-toggle:hover { color: var(--text-primary); }
    .drawer-toggle .arrow { display: inline-block; transition: transform 0.25s; font-size: 0.6rem; }
    .drawer-toggle.open .arrow { transform: rotate(90deg); }
    .drawer-body { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; }
    .drawer-body.open { max-height: 1200px; }
    .drawer-inner { background: var(--card-bg); border-radius: 12px; padding: 0.8rem; box-shadow: var(--shadow-soft); border: 1px solid var(--card-border); margin-bottom: 0.4rem; }

    /* Palette */
    #palette { display: flex; flex-wrap: wrap; gap: 5px; }
    .palette-btn { position: relative; border: 2px solid transparent; border-radius: 7px; padding: 5px 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.68rem; font-weight: 500; min-width: 48px; text-align: center; transition: all 0.15s; }
    .palette-btn.active { border-color: var(--text-primary); box-shadow: 0 0 0 2px rgba(26,26,26,0.15); transform: scale(1.06); }
    .palette-label { pointer-events: none; white-space: nowrap; font-size: 0.6rem; }
    .color-edit { position: absolute; top: 1px; right: 3px; font-size: 0.55rem; opacity: 0.5; cursor: pointer; }
    .color-edit:hover { opacity: 1; }
    .color-delete { position: absolute; top: -4px; right: -4px; background: #e53935; color: #fff; width: 14px; height: 14px; border-radius: 50%; font-size: 0.6rem; line-height: 14px; text-align: center; cursor: pointer; }
    .palette-add { border: 2px dashed var(--card-border); border-radius: 7px; padding: 5px 10px; cursor: pointer; background: transparent; color: var(--text-muted); font-size: 1rem; font-weight: 700; transition: all 0.15s; }
    .palette-add:hover { border-color: var(--text-secondary); color: var(--text-secondary); }

    /* Part visibility */
    .part-vis-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .vis-chip { display: inline-flex; align-items: center; gap: 3px; font-size: 0.62rem; padding: 2px 6px; border: 1px solid var(--card-border); border-radius: 5px; cursor: pointer; transition: all 0.15s; }
    .vis-chip.hidden { opacity: 0.3; }
    .vis-swatch { width: 10px; height: 10px; border-radius: 2px; border: 1px solid rgba(0,0,0,0.1); }

    /* Tool buttons */
    .tool-row { display: flex; flex-wrap: wrap; gap: 5px; }
    .tool-btn { font-family: 'DM Sans', sans-serif; font-size: 0.72rem; font-weight: 500; padding: 0.4rem 0.7rem; border-radius: 7px; border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text-secondary); cursor: pointer; transition: all 0.15s; }
    .tool-btn:hover { background: var(--warm-gray); color: var(--text-primary); }
    .tool-btn:active { transform: scale(0.96); }
    .tool-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent-dark); }
    .tool-btn.primary:hover { background: var(--accent-dark); }
    .tool-btn:disabled { opacity: 0.4; cursor: default; }

    /* Image import */
    .drop-zone { border: 2px dashed var(--card-border); border-radius: 10px; padding: 1.2rem; text-align: center; color: var(--text-muted); font-size: 0.78rem; cursor: pointer; transition: all 0.2s; }
    .drop-zone.drag-over { border-color: var(--accent); background: rgba(139,105,20,0.04); color: var(--accent); }
    .drop-zone input[type="file"] { display: none; }
    .import-options { margin-top: 0.6rem; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .import-options label { font-size: 0.68rem; color: var(--text-secondary); }
    .import-options select { font-family: 'DM Sans', sans-serif; font-size: 0.68rem; padding: 3px 6px; border: 1px solid var(--card-border); border-radius: 5px; background: var(--card-bg); }

    /* Overlays */
    .overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.35); z-index: 1000; align-items: center; justify-content: center; }
    .overlay.open { display: flex; }
    .overlay-card { background: var(--card-bg); border-radius: 14px; padding: 1.2rem; box-shadow: 0 12px 40px rgba(0,0,0,0.15); max-width: 360px; width: 90%; }
    .overlay-title { font-family: 'Outfit', sans-serif; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.6rem; }
    .overlay-input { width: 100%; padding: 0.45rem 0.7rem; border: 1px solid var(--card-border); border-radius: 7px; font-family: 'DM Sans', sans-serif; font-size: 0.78rem; margin-bottom: 0.5rem; }
    .overlay-input:focus { outline: 2px solid var(--accent); border-color: transparent; }
    .overlay-actions { display: flex; gap: 6px; justify-content: flex-end; }
    .color-grid { display: grid; grid-template-columns: repeat(16, 1fr); gap: 1px; margin-bottom: 0.6rem; }
    .color-swatch { aspect-ratio: 1; border-radius: 2px; border: 1px solid rgba(0,0,0,0.06); cursor: pointer; transition: transform 0.1s; min-width: 14px; }
    .color-swatch:hover { transform: scale(1.3); z-index: 2; }
    .color-swatch.active { border: 2px solid var(--text-primary); }

    /* Animation Drawer */
    .anim-part-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 0.6rem; }
    .anim-chip { display: flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px; border: 2px solid var(--card-border); cursor: pointer; font-size: 0.68rem; font-weight: 500; transition: all 0.15s; background: var(--card-bg); }
    .anim-chip:hover { border-color: var(--text-muted); }
    .anim-chip.active { border-color: var(--accent); background: #fdf8ef; }
    .anim-chip .chip-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .anim-chip .chip-star { font-size: 0.55rem; color: var(--accent); }
    .anim-controls { border-top: 1px solid var(--card-border); padding-top: 0.6rem; margin-top: 0.2rem; }
    .anim-row { display: flex; align-items: center; gap: 8px; margin-bottom: 0.4rem; font-size: 0.72rem; }
    .anim-row label { min-width: 80px; color: var(--text-secondary); font-weight: 500; }
    .anim-row select, .anim-row input[type="range"] { flex: 1; font-family: 'DM Sans', sans-serif; font-size: 0.68rem; }
    .anim-row select { padding: 3px 6px; border: 1px solid var(--card-border); border-radius: 5px; background: var(--card-bg); }
    .anim-row input[type="range"] { height: 4px; accent-color: var(--accent); }
    .anim-row .range-val { font-size: 0.65rem; color: var(--text-muted); min-width: 24px; text-align: right; }
    .anim-row input[type="color"] { width: 28px; height: 22px; border: 1px solid var(--card-border); border-radius: 4px; padding: 0; cursor: pointer; }
    .anim-play-btns { display: flex; gap: 6px; margin-top: 0.6rem; padding-top: 0.6rem; border-top: 1px solid var(--card-border); }
    .anim-play-btns button { font-family: 'DM Sans', sans-serif; font-size: 0.68rem; font-weight: 600; padding: 4px 10px; border: 1px solid var(--card-border); border-radius: 6px; background: var(--card-bg); cursor: pointer; transition: all 0.15s; }
    .anim-play-btns button:hover { border-color: var(--accent); color: var(--accent); }
    .anim-play-btns button.playing { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* Toast */
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--text-primary); color: #fff; padding: 0.5rem 1.2rem; border-radius: 8px; font-size: 0.78rem; font-weight: 500; opacity: 0; transition: all 0.35s; z-index: 2000; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Responsive */
    @media (max-width: 700px) {
      .editor-layout { flex-direction: column; }
      .editor-sidebar { width: 100%; position: static; }
      .editor-area { flex-direction: column; align-items: center; }
      header { padding: 0.6rem 1rem; }
      .main-wrap { padding: 0 0.8rem 2rem; }
      .card-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a class="back-link" id="backLink" onclick="navigateBack()">
      <span>&larr;</span> <span id="backLabel" data-i18n="back">Home</span>
    </a>
    <div class="lang-switcher">
      <button class="lang-btn active" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="ja">JP</button>
    </div>
  </header>

  <!-- ============================================================ -->
  <!-- VIEW 1: Card Selection -->
  <!-- ============================================================ -->
  <section id="viewCardSelect">
    <div class="page-title">
      <h1>Frog Card Editor</h1>
      <p class="subtitle" data-i18n="subtitle">Pixel art card editor for Wind &amp; Gate</p>
    </div>
    <div class="main-wrap">
      <div class="preset-bar" id="presetBar">
        <span class="preset-label" data-i18n="preset-label">Frame Style:</span>
        <button class="tool-btn" onclick="loadPreset('classic')" data-i18n="preset-classic">Classic</button>
        <button class="tool-btn" onclick="loadPreset('ornate')" data-i18n="preset-ornate">Ornate</button>
        <button class="tool-btn" onclick="loadPreset('gothic')" data-i18n="preset-gothic">Gothic</button>
        <span class="preset-hint" data-i18n="preset-hint">— loads frames, backs, icons &amp; points</span>
      </div>
      <div id="cardGridContainer"></div>
    </div>
  </section>

  <!-- ============================================================ -->
  <!-- VIEW 2: Asset Dashboard -->
  <!-- ============================================================ -->
  <section id="viewDashboard" style="display:none;">
    <div class="main-wrap">
      <div class="dash-header" id="dashHeader"></div>
      <div class="slot-list" id="slotList"></div>
      <div class="preview-section" id="previewSection">
        <span class="canvas-label" data-i18n="card-preview">CARD PREVIEW</span>
        <div style="margin-top:6px;">
          <canvas id="compositeCanvas" width="192" height="288"></canvas>
        </div>
        <div class="tool-row" style="justify-content:center; margin-top:8px;">
          <button class="tool-btn" onclick="togglePositionAdjust()" id="adjustPosBtn" data-i18n="adjust-pos">⇄ Adjust Positions</button>
          <button class="tool-btn" onclick="resetPositions()" id="resetPosBtn" style="display:none" data-i18n="reset-pos">Reset</button>
        </div>
        <div class="tool-row" style="justify-content:center; margin-top:8px;">
          <button class="tool-btn primary" onclick="exportCompositePNG()" id="exportPngBtn" disabled data-i18n="export-png">Download PNG</button>
          <button class="tool-btn" onclick="exportCardJSON()" id="exportJsonBtn" disabled data-i18n="export-json">Download JSON</button>
          <button class="tool-btn" onclick="copyCardJSON()" id="copyJsonBtn" disabled data-i18n="copy-json">Copy JSON</button>
        </div>
      </div>
      <div style="margin-top:1.2rem; padding-top:1rem; border-top:1px solid var(--card-border); display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
        <button class="tool-btn" onclick="copyAllData()" data-i18n="copy-all">📋 Copy All Data</button>
        <button class="tool-btn" onclick="loadAllData()" data-i18n="load-all">📥 Load Data</button>
      </div>
    </div>
  </section>

  <!-- ============================================================ -->
  <!-- VIEW 3: Pixel Editor -->
  <!-- ============================================================ -->
  <section id="viewEditor" style="display:none;">
    <div class="page-title">
      <h1 id="editorTitle">Editor</h1>
      <p class="subtitle" id="editorSubtitle"></p>
    </div>
    <div class="main-wrap">
      <div class="editor-layout">
        <!-- Left column: editor + tools -->
        <div class="editor-main">
          <div class="editor-area">
            <div class="canvas-col">
              <span class="canvas-label" data-i18n="grid-label">EDITOR</span>
              <!-- Hi-res preview for programmatic assets (back/frame/icon/points) -->
              <div id="hiResPreviewWrap" style="display:none; text-align:center;">

function genPointsGrid(val) {
  const W=12,H=8,g=Array.from({length:H},()=>new Array(W).fill(0));
  const ds=String(val).split('').map(Number),tw=ds.length*4-1;
  const sx=Math.floor((W-tw)/2),sy=Math.floor((H-5)/2);
  ds.forEach((d,i)=>{const bm=DIGIT_3x5[d];if(!bm)return;const ox=sx+i*4;
    for(let r=0;r<5;r++)for(let c=0;c<3;c++)if(bm[r*3+c])g[sy+r][ox+c]=1;});
  const out=g.map(r=>[...r]);
  for(let r=0;r<H;r++)for(let c=0;c<W;c++)if(g[r][c]===0){
    let hit=false;for(let dr=-1;dr<=1&&!hit;dr++)for(let dc=-1;dc<=1&&!hit;dc++){
      const nr=r+dr,nc=c+dc;if(nr>=0&&nr<H&&nc>=0&&nc<W&&g[nr][nc]===1){out[r][c]=2;hit=true;}}}
  return out;
}

function genFrame(style,tb,ta) {
  const W=32,H=48,g=Array.from({length:H},()=>new Array(W).fill(0));
  const fill=(r1,c1,r2,c2,v)=>{for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++)g[r][c]=v;};
  const hl=(r,c1,c2,v)=>{for(let c=c1;c<=c2;c++)g[r][c]=v;};
  const vl=(c,r1,r2,v)=>{for(let r=r1;r<=r2;r++)g[r][c]=v;};
  if(style==='classic'){
    fill(0,0,1,W-1,1);fill(H-2,0,H-1,W-1,1);vl(0,0,H-1,1);vl(1,0,H-1,1);vl(W-1,0,H-1,1);vl(W-2,0,H-1,1);
    hl(2,2,W-3,2);hl(H-3,2,W-3,2);vl(2,2,H-3,2);vl(W-3,2,H-3,2);
    fill(3,3,6,W-4,3);hl(7,2,W-3,2);hl(40,2,W-3,2);fill(41,3,H-4,W-4,3);
    [0,1,H-2,H-1].forEach(r=>{g[r][0]=2;g[r][W-1]=2;});
  } else if(style==='ornate'){
    fill(0,0,0,W-1,1);fill(H-1,0,H-1,W-1,1);vl(0,0,H-1,1);vl(W-1,0,H-1,1);
    hl(1,1,W-2,2);hl(H-2,1,W-2,2);vl(1,1,H-2,2);vl(W-2,1,H-2,2);
    hl(2,2,W-3,1);hl(H-3,2,W-3,1);vl(2,2,H-3,1);vl(W-3,2,H-3,1);
    hl(3,3,W-4,2);hl(H-4,3,W-4,2);
    fill(4,3,6,W-4,3);hl(7,3,W-4,1);hl(8,3,W-4,2);
    hl(39,3,W-4,2);hl(40,3,W-4,1);fill(41,3,H-5,W-4,3);
    [[0,0],[0,1],[1,0],[0,W-1],[0,W-2],[1,W-1],[H-1,0],[H-1,1],[H-2,0],[H-1,W-1],[H-1,W-2],[H-2,W-1]].forEach(([r,c])=>{g[r][c]=2;});
    g[0][15]=2;g[0][16]=2;
  } else if(style==='gothic'){
    fill(0,0,2,W-1,1);fill(H-3,0,H-1,W-1,1);
    vl(0,0,H-1,1);vl(1,0,H-1,1);vl(2,0,H-1,1);vl(W-1,0,H-1,1);vl(W-2,0,H-1,1);vl(W-3,0,H-1,1);
    hl(3,3,W-4,2);hl(H-4,3,W-4,2);vl(3,3,H-4,2);vl(W-4,3,H-4,2);
    fill(4,4,6,W-5,3);hl(7,3,W-4,1);hl(40,3,W-4,1);fill(41,4,H-5,W-5,3);
    [13,14,15,16,17,18].forEach(c=>{g[0][c]=2;});[14,15,16,17].forEach(c=>{g[1][c]=2;});
    [[1,1],[2,2],[1,W-2],[2,W-3],[H-2,1],[H-3,2],[H-2,W-2],[H-3,W-3]].forEach(([r,c])=>{g[r][c]=2;});
  }
  return {grid:g, partTypes:[
    {value:0,label:'Empty',labelJa:'空',color:'#F5F5F5'},{value:1,label:'Border',labelJa:'枠',color:tb},
    {value:2,label:'Accent',labelJa:'アクセント',color:ta},{value:3,label:'Fill',labelJa:'背景',color:'#FFFFFF'}],
    customColors:{0:'#F5F5F5',1:tb,2:ta,3:'#FFFFFF'}};
}

function genBack(style,tb,ta) {
  const W=32,H=48,g=Array.from({length:H},()=>new Array(W).fill(1));
  if(style==='classic'){
    const cx=16,cy=24;for(let r=0;r<H;r++)for(let c=0;c<W;c++){
      const d=Math.abs(r-cy)+Math.abs(c-cx);if(d<=10)g[r][c]=2;if(d<=7)g[r][c]=1;if(d<=4)g[r][c]=2;}
  } else if(style==='ornate'){
    for(let r=0;r<H;r++)for(let c=0;c<W;c++)if((r+c)%6===0||(r-c+48)%6===0)g[r][c]=2;
  } else if(style==='gothic'){
    for(let r=0;r<H;r++)for(let c=0;c<W;c++)if(c%6<2)g[r][c]=2;
  }
  for(let r=0;r<H;r++){g[r][0]=2;g[r][1]=2;g[r][W-1]=2;g[r][W-2]=2;}
  for(let c=0;c<W;c++){g[0][c]=2;g[1][c]=2;g[H-1][c]=2;g[H-2][c]=2;}
  return {grid:g, partTypes:[
    {value:0,label:'Empty',labelJa:'空',color:'#F5F5F5'},{value:1,label:'Base',labelJa:'ベース',color:tb},
    {value:2,label:'Accent',labelJa:'アクセント',color:ta}],
    customColors:{0:'#F5F5F5',1:tb,2:ta}};
}

function genCharPreset(code) {
  const d=CHAR_DEFS[code]; if(!d) return null;
  const W=24,H=32,g=Array.from({length:H},()=>new Array(W).fill(0));
  d.r.forEach(([v,x,y,w,h])=>{for(let r=y;r<y+h&&r<H;r++)for(let c=x;c<x+w&&c<W;c++)if(r>=0&&c>=0)g[r][c]=v;});
  return {grid:g, partTypes:[
    {value:0,label:'Empty',labelJa:'空',color:'#F5F5F5'},
    {value:1,label:'Body',labelJa:'体',color:d.c[1]},
    {value:2,label:'Clothes',labelJa:'服',color:d.c[2]},
    {value:3,label:'Detail',labelJa:'装飾',color:d.c[3]}
  ], customColors:{0:'#F5F5F5',...d.c}};
}

function loadPreset(style) {
  const tiers={mob:{b:'#2d1518',a:'#e8b4b8'},elite:{b:'#0a3070',a:'#7eaadc'},legend:{b:'#501a60',a:'#c48ed0'}};
  ['mob','elite','legend'].forEach(tier=>{
    const cc=Object.keys(CARD_DATA).find(k=>CARD_DATA[k].tier===tier);if(!cc)return;
    importAssetJSON(cc,'frame',genFrame(style,tiers[tier].b,tiers[tier].a));
    importAssetJSON(cc,'back',genBack(style,tiers[tier].b,tiers[tier].a));
  });
  const catTier={mob:'mob',elite:'elite',legend:'legend',house:'legend',wind:'legend'};
  Object.keys(ICON_PATTERNS).forEach(cat=>{
    const cc=Object.keys(CARD_DATA).find(k=>CARD_DATA[k].category===cat);if(!cc)return;
    const t=catTier[cat],rows=ICON_PATTERNS[cat].split('|').map(r=>r.split('').map(Number));
    importAssetJSON(cc,'icon',{grid:rows,
      partTypes:[{value:0,label:'Empty',labelJa:'空',color:'#F5F5F5'},{value:1,label:'Main',labelJa:'メイン',color:tiers[t].b}],
      customColors:{0:'#F5F5F5',1:tiers[t].b}});
  });
  const seen={};Object.entries(CARD_DATA).forEach(([code,card])=>{
    if(seen[card.points])return;seen[card.points]=true;
    importAssetJSON(code,'points',{grid:genPointsGrid(card.points),
      partTypes:[{value:0,label:'Empty',labelJa:'空',color:'#F5F5F5'},{value:1,label:'Digit',labelJa:'数字',color:'#1a1a1a'},{value:2,label:'Outline',labelJa:'フチ',color:'#FFFFFF'}],
      customColors:{0:'#F5F5F5',1:'#1a1a1a',2:'#FFFFFF'}});
  });
  // Characters
  Object.keys(CARD_DATA).forEach(code=>{
    const ch=genCharPreset(code);
    if(ch) importAssetJSON(code,'character',ch);
  });
  buildCardGrid();
  toast(T('toast-preset-loaded'));
}

const SLOT_ORDER = ['character', 'frame', 'back', 'icon', 'points'];

function getMetaForSlot(slotType, card) {
  if (slotType === 'character') return card.tier; // stored but search is by card code for unique
  if (slotType === 'frame' || slotType === 'back') return card.tier;
  if (slotType === 'icon') return card.category;
  if (slotType === 'points') return String(card.points);
  return '';
}

// SECTION 4: Storage
// ═══════════════════════════════════════════════════════════════
const STORAGE_KEY = 'frog_card_editor';
const SCHEMA_VERSION = 1;

function createEmptyStore() {
  return { version: SCHEMA_VERSION, assets: {}, cardAssignments: {}, settings: { lang: 'en', frameStyle: 'classic' } };
}

let store = createEmptyStore();

function loadStore() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) { store = createEmptyStore(); return; }
    const data = JSON.parse(raw);
    if (!data.version || data.version < SCHEMA_VERSION) { store = createEmptyStore(); return; }
    // Restore grids to Int8Array
    Object.values(data.assets).forEach(a => { a.grid = a.grid.map(r => Int8Array.from(r)); });
    store = data;
    // Migration: ensure frameStyle setting exists
    if (!store.settings) store.settings = {};
    if (!store.settings.frameStyle) store.settings.frameStyle = 'classic';
  } catch (e) { store = createEmptyStore(); }
}

function saveStore() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(store, (k, v) =>
      v instanceof Int8Array ? Array.from(v) : v
    ));
  } catch (e) { toast('Storage full'); }
}

function findDefaultAsset(type, meta) {
  const candidates = Object.values(store.assets)
    .filter(a => a.type === type && a.meta === meta)
    .sort((a, b) => a.createdAt - b.createdAt);
  return candidates.length > 0 ? candidates[0].id : null;
}

function getAssignments(cardCode) {
  const card = CARD_DATA[cardCode];
  if (!store.cardAssignments[cardCode]) {
    store.cardAssignments[cardCode] = {
      character: null, frame: null, back: null, icon: null, points: null,
    };
  }
  const assign = store.cardAssignments[cardCode];
  // Ensure offsets exist (backward compat)
  if (!assign.offsets) assign.offsets = {};
  ['character','frame','icon','points'].forEach(k => {
    if (!assign.offsets[k]) assign.offsets[k] = { dx: 0, dy: 0 };
  });
  // Auto-fill null shared slots with defaults (re-checked each time)
  if (!assign.frame)  assign.frame  = findDefaultAsset('frame', card.tier);
  if (!assign.back)   assign.back   = findDefaultAsset('back', card.tier);
  if (!assign.icon)   assign.icon   = findDefaultAsset('icon', card.category);
  if (!assign.points) assign.points = findDefaultAsset('points', String(card.points));
  return assign;
}

function countDoneSlots(cardCode) {
  const assign = getAssignments(cardCode);
  return SLOT_ORDER.filter(s => assign[s] && store.assets[assign[s]]).length;
}

let currentView = 'viewCardSelect';
let selectedCardCode = null;
let editingAssetKey = null; // currently editing asset ID
let editingSlotType = null; // which slot type we're editing
let editingFromShared = false; // editing shared asset directly from card list

function showView(viewId) {
  ['viewCardSelect', 'viewDashboard', 'viewEditor'].forEach(v =>
    document.getElementById(v).style.display = v === viewId ? '' : 'none');
  currentView = viewId;
  updateBackLink();
}

function updateBackLink() {
  const lbl = document.getElementById('backLabel');
  if (currentView === 'viewCardSelect') {
    lbl.textContent = T('back');
  } else if (currentView === 'viewDashboard') {
    lbl.textContent = T('back-cards');
  } else if (currentView === 'viewEditor') {
    lbl.textContent = T('back-cards');
  }
}

function navigateBack() {
  if (currentView === 'viewEditor') {
    editingFromShared = false;
    showView('viewCardSelect');
    buildCardGrid();
  } else if (currentView === 'viewDashboard') {
    showView('viewCardSelect');
    buildCardGrid();
  }
}

function buildSharedAssets(container) {

function renderCardThumbnail(canvas, cardCode) {
  const card = CARD_DATA[cardCode];
  if (!card) return;
  const scale = 3;
  const W = 32, H = 48;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * scale * dpr;
  canvas.height = H * scale * dpr;
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  renderCardComposite(ctx, cardCode, scale, { hiResFrame: true });

  // If no character data, overlay a "?" placeholder
  const assign = getAssignments(cardCode);
  const charAsset = assign.character ? store.assets[assign.character] : null;
  if (!charAsset) {
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(0, 0, W * scale, H * scale);
    ctx.font = `bold ${scale * 10}px Outfit, system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('?', W * scale / 2, H * scale / 2);
  }
}

function updateEditorPreview() {
  const canvas = document.getElementById('editorPreviewCanvas');
  if (!canvas || !selectedCardCode) return;
  // Only update if editor view is visible
  if (currentView !== 'viewEditor') return;
  const scale = 4;
  const W = 32, H = 48;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * scale * dpr;
  canvas.height = H * scale * dpr;
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  renderCardComposite(ctx, selectedCardCode, scale, { hiResFrame: true });
}

      // Frame/Back/Icon/Points: always draw hi-res programmatic thumbnail

      if (slotType === 'frame') {

// ── Position Adjustment ──
let posAdjustMode = false;
let posDragLayer = null;
let posDragStart = null;

function togglePositionAdjust() {
  posAdjustMode = !posAdjustMode;
  const btn = document.getElementById('adjustPosBtn');
  const resetBtn = document.getElementById('resetPosBtn');
  btn.textContent = posAdjustMode ? T('adjust-pos-done') : T('adjust-pos');
  btn.classList.toggle('primary', posAdjustMode);
  resetBtn.style.display = posAdjustMode ? '' : 'none';
  updateCompositePreview(selectedCardCode);
}

function resetPositions() {
  const assign = getAssignments(selectedCardCode);
  ['character','frame','icon','points'].forEach(k => { assign.offsets[k] = { dx: 0, dy: 0 }; });
  saveStore();
  updateCompositePreview(selectedCardCode);
  toast(T('toast-pos-reset'));
}

function getLayerDefaultPos(layerType, asset) {
  if (layerType === 'frame') return { x: 0, y: 0 };
  if (layerType === 'character') {
    const base = getAssetBaseSize(asset);
    const w = Math.min(asset.width, base.w), h = Math.min(asset.height, base.h);
    return { x: Math.floor((32 - w) / 2), y: 8 + Math.floor((32 - h) / 2) };
  }
  if (layerType === 'points') return { x: 32 - asset.width - 1, y: 2 };
  if (layerType === 'icon') return { x: 1, y: 40 };
  return { x: 0, y: 0 };
}

function getLayerPos(layerType, asset, offsets) {
  const def = getLayerDefaultPos(layerType, asset);
  const off = offsets[layerType] || { dx: 0, dy: 0 };
  return { x: def.x + off.dx, y: def.y + off.dy };
}

function hitTestComposite(gx, gy, assign, offsets) {
  // Test from top layer down
  const layers = ['icon', 'points', 'character', 'frame'];
  for (const lt of layers) {
    const assetId = assign[lt]; if (!assetId) continue;
    const asset = store.assets[assetId]; if (!asset) continue;
    const base = getAssetBaseSize(asset);
    const w = Math.min(asset.width, base.w), h = Math.min(asset.height, base.h);
    const pos = getLayerPos(lt, asset, offsets);
    if (gx >= pos.x && gx < pos.x + w && gy >= pos.y && gy < pos.y + h) return lt;
  }
  return null;
}

// Composite canvas drag events
(function setupCompositeDrag() {
  const canvas = document.getElementById('compositeCanvas');
  const scale = 6;

  function getGridXY(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = (e.clientX || e.touches?.[0]?.clientX) - rect.left;
    const cy = (e.clientY || e.touches?.[0]?.clientY) - rect.top;
    return { gx: Math.floor(cx / scale), gy: Math.floor(cy / scale) };
  }

  function onStart(e) {
    if (!posAdjustMode || !selectedCardCode) return;
    e.preventDefault();
    const { gx, gy } = getGridXY(e);
    const assign = getAssignments(selectedCardCode);
    const hit = hitTestComposite(gx, gy, assign, assign.offsets);
    if (!hit) return;
    posDragLayer = hit;
    posDragStart = { gx, gy, origDx: assign.offsets[hit].dx, origDy: assign.offsets[hit].dy };
    updateCompositePreview(selectedCardCode);
  }

  function onMove(e) {
    if (!posDragLayer || !posDragStart) return;
    e.preventDefault();
    const { gx, gy } = getGridXY(e);
    const assign = getAssignments(selectedCardCode);
    assign.offsets[posDragLayer].dx = posDragStart.origDx + (gx - posDragStart.gx);
    assign.offsets[posDragLayer].dy = posDragStart.origDy + (gy - posDragStart.gy);
    updateCompositePreview(selectedCardCode);
  }

  function onEnd() {
    if (posDragLayer) {
      posDragLayer = null; posDragStart = null;
      saveStore();
      updateCompositePreview(selectedCardCode);
    }
  }

  canvas.addEventListener('mousedown', onStart);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseup', onEnd);
  canvas.addEventListener('mouseleave', onEnd);
  canvas.addEventListener('touchstart', onStart, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchend', onEnd);
})();

// ── Hi-Res Frame / Back / Icon / Points Drawing ──
// Canvas 2D programmatic drawing — replaces grid-based pixel art for non-character assets.
// These are informational/decorative elements that benefit from high resolution.

const hiResCache = {}; // key: "type_style_meta" → OffscreenCanvas
function getHiResCached(type, style, meta, w, h, drawFn) {
  const key = `${type}_${style}_${meta}`;
  if (!hiResCache[key]) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const cx = c.getContext('2d');
    drawFn(cx, w, h);
    hiResCache[key] = c;
  }
  return hiResCache[key];
}
function clearHiResCache(prefix) {
  Object.keys(hiResCache).forEach(k => { if (!prefix || k.startsWith(prefix)) delete hiResCache[k]; });
}

// ── Helper: parse hex to RGB ──
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}
function rgbStr(r,g,b,a) { return a !== undefined ? `rgba(${r},${g},${b},${a})` : `rgb(${r},${g},${b})`; }
function lerpColor(c1, c2, t) {
  const a = hexToRgb(c1), b = hexToRgb(c2);
  return rgbStr(Math.round(a.r+(b.r-a.r)*t), Math.round(a.g+(b.g-a.g)*t), Math.round(a.b+(b.b-a.b)*t));
}

function drawHiResFrame(ctx, style, tier, x, y, w, h) {
  const tc = TIER_COLORS[tier] || TIER_COLORS.mob;
  const cached = getHiResCached('frame', style, tier, w, h, (cx, cw, ch) => {
    const m = Math.min(cw, ch);
    // ── Background ──
    cx.fillStyle = '#F8F6F0';
    cx.beginPath(); cx.roundRect(0, 0, cw, ch, m * 0.025); cx.fill();

    // ── Outer border (double line) ──
    cx.strokeStyle = tc.back;
    cx.lineWidth = m * 0.02;
    cx.beginPath(); cx.roundRect(m*0.01, m*0.01, cw-m*0.02, ch-m*0.02, m*0.02); cx.stroke();
    cx.lineWidth = m * 0.005;
    cx.beginPath(); cx.roundRect(m*0.035, m*0.035, cw-m*0.07, ch-m*0.07, m*0.015); cx.stroke();

    // ── Inner decorative border ──
    const inset = m * 0.05;
    cx.strokeStyle = tc.accent;
    cx.lineWidth = m * 0.008;
    cx.beginPath(); cx.roundRect(inset, inset, cw - inset*2, ch - inset*2, m*0.01); cx.stroke();

    // ── Corner ornaments (fleur-de-lis inspired) ──
    const cs = m * 0.06;
    const corners = [[inset, inset], [cw-inset, inset], [inset, ch-inset], [cw-inset, ch-inset]];
    cx.fillStyle = tc.accent;
    corners.forEach(([ox, oy]) => {
      cx.save(); cx.translate(ox, oy);
      // Diamond
      cx.beginPath();
      cx.moveTo(0, -cs); cx.lineTo(cs*0.5, 0); cx.lineTo(0, cs); cx.lineTo(-cs*0.5, 0);
      cx.closePath(); cx.fill();
      // Circle center
      cx.beginPath(); cx.arc(0, 0, cs*0.2, 0, Math.PI*2); cx.fillStyle = tc.back; cx.fill();
      cx.fillStyle = tc.accent;
      cx.restore();
    });

    // ── Title bar (top) — subtle gradient band ──
    const tbH = ch * 0.15;
    const tbY = inset;
    const tbGrad = cx.createLinearGradient(0, tbY, 0, tbY + tbH);
    tbGrad.addColorStop(0, tc.back + 'BB');
    tbGrad.addColorStop(0.5, tc.back + '66');
    tbGrad.addColorStop(1, 'transparent');
    cx.fillStyle = tbGrad;
    cx.fillRect(inset, tbY, cw - inset*2, tbH);

    // ── Bottom info bar ──
    const bbH = ch * 0.16;
    const bbY = ch - inset - bbH;
    const bbGrad = cx.createLinearGradient(0, bbY, 0, bbY + bbH);
    bbGrad.addColorStop(0, 'transparent');
    bbGrad.addColorStop(0.5, tc.back + '44');
    bbGrad.addColorStop(1, tc.back + 'AA');
    cx.fillStyle = bbGrad;
    cx.fillRect(inset, bbY, cw - inset*2, bbH);

    // ── Tier-specific decorations ──
    if (tier === 'elite' || tier === 'legend') {
      // Thin gold/accent line halfway between borders
      const mid = (inset + m*0.035) / 2;
      cx.strokeStyle = tc.accent + '60';
      cx.lineWidth = m * 0.003;
      cx.setLineDash([m*0.02, m*0.015]);
      cx.beginPath(); cx.roundRect(mid, mid, cw - mid*2, ch - mid*2, m*0.018); cx.stroke();
      cx.setLineDash([]);
    }
    if (tier === 'legend') {
      // Radial glow behind center area
      const grad = cx.createRadialGradient(cw/2, ch*0.5, 0, cw/2, ch*0.5, m*0.4);
      grad.addColorStop(0, tc.accent + '18');
      grad.addColorStop(1, 'transparent');
      cx.fillStyle = grad;
      cx.fillRect(0, 0, cw, ch);
      // Extra corner filigree
      const fSize = m * 0.04;
      corners.forEach(([ox, oy]) => {
        cx.save(); cx.translate(ox, oy);
        cx.strokeStyle = tc.accent + '80';
        cx.lineWidth = m * 0.004;
        for (let a = 0; a < 4; a++) {
          cx.save(); cx.rotate(a * Math.PI / 2);
          cx.beginPath(); cx.moveTo(fSize, 0); cx.quadraticCurveTo(fSize*1.5, fSize*0.5, fSize, fSize); cx.stroke();
          cx.restore();
        }
        cx.restore();
      });
    }
  });
  ctx.drawImage(cached, x, y, w, h);
}

function drawHiResBack(ctx, style, tier, x, y, w, h) {
  const tc = TIER_COLORS[tier] || TIER_COLORS.mob;
  const cached = getHiResCached('back', style, tier, w, h, (cx, cw, ch) => {
    const m = Math.min(cw, ch);
    // ── Base fill with subtle texture gradient ──
    const bg = cx.createLinearGradient(0, 0, 0, ch);
    bg.addColorStop(0, tc.back);
    bg.addColorStop(0.5, lerpColor(tc.back, tc.accent, 0.08));
    bg.addColorStop(1, tc.back);
    cx.fillStyle = bg;
    cx.beginPath(); cx.roundRect(0, 0, cw, ch, m*0.025); cx.fill();

    // ── Diamond lattice pattern (playing card style) ──
    const step = m * 0.06;
    cx.save();
    cx.beginPath(); cx.roundRect(0, 0, cw, ch, m*0.025); cx.clip();
    // First layer: small diamonds
    cx.fillStyle = tc.accent + '15';
    for (let ry = -step; ry < ch + step; ry += step) {
      for (let rx = -step; rx < cw + step; rx += step) {
        cx.save(); cx.translate(rx, ry); cx.rotate(Math.PI/4);
        cx.fillRect(-step*0.25, -step*0.25, step*0.5, step*0.5);
        cx.restore();
      }
    }
    // Second layer: offset grid of smaller diamonds
    cx.fillStyle = tc.accent + '10';
    for (let ry = -step; ry < ch + step; ry += step) {
      for (let rx = -step; rx < cw + step; rx += step) {
        cx.save(); cx.translate(rx + step/2, ry + step/2); cx.rotate(Math.PI/4);
        cx.fillRect(-step*0.15, -step*0.15, step*0.3, step*0.3);
        cx.restore();
      }
    }
    // ── Cross-hatch fine lines ──
    cx.strokeStyle = tc.accent + '12';
    cx.lineWidth = 0.5;
    const diagStep = m * 0.04;
    for (let d = -cw - ch; d < cw + ch; d += diagStep) {
      cx.beginPath(); cx.moveTo(d, 0); cx.lineTo(d + ch, ch); cx.stroke();
      cx.beginPath(); cx.moveTo(d + cw, 0); cx.lineTo(d, ch); cx.stroke();
    }
    cx.restore();

    // ── Nested border frames ──
    const borders = [
      { inset: m*0.015, width: m*0.012, color: tc.accent },
      { inset: m*0.04,  width: m*0.004, color: tc.accent + '80' },
      { inset: m*0.06,  width: m*0.008, color: tc.accent + 'AA' },
      { inset: m*0.085, width: m*0.003, color: tc.accent + '50' },
    ];
    borders.forEach(b => {
      cx.strokeStyle = b.color; cx.lineWidth = b.width;
      cx.beginPath(); cx.roundRect(b.inset, b.inset, cw-b.inset*2, ch-b.inset*2, m*0.015); cx.stroke();
    });

    // ── Central medallion ──
    const mcx = cw/2, mcy = ch/2;
    const outerR = m * 0.22, innerR = m * 0.16;
    // Outer ring
    cx.beginPath(); cx.arc(mcx, mcy, outerR, 0, Math.PI*2);
    cx.strokeStyle = tc.accent + '50'; cx.lineWidth = m*0.005; cx.stroke();
    // Radiating spokes
    cx.strokeStyle = tc.accent + '25'; cx.lineWidth = m*0.003;
    for (let a = 0; a < 12; a++) {
      const angle = a * Math.PI / 6;
      cx.beginPath();
      cx.moveTo(mcx + Math.cos(angle)*innerR*0.3, mcy + Math.sin(angle)*innerR*0.3);
      cx.lineTo(mcx + Math.cos(angle)*outerR, mcy + Math.sin(angle)*outerR);
      cx.stroke();
    }
    // Inner circle with gradient
    const mGrad = cx.createRadialGradient(mcx, mcy, 0, mcx, mcy, innerR);
    mGrad.addColorStop(0, tc.accent + '30');
    mGrad.addColorStop(0.7, tc.accent + '15');
    mGrad.addColorStop(1, 'transparent');
    cx.fillStyle = mGrad;
    cx.beginPath(); cx.arc(mcx, mcy, innerR, 0, Math.PI*2); cx.fill();
    cx.strokeStyle = tc.accent + '60'; cx.lineWidth = m*0.006;
    cx.beginPath(); cx.arc(mcx, mcy, innerR, 0, Math.PI*2); cx.stroke();
    // Central diamond
    const ds = m * 0.06;
    cx.fillStyle = tc.accent + '50';
    cx.beginPath();
    cx.moveTo(mcx, mcy-ds); cx.lineTo(mcx+ds*0.6, mcy); cx.lineTo(mcx, mcy+ds); cx.lineTo(mcx-ds*0.6, mcy);
    cx.closePath(); cx.fill();

    // ── Corner flourishes (4-fold symmetry) ──
    const ci = m * 0.1;
    cx.strokeStyle = tc.accent + '40'; cx.lineWidth = m * 0.004;
    [[ci, ci, 0], [cw-ci, ci, Math.PI/2], [cw-ci, ch-ci, Math.PI], [ci, ch-ci, -Math.PI/2]].forEach(([ox, oy, rot]) => {
      cx.save(); cx.translate(ox, oy); cx.rotate(rot);
      const s = m * 0.05;
      // Scroll curve
      cx.beginPath();
      cx.moveTo(0, -s*1.5); cx.quadraticCurveTo(s*1.2, -s*1.2, s*1.5, 0);
      cx.stroke();
      cx.beginPath();
      cx.moveTo(0, -s); cx.quadraticCurveTo(s*0.8, -s*0.5, s, 0);
      cx.stroke();
      // Small dot
      cx.fillStyle = tc.accent + '50';
      cx.beginPath(); cx.arc(0, 0, m*0.008, 0, Math.PI*2); cx.fill();
      cx.restore();
    });
  });
  ctx.drawImage(cached, x, y, w, h);
}

function drawHiResIcon(ctx, category, tier, x, y, size) {
  const tc = TIER_COLORS[tier] || TIER_COLORS.mob;
  const cached = getHiResCached('icon', 'v2', category + '_' + tier, size, size, (cx, cw, ch) => {
    const m = Math.min(cw, ch);
    const midX = cw / 2, midY = ch / 2;
    const rgb = hexToRgb(tc.accent);
    const rgbBack = hexToRgb(tc.back);

    // ── Ornate background badge (octagonal shield) ──
    const r = m * 0.46;
    cx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a1 = (Math.PI * 2 * i / 8) - Math.PI / 8;
      const a2 = (Math.PI * 2 * (i + 1) / 8) - Math.PI / 8;
      const x1 = midX + r * Math.cos(a1), y1 = midY + r * Math.sin(a1);
      const x2 = midX + r * Math.cos(a2), y2 = midY + r * Math.sin(a2);
      if (i === 0) cx.moveTo(x1, y1);
      // Slight inward curve on each edge
      const mx = (x1 + x2) / 2 + (midX - (x1 + x2) / 2) * 0.08;
      const my = (y1 + y2) / 2 + (midY - (y1 + y2) / 2) * 0.08;
      cx.quadraticCurveTo(mx, my, x2, y2);
    }
    cx.closePath();
    // Gradient fill
    const bgGrad = cx.createRadialGradient(midX, midY * 0.7, 0, midX, midY, r);
    bgGrad.addColorStop(0, `rgba(${rgbBack[0] + 30},${rgbBack[1] + 30},${rgbBack[2] + 30},0.95)`);
    bgGrad.addColorStop(1, tc.back + 'F0');
    cx.fillStyle = bgGrad;
    cx.fill();
    // Border
    cx.strokeStyle = tc.accent + '60';
    cx.lineWidth = m * 0.025;
    cx.stroke();
    // Inner border (slightly smaller)
    cx.save();
    cx.scale(0.88, 0.88);
    cx.translate(midX * (1/0.88 - 1), midY * (1/0.88 - 1));
    cx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a1 = (Math.PI * 2 * i / 8) - Math.PI / 8;
      const a2 = (Math.PI * 2 * (i + 1) / 8) - Math.PI / 8;
      const x1 = midX + r * Math.cos(a1), y1 = midY + r * Math.sin(a1);
      const x2 = midX + r * Math.cos(a2), y2 = midY + r * Math.sin(a2);
      if (i === 0) cx.moveTo(x1, y1);
      const mx = (x1 + x2) / 2 + (midX - (x1 + x2) / 2) * 0.08;
      const my = (y1 + y2) / 2 + (midY - (y1 + y2) / 2) * 0.08;
      cx.quadraticCurveTo(mx, my, x2, y2);
    }
    cx.closePath();
    cx.strokeStyle = tc.accent + '25';
    cx.lineWidth = m * 0.015;
    cx.stroke();
    cx.restore();

    // ── Draw vector icon by category ──
    cx.save();
    cx.shadowColor = tc.accent;
    cx.shadowBlur = m * 0.08;

    if (category === 'mob') {
      // Sword icon
      const s = m * 0.3;
      cx.fillStyle = tc.accent;
      cx.strokeStyle = tc.accent;
      cx.lineWidth = m * 0.03;
      cx.lineCap = 'round';
      cx.lineJoin = 'round';
      // Blade
      cx.beginPath();
      cx.moveTo(midX, midY - s * 1.1);
      cx.lineTo(midX + s * 0.15, midY - s * 0.1);
      cx.lineTo(midX, midY + s * 0.05);
      cx.lineTo(midX - s * 0.15, midY - s * 0.1);
      cx.closePath();
      // Blade gradient
      const bladeGrad = cx.createLinearGradient(midX - s * 0.15, 0, midX + s * 0.15, 0);
      bladeGrad.addColorStop(0, tc.accent + 'AA');
      bladeGrad.addColorStop(0.5, '#FFFFFF');
      bladeGrad.addColorStop(1, tc.accent + 'AA');
      cx.fillStyle = bladeGrad;
      cx.fill();
      cx.strokeStyle = tc.accent;
      cx.lineWidth = m * 0.012;
      cx.stroke();
      // Cross guard
      cx.fillStyle = tc.accent;
      cx.beginPath();
      cx.roundRect(midX - s * 0.45, midY - s * 0.05, s * 0.9, s * 0.12, m * 0.02);
      cx.fill();
      // Grip
      cx.fillStyle = tc.accent + 'CC';
      cx.beginPath();
      cx.roundRect(midX - s * 0.08, midY + s * 0.1, s * 0.16, s * 0.55, m * 0.015);
      cx.fill();
      // Pommel
      cx.fillStyle = tc.accent;
      cx.beginPath();
      cx.arc(midX, midY + s * 0.75, s * 0.12, 0, Math.PI * 2);
      cx.fill();

    } else if (category === 'elite') {
      // Diamond / gem icon
      const s = m * 0.32;
      // Top facet (crown)
      cx.beginPath();
      cx.moveTo(midX - s * 0.9, midY - s * 0.2);
      cx.lineTo(midX - s * 0.5, midY - s * 0.9);
      cx.lineTo(midX, midY - s * 0.7);
      cx.lineTo(midX + s * 0.5, midY - s * 0.9);
      cx.lineTo(midX + s * 0.9, midY - s * 0.2);
      cx.closePath();
      const topGrad = cx.createLinearGradient(0, midY - s, 0, midY - s * 0.2);
      topGrad.addColorStop(0, '#FFFFFF');
      topGrad.addColorStop(1, tc.accent);
      cx.fillStyle = topGrad;
      cx.fill();
      // Bottom facet (pavilion)
      cx.beginPath();
      cx.moveTo(midX - s * 0.9, midY - s * 0.2);
      cx.lineTo(midX, midY + s * 1.0);
      cx.lineTo(midX + s * 0.9, midY - s * 0.2);
      cx.closePath();
      const botGrad = cx.createLinearGradient(midX - s, 0, midX + s, 0);
      botGrad.addColorStop(0, tc.accent + 'CC');
      botGrad.addColorStop(0.5, tc.accent);
      botGrad.addColorStop(1, tc.accent + '99');
      cx.fillStyle = botGrad;
      cx.fill();
      // Left inner facet
      cx.beginPath();
      cx.moveTo(midX - s * 0.9, midY - s * 0.2);
      cx.lineTo(midX, midY - s * 0.2);
      cx.lineTo(midX, midY + s * 1.0);
      cx.closePath();
      cx.fillStyle = 'rgba(255,255,255,0.15)';
      cx.fill();
      // Dividing line
      cx.strokeStyle = tc.accent + '80';
      cx.lineWidth = m * 0.01;
      cx.beginPath();
      cx.moveTo(midX - s * 0.9, midY - s * 0.2);
      cx.lineTo(midX + s * 0.9, midY - s * 0.2);
      cx.stroke();
      // Facet lines
      cx.beginPath();
      cx.moveTo(midX, midY - s * 0.7);
      cx.lineTo(midX, midY - s * 0.2);
      cx.moveTo(midX - s * 0.5, midY - s * 0.9);
      cx.lineTo(midX - s * 0.2, midY - s * 0.2);
      cx.moveTo(midX + s * 0.5, midY - s * 0.9);
      cx.lineTo(midX + s * 0.2, midY - s * 0.2);
      cx.stroke();
      // Outline
      cx.strokeStyle = tc.accent;
      cx.lineWidth = m * 0.015;
      cx.beginPath();
      cx.moveTo(midX - s * 0.9, midY - s * 0.2);
      cx.lineTo(midX - s * 0.5, midY - s * 0.9);
      cx.lineTo(midX, midY - s * 0.7);
      cx.lineTo(midX + s * 0.5, midY - s * 0.9);
      cx.lineTo(midX + s * 0.9, midY - s * 0.2);
      cx.lineTo(midX, midY + s * 1.0);
      cx.closePath();
      cx.stroke();

    } else if (category === 'legend') {
      // Crown icon
      const s = m * 0.32;
      // Crown body
      cx.beginPath();
      cx.moveTo(midX - s * 0.9, midY + s * 0.5);
      cx.lineTo(midX - s * 0.8, midY - s * 0.2);
      cx.lineTo(midX - s * 0.45, midY + s * 0.15);
      cx.lineTo(midX, midY - s * 0.7);
      cx.lineTo(midX + s * 0.45, midY + s * 0.15);
      cx.lineTo(midX + s * 0.8, midY - s * 0.2);
      cx.lineTo(midX + s * 0.9, midY + s * 0.5);
      cx.closePath();
      const crownGrad = cx.createLinearGradient(0, midY - s * 0.7, 0, midY + s * 0.5);
      crownGrad.addColorStop(0, '#FFFFFF');
      crownGrad.addColorStop(0.3, tc.accent);
      crownGrad.addColorStop(1, tc.accent + 'BB');
      cx.fillStyle = crownGrad;
      cx.fill();
      cx.strokeStyle = tc.accent;
      cx.lineWidth = m * 0.015;
      cx.stroke();
      // Crown base band
      cx.fillStyle = tc.accent;
      cx.beginPath();
      cx.roundRect(midX - s * 0.9, midY + s * 0.35, s * 1.8, s * 0.22, m * 0.015);
      cx.fill();
      // Jewels on tips
      const jewels = [
        [midX - s * 0.8, midY - s * 0.2],
        [midX, midY - s * 0.7],
        [midX + s * 0.8, midY - s * 0.2]
      ];
      jewels.forEach(([jx, jy]) => {
        cx.fillStyle = '#FFFFFF';
        cx.beginPath();
        cx.arc(jx, jy, m * 0.04, 0, Math.PI * 2);
        cx.fill();
        cx.fillStyle = tc.accent;
        cx.beginPath();
        cx.arc(jx, jy, m * 0.025, 0, Math.PI * 2);
        cx.fill();
      });
      // Center jewel on band
      cx.fillStyle = '#FFFFFF';
      cx.beginPath();
      cx.arc(midX, midY + s * 0.46, m * 0.035, 0, Math.PI * 2);
      cx.fill();

    } else if (category === 'house') {
      // Castle / gate icon
      const s = m * 0.28;
      // Main tower
      cx.fillStyle = tc.accent;
      cx.beginPath();
      cx.roundRect(midX - s * 0.5, midY - s * 0.6, s * 1.0, s * 1.3, m * 0.01);
      cx.fill();
      // Battlements (merlons)
      const merlonW = s * 0.22, merlonH = s * 0.25, gap = s * 0.04;
      const startX = midX - s * 0.55;
      for (let i = 0; i < 4; i++) {
        cx.beginPath();
        cx.roundRect(startX + i * (merlonW + gap) + gap, midY - s * 0.85, merlonW, merlonH, m * 0.008);
        cx.fill();
      }
      // Gate arch
      const archR = s * 0.25;
      cx.fillStyle = tc.back;
      cx.beginPath();
      cx.arc(midX, midY + s * 0.7 - archR, archR, Math.PI, 0);
      cx.lineTo(midX + archR, midY + s * 0.7);
      cx.lineTo(midX - archR, midY + s * 0.7);
      cx.closePath();
      cx.fill();
      // Gate portcullis lines
      cx.strokeStyle = tc.accent + '60';
      cx.lineWidth = m * 0.01;
      const gateTop = midY + s * 0.7 - archR * 2;
      for (let i = -2; i <= 2; i++) {
        const lx = midX + i * archR * 0.35;
        cx.beginPath(); cx.moveTo(lx, midY + s * 0.12); cx.lineTo(lx, midY + s * 0.7); cx.stroke();
      }
      // Small windows
      cx.fillStyle = tc.back;
      cx.beginPath(); cx.arc(midX - s * 0.25, midY - s * 0.25, m * 0.035, 0, Math.PI * 2); cx.fill();
      cx.beginPath(); cx.arc(midX + s * 0.25, midY - s * 0.25, m * 0.035, 0, Math.PI * 2); cx.fill();
      // Side towers
      cx.fillStyle = tc.accent + 'BB';
      cx.beginPath(); cx.roundRect(midX - s * 0.85, midY - s * 0.3, s * 0.4, s * 1.0, m * 0.01); cx.fill();
      cx.beginPath(); cx.roundRect(midX + s * 0.45, midY - s * 0.3, s * 0.4, s * 1.0, m * 0.01); cx.fill();
      // Side battlements
      for (let side = -1; side <= 1; side += 2) {
        const sx = side < 0 ? midX - s * 0.85 : midX + s * 0.45;
        cx.fillStyle = tc.accent + 'BB';
        cx.beginPath(); cx.roundRect(sx, midY - s * 0.55, s * 0.18, s * 0.25, m * 0.006); cx.fill();
        cx.beginPath(); cx.roundRect(sx + s * 0.22, midY - s * 0.55, s * 0.18, s * 0.25, m * 0.006); cx.fill();
      }

    } else if (category === 'wind') {
      // Wind / air spiral icon
      cx.strokeStyle = tc.accent;
      cx.lineCap = 'round';
      cx.lineWidth = m * 0.04;
      cx.fillStyle = 'transparent';
      // Main swirl
      const drawSwirl = (ox, oy, scale, startA, endA, dir) => {
        cx.beginPath();
        const steps = 40;
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const angle = startA + (endA - startA) * t;
          const rad = scale * (0.15 + t * 0.85);
          const px = ox + rad * Math.cos(angle * dir);
          const py = oy + rad * Math.sin(angle * dir);
          if (i === 0) cx.moveTo(px, py); else cx.lineTo(px, py);
        }
        cx.stroke();
      };
      // Three flowing wind lines
      const windAlpha = ['FF', 'BB', '80'];
      const offsets = [
        { ox: midX + m * 0.05, oy: midY - m * 0.12, s: m * 0.22, sa: -0.3, ea: 2.8, d: 1 },
        { ox: midX - m * 0.05, oy: midY + m * 0.05, s: m * 0.18, sa: 0.2, ea: 2.5, d: 1 },
        { ox: midX + m * 0.02, oy: midY + m * 0.18, s: m * 0.14, sa: -0.5, ea: 2.2, d: 1 },
      ];
      offsets.forEach((w, i) => {
        cx.strokeStyle = tc.accent + windAlpha[i];
        cx.lineWidth = m * (0.04 - i * 0.008);
        drawSwirl(w.ox, w.oy, w.s, w.sa, w.ea, w.d);
      });
      // Small dots/particles
      cx.fillStyle = tc.accent + '80';
      const particles = [
        [midX - m * 0.22, midY - m * 0.08, m * 0.02],
        [midX + m * 0.25, midY + m * 0.02, m * 0.015],
        [midX - m * 0.1, midY + m * 0.25, m * 0.012],
        [midX + m * 0.18, midY - m * 0.2, m * 0.018],
      ];
      particles.forEach(([px, py, pr]) => {
        cx.beginPath(); cx.arc(px, py, pr, 0, Math.PI * 2); cx.fill();
      });
    }

    cx.restore();

    // ── Subtle top highlight ──
    const hlGrad = cx.createLinearGradient(0, midY - r, 0, midY);
    hlGrad.addColorStop(0, 'rgba(255,255,255,0.12)');
    hlGrad.addColorStop(1, 'rgba(255,255,255,0)');
    cx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a1 = (Math.PI * 2 * i / 8) - Math.PI / 8;
      const a2 = (Math.PI * 2 * (i + 1) / 8) - Math.PI / 8;
      const x1 = midX + r * Math.cos(a1), y1 = midY + r * Math.sin(a1);
      const x2 = midX + r * Math.cos(a2), y2 = midY + r * Math.sin(a2);
      if (i === 0) cx.moveTo(x1, y1);
      const mx = (x1 + x2) / 2 + (midX - (x1 + x2) / 2) * 0.08;
      const my = (y1 + y2) / 2 + (midY - (y1 + y2) / 2) * 0.08;
      cx.quadraticCurveTo(mx, my, x2, y2);
    }
    cx.closePath();
    cx.fillStyle = hlGrad;
    cx.fill();
  });
  ctx.drawImage(cached, x, y, size, size);
}

function drawHiResPoints(ctx, points, tier, x, y, w, h) {
  const tc = TIER_COLORS[tier] || TIER_COLORS.mob;
  const cached = getHiResCached('points', 'default', points + '_' + tier, w, h, (cx, cw, ch) => {
    const m = Math.min(cw, ch);
    // ── Shield / banner shape ──
    cx.fillStyle = tc.back;
    cx.beginPath();
    cx.moveTo(cw*0.1, 0);
    cx.lineTo(cw*0.9, 0);
    cx.quadraticCurveTo(cw, 0, cw, ch*0.15);
    cx.lineTo(cw, ch*0.65);
    cx.quadraticCurveTo(cw, ch*0.85, cw*0.5, ch);
    cx.quadraticCurveTo(0, ch*0.85, 0, ch*0.65);
    cx.lineTo(0, ch*0.15);
    cx.quadraticCurveTo(0, 0, cw*0.1, 0);
    cx.closePath();
    cx.fill();

    // ── Border line ──
    cx.strokeStyle = tc.accent;
    cx.lineWidth = m * 0.04;
    cx.stroke();

    // ── Inner highlight ──
    const iGrad = cx.createLinearGradient(0, 0, 0, ch);
    iGrad.addColorStop(0, tc.accent + '30');
    iGrad.addColorStop(0.5, 'transparent');
    iGrad.addColorStop(1, tc.accent + '20');
    cx.fillStyle = iGrad;
    cx.fill();

    // ── Text with shadow ──
    const fontSize = Math.round(ch * 0.55);
    cx.font = `bold ${fontSize}px Outfit, system-ui, sans-serif`;
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    // Shadow
    cx.fillStyle = 'rgba(0,0,0,0.3)';
    cx.fillText(`${points}`, cw/2 + 0.5, ch*0.42 + 0.5);
    // Main text
    cx.fillStyle = '#FFFFFF';
    cx.fillText(`${points}`, cw/2, ch*0.42);
    // "pt" subscript
    const subSize = Math.round(ch * 0.25);
    cx.font = `600 ${subSize}px Outfit, system-ui, sans-serif`;
    cx.fillStyle = tc.accent;
    cx.fillText('pt', cw/2, ch*0.75);
  });
  ctx.drawImage(cached, x, y, w, h);
}

// Re-render points after fonts load
document.fonts.ready.then(() => {
  clearHiResCache('points');
});

// ── Unified card composite renderer ──
// Single entry point for all card rendering: dashboard preview, card list thumbnails,
// editor sidebar preview, and PNG export. Ensures visual consistency everywhere.
function renderCardComposite(ctx, cardCode, scale, options) {
  const opts = Object.assign({ checkerboard: false, hiResFrame: true, time: 0 }, options || {});
  const card = CARD_DATA[cardCode];
  const assign = getAssignments(cardCode);
  const offsets = assign.offsets || {};
  const W = 32, H = 48;

  // Background
  if (opts.checkerboard) {
    for (let r = 0; r < H; r++) {
      for (let c = 0; c < W; c++) {
        ctx.fillStyle = (r + c) % 2 === 0 ? '#eee' : '#ddd';
        ctx.fillRect(c * scale, r * scale, scale, scale);
      }
    }
  }

  // Helper: draw a grid-based asset layer
  const drawLayer = (lt, asset) => {
    if (!asset) return;
    const pos = getLayerPos(lt, asset, offsets);
    drawAssetLayer(ctx, asset, pos.x, pos.y, scale);
  };

  // Layer 1: frame
  if (opts.hiResFrame && card) {
    const off = offsets.frame || { dx: 0, dy: 0 };
    const style = (store.settings && store.settings.frameStyle) || 'classic';
    drawHiResFrame(ctx, style, card.tier, off.dx * scale, off.dy * scale, W * scale, H * scale);
  } else {
    const frame = assign.frame ? store.assets[assign.frame] : null;
    drawLayer('frame', frame);
  }

  // Layer 2: character (always grid-based with effects)
  const char = assign.character ? store.assets[assign.character] : null;
  drawLayer('character', char);

  // Layer 3: points
  if (opts.hiResFrame && card) {
    const ptsOff = offsets.points || { dx: 0, dy: 0 };
    const defX = 32 - 12 - 1, defY = 2; // default position for 12×8 points
    const px = (defX + ptsOff.dx) * scale, py = (defY + ptsOff.dy) * scale;
    drawHiResPoints(ctx, card.points, card.tier, px, py, 12 * scale, 8 * scale);
  } else {
    const pts = assign.points ? store.assets[assign.points] : null;
    drawLayer('points', pts);
  }

  // Layer 4: icon
  if (opts.hiResFrame && card) {
    const icnOff = offsets.icon || { dx: 0, dy: 0 };
    const defX = 1, defY = 40; // default position for 8×8 icon
    const ix = (defX + icnOff.dx) * scale, iy = (defY + icnOff.dy) * scale;
    drawHiResIcon(ctx, card.category, card.tier, ix, iy, 8 * scale);
  } else {
    const icon = assign.icon ? store.assets[assign.icon] : null;
    drawLayer('icon', icon);
  }
}

function updateCompositePreview(cardCode) {
  const assign = getAssignments(cardCode);
  const hasRequired = assign.character && store.assets[assign.character] && assign.frame && store.assets[assign.frame];
  document.getElementById('exportPngBtn').disabled = !hasRequired;
  document.getElementById('exportJsonBtn').disabled = !hasRequired;
  document.getElementById('copyJsonBtn').disabled = !hasRequired;

  const canvas = document.getElementById('compositeCanvas');
  const ctx = canvas.getContext('2d');
  const scale = 6;
  canvas.width = 32 * scale; canvas.height = 48 * scale;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  renderCardComposite(ctx, cardCode, scale, { checkerboard: true });

  // Position adjust overlays (dashboard-only, not part of generic composite)
  if (posAdjustMode) {
    const offsets = assign.offsets || {};
    ['frame', 'character', 'points', 'icon'].forEach(lt => {
      const assetId = assign[lt];
      const asset = assetId ? store.assets[assetId] : null;
      if (!asset) return;
      const pos = getLayerPos(lt, asset, offsets);
      const base = getAssetBaseSize(asset);
      const w = Math.min(asset.width, base.w), h = Math.min(asset.height, base.h);
      const colors = { frame: '#888', character: '#e63946', points: '#457b9d', icon: '#2a9d8f' };
      ctx.strokeStyle = lt === posDragLayer ? '#ff6600' : (colors[lt] || '#888');
      ctx.lineWidth = lt === posDragLayer ? 3 : 1.5;
      ctx.setLineDash(lt === posDragLayer ? [] : [4, 3]);
      ctx.strokeRect(pos.x * scale + 0.5, pos.y * scale + 0.5, w * scale - 1, h * scale - 1);
      ctx.setLineDash([]);
      ctx.font = '10px Outfit, sans-serif';
      ctx.fillStyle = colors[lt] || '#888';
      ctx.fillText(lt, pos.x * scale + 2, pos.y * scale - 2);
    });
  }
}

function getAssetBaseSize(asset) {
  // Returns the base size for this asset type (before decomposition)
  const spec = ASSET_TYPES[asset.type];
  return spec ? { w: spec.w, h: spec.h } : { w: asset.width, h: asset.height };
}

function drawAssetLayer(ctx, asset, gx, gy, scale) {
  const base = getAssetBaseSize(asset);
  const scaleX = asset.width / base.w, scaleY = asset.height / base.h;
  const effects = asset.effects || {};
  const hasAnyFx = Object.values(effects).some(fx => fx && Object.values(fx).some(v => v === true));

  // Temporarily set partEffects for sub-pixel rendering
  const savedPartEffects = partEffects;
  if (hasAnyFx) partEffects = effects;

  // Track which parts exist in this asset for post-processing
  const assetParts = new Set();

  // Choose grid ref and dimensions for post-processing
  const ppGridW = (scaleX > 1 || scaleY > 1) ? base.w : asset.width;
  const ppGridH = (scaleX > 1 || scaleY > 1) ? base.h : asset.height;

  if (scaleX > 1 || scaleY > 1) {
    // Decomposed asset: render at base scale by averaging/sampling
    for (let br = 0; br < base.h; br++) {
      for (let bc = 0; bc < base.w; bc++) {
        const sr = Math.floor(br * scaleY), sc2 = Math.floor(bc * scaleX);
        const vals = {};
        for (let dr = 0; dr < scaleY && sr+dr < asset.height; dr++) {
          for (let dc = 0; dc < scaleX && sc2+dc < asset.width; dc++) {
            const v = asset.grid[sr+dr][sc2+dc];
            if (v !== 0) vals[v] = (vals[v] || 0) + 1;
          }
        }
        const best = Object.entries(vals).sort((a,b) => b[1] - a[1])[0];
        if (!best) continue;
        const val = parseInt(best[0]);
        assetParts.add(val);
        const baseColor = asset.customColors[val] || '#888';
        const fxForPart = effects[val];
        const partHasFx = fxForPart && Object.values(fxForPart).some(v => v === true);
        if (partHasFx && scale >= 2) {
          const subDiv = Math.min(Math.floor(scale), 4);
          const sw = scale / subDiv;
          const px = (gx + bc) * scale, py = (gy + br) * scale;
          for (let ssr = 0; ssr < subDiv; ssr++) for (let ssc = 0; ssc < subDiv; ssc++) {
            ctx.fillStyle = applyFxToColorSub(baseColor, val, br, bc, ssr, ssc, subDiv, base.w, base.h, asset.grid, 0, true);
            ctx.fillRect(px + ssc * sw, py + ssr * sw, Math.ceil(sw), Math.ceil(sw));
          }
        } else {
          ctx.fillStyle = partHasFx ? applyFxToColorSub(baseColor, val, br, bc, 0, 0, 1, base.w, base.h, asset.grid, 0, true) : baseColor;
          ctx.fillRect((gx + bc) * scale, (gy + br) * scale, scale, scale);
        }
      }
    }
  } else {
    for (let r = 0; r < asset.height; r++) {
      for (let c = 0; c < asset.width; c++) {
        const val = asset.grid[r][c];
        if (val === 0) continue;
        assetParts.add(val);
        const baseColor = asset.customColors[val] || '#888';
        const fxForPart = effects[val];
        const partHasFx = fxForPart && Object.values(fxForPart).some(v => v === true);
        if (partHasFx && scale >= 2) {
          const subDiv = Math.min(Math.floor(scale), 4);
          const sw = scale / subDiv;
          const px = (gx + c) * scale, py = (gy + r) * scale;
          for (let ssr = 0; ssr < subDiv; ssr++) for (let ssc = 0; ssc < subDiv; ssc++) {
            ctx.fillStyle = applyFxToColorSub(baseColor, val, r, c, ssr, ssc, subDiv, asset.width, asset.height, asset.grid, 0, true);
            ctx.fillRect(px + ssc * sw, py + ssr * sw, Math.ceil(sw), Math.ceil(sw));
          }
        } else {
          ctx.fillStyle = partHasFx ? applyFxToColorSub(baseColor, val, r, c, 0, 0, 1, asset.width, asset.height, asset.grid, 0, true) : baseColor;
          ctx.fillRect((gx + c) * scale, (gy + r) * scale, scale, scale);
        }
      }
    }
  }

  // Canvas-native post-processing for this layer (Gradient + Emboss)
  // Build a base-resolution grid for the overlay functions (downsampled if decomposed)
  if (hasAnyFx) {
    const ppGrid = [];
    if (scaleX > 1 || scaleY > 1) {
      for (let br = 0; br < base.h; br++) {
        ppGrid[br] = new Int8Array(base.w);
        for (let bc = 0; bc < base.w; bc++) {
          const sr2 = Math.floor(br * scaleY), sc3 = Math.floor(bc * scaleX);
          const vs = {};
          for (let dr = 0; dr < scaleY && sr2+dr < asset.height; dr++)
            for (let dc = 0; dc < scaleX && sc3+dc < asset.width; dc++) {
              const vv = asset.grid[sr2+dr][sc3+dc]; if (vv !== 0) vs[vv] = (vs[vv]||0)+1;
            }
          const b = Object.entries(vs).sort((a,b2)=>b2[1]-a[1])[0];
          ppGrid[br][bc] = b ? parseInt(b[0]) : 0;
        }
      }
    } else {
      for (let rr = 0; rr < asset.height; rr++) ppGrid[rr] = asset.grid[rr];
    }
    assetParts.forEach(pv => {
      applyAllCanvasEffects(ctx, pv, ppGrid, ppGridW, ppGridH, scale, scale, gx * scale, gy * scale, 0);
    });
  }

  partEffects = savedPartEffects;
}

function renderAssetToCanvas(canvas, asset) {
  const ctx = canvas.getContext('2d');
  const sx = canvas.width / asset.width, sy = canvas.height / asset.height;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let r = 0; r < asset.height; r++) {
    for (let c = 0; c < asset.width; c++) {
      const val = asset.grid[r][c];
      if (val === 0) continue;
      ctx.fillStyle = asset.customColors[val] || '#888';
      ctx.fillRect(c * sx, r * sy, sx, sy);
    }
  }
}
