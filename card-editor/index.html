// SECTION 8: Pixel Editor
// ═══════════════════════════════════════════════════════════════
let GRID_W = 32, GRID_H = 48;
let grid = [];
let selectedColor = 1;
let isPainting = false, paintVal = null;
let undoStack = [], redoStack = [];
let customColors = {};
let partVisible = {};
let PART_TYPES = [];
let nextTypeValue = 9;
let deleteMode = false, palLpTimer = null;
// Animation state
let animations = {};         // { "1": { type, enabled, params }, ... }
let animFrameId = null;
let animStartTime = 0;
let animatingParts = [];     // part values being animated
let selectedAnimPart = null; // currently selected part in anim drawer

let baseResW = 0, baseResH = 0; // resolution before decompose (for guide lines)
function pushUndo() { undoStack.push({ grid: grid.map(r => Int8Array.from(r)), w: GRID_W, h: GRID_H, brw: baseResW, brh: baseResH }); if (undoStack.length > 50) undoStack.shift(); redoStack = []; }
function undo() {
  if (!undoStack.length) return;
  redoStack.push({ grid: grid.map(r => Int8Array.from(r)), w: GRID_W, h: GRID_H, brw: baseResW, brh: baseResH });
  const s = undoStack.pop(); grid = s.grid; GRID_W = s.w; GRID_H = s.h; baseResW = s.brw; baseResH = s.brh;
  updateDecomposeBtn(); render();
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push({ grid: grid.map(r => Int8Array.from(r)), w: GRID_W, h: GRID_H, brw: baseResW, brh: baseResH });
  const s = redoStack.pop(); grid = s.grid; GRID_W = s.w; GRID_H = s.h; baseResW = s.brw; baseResH = s.brh;
  updateDecomposeBtn(); render();
}

function decomposeGrid() {
  if (GRID_W * 2 > 128 || GRID_H * 2 > 128) { toast(T('toast-decompose-max')); return; }
  pushUndo();
  // Remember the original pixel boundaries
  if (!baseResW) { baseResW = GRID_W; baseResH = GRID_H; }
  const newW = GRID_W * 2, newH = GRID_H * 2;
  const newGrid = Array.from({ length: newH }, () => new Int8Array(newW));
  for (let r = 0; r < GRID_H; r++) {
    for (let c = 0; c < GRID_W; c++) {
      const val = grid[r][c];
      newGrid[r*2][c*2] = val; newGrid[r*2][c*2+1] = val;
      newGrid[r*2+1][c*2] = val; newGrid[r*2+1][c*2+1] = val;
    }
  }
  grid = newGrid; GRID_W = newW; GRID_H = newH;
  updateDecomposeBtn();
  // Update subtitle to show new resolution
  const card = CARD_DATA[selectedCardCode];
  const cardName = lang === 'ja' ? card.name : card.nameEn;
  document.getElementById('editorSubtitle').textContent = `${cardName} \u2014 ${GRID_W}\u00D7${GRID_H}px`;
  render();
  toast(T('toast-decomposed'));
}

function updateDecomposeBtn() {
  const btn = document.getElementById('decomposeBtn');
  if (btn) btn.disabled = (GRID_W * 2 > 128 || GRID_H * 2 > 128);
}

function openEditor(cardCode, slotType) {
  const card = CARD_DATA[cardCode];
  const spec = ASSET_TYPES[slotType];
  const assign = getAssignments(cardCode);
  let assetId = assign[slotType];
  let asset = assetId ? store.assets[assetId] : null;

  editingSlotType = slotType;
  GRID_W = spec.w;
  GRID_H = spec.h;

  if (asset) {
    // Load existing (may be decomposed — use stored dimensions)
    editingAssetKey = assetId;
    GRID_W = asset.width || spec.w;
    GRID_H = asset.height || spec.h;
    // Detect decomposed state
    if (GRID_W > spec.w || GRID_H > spec.h) {
      baseResW = spec.w; baseResH = spec.h;
    }
    grid = asset.grid.map(r => Int8Array.from(r));
    customColors = { ...asset.customColors };
    PART_TYPES = (asset.partTypes || []).map(pt => makePartType(pt));
    nextTypeValue = Math.max(...PART_TYPES.map(p => p.value), 0) + 1;
  } else {
    // New asset
    editingAssetKey = null;
    grid = Array.from({ length: GRID_H }, () => new Int8Array(GRID_W));
    // Initialize part types from defaults with tier-adjusted colors
    const defaults = ASSET_PART_DEFAULTS[slotType] || ASSET_PART_DEFAULTS.character;
    const tierColors = TIER_COLORS[card.tier];
    const adjusted = defaults.map(d => {
      const pt = { ...d };
      // Adjust frame/back/icon/points colors to match tier
      if (slotType !== 'character' && tierColors) {
        if (d.label === 'Border' || d.label === 'Base' || d.label === 'Digit') pt.color = tierColors.back;
        if (d.label === 'Accent' || d.label === 'Main') pt.color = tierColors.accent;
        if (d.label === 'Stripe') pt.color = tierColors.back.replace(/[0-9a-f]{2}$/i, m => Math.min(255, parseInt(m, 16) + 20).toString(16));
      }
      return pt;
    });
    customColors = {};
    adjusted.forEach(pt => { customColors[pt.value] = pt.color; });
    PART_TYPES = adjusted.map(pt => makePartType(pt));
    nextTypeValue = Math.max(...adjusted.map(p => p.value), 0) + 1;
  }

  partVisible = {};
  PART_TYPES.forEach(pt => { partVisible[pt.value] = true; });
  selectedColor = 1;
  undoStack = [];
  redoStack = [];
  deleteMode = false;
  baseResW = 0; baseResH = 0;

  // Load animations
  stopAnims();
  animations = asset ? JSON.parse(JSON.stringify(asset.animations || {})) : {};
  partEffects = asset ? JSON.parse(JSON.stringify(asset.effects || {})) : {};
  selectedAnimPart = null;
  selectedFxPart = null;

  // Update title
  const cardName = lang === 'ja' ? card.name : card.nameEn;
  document.getElementById('editorTitle').textContent = T(spec.i18nKey);
  document.getElementById('editorSubtitle').textContent = `${cardName} \u2014 ${spec.w}\u00D7${spec.h}px`;

  showView('viewEditor');
  // Show sidebar only for character editing (preview + effects)
  const sidebar = document.getElementById('editorSidebar');
  if (sidebar) sidebar.style.display = slotType === 'character' ? '' : 'none';

  // Show hi-res preview for programmatic assets
  const hiResWrap = document.getElementById('hiResPreviewWrap');
  const gridWrapper = gridCanvas.parentElement;
  const isProgrammatic = ['frame', 'back', 'icon', 'points'].includes(slotType);
  if (isProgrammatic) {
    hiResWrap.style.display = '';
    gridWrapper.style.display = 'none';
    renderHiResEditorPreview(cardCode, slotType);
  } else {
    hiResWrap.style.display = 'none';
    gridWrapper.style.display = '';
  }

  buildPalette();
  buildPartVisibility();
  buildAnimPartChips();
  buildFxPresets();
  buildFxPartChips();
  updateDecomposeBtn();
  render();
  // Start FX animation if animated effects are loaded
  if (hasAnimatedFx()) startFxAnimLoop();
}

function saveAsset() {
  const card = CARD_DATA[selectedCardCode];
  const spec = ASSET_TYPES[editingSlotType];

  if (!editingAssetKey) {
    // Create new asset
    editingAssetKey = crypto.randomUUID();
  }

  store.assets[editingAssetKey] = {
    id: editingAssetKey,
    type: editingSlotType,
    label: (lang === 'ja' ? card.name : card.nameEn) + ' ' + T(spec.i18nKey),
    width: GRID_W,
    height: GRID_H,
    grid: grid.map(r => Int8Array.from(r)),
    partTypes: PART_TYPES.map(pt => ({ value: pt.value, label: pt.label, labelJa: pt.labelJa, color: customColors[pt.value], custom: pt.custom || false })),
    customColors: { ...customColors },
    animations: JSON.parse(JSON.stringify(animations)),
    effects: JSON.parse(JSON.stringify(partEffects)),
    meta: getMetaForSlot(editingSlotType, card),
    createdAt: store.assets[editingAssetKey]?.createdAt || Date.now(),
    updatedAt: Date.now(),
  };

  // Assign to card
  const assign = getAssignments(selectedCardCode);
  assign[editingSlotType] = editingAssetKey;
  store.cardAssignments[selectedCardCode] = assign;

  saveStore();
  toast(T('toast-saved'));

  // Go back
  if (editingFromShared) {
    editingFromShared = false;
    showView('viewCardSelect');
    buildCardGrid();
  } else {
    showView('viewDashboard');
    initDashboard(selectedCardCode);
  }
}

// ── Part types ──
function makePartType(pt) {
  const val = pt.value;
  return {
    value: val, label: pt.label, labelJa: pt.labelJa, custom: pt.custom || false,
    get color() { return customColors[val]; },
    get textColor() { return getContrastText(customColors[val]); },
  };
}
function getContrastText(hex) {
  if (!hex || hex.length < 7) return '#333';
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return (0.299*r + 0.587*g + 0.114*b)/255 > 0.6 ? '#333' : '#fff';
}


// ── Palette UI ──
function buildPalette() {
  const el = document.getElementById('palette'); el.innerHTML = '';
  PART_TYPES.forEach(pt => {
    const btn = document.createElement('button');
    btn.className = 'palette-btn' + (selectedColor === pt.value ? ' active' : '');
    btn.style.background = pt.color;
    const lbl = document.createElement('span');
    lbl.className = 'palette-label'; lbl.style.color = pt.textColor;
    lbl.textContent = lang === 'ja' ? pt.labelJa : pt.label;
    btn.appendChild(lbl);
    if (pt.value !== 0) {
      const dot = document.createElement('span'); dot.className = 'color-edit'; dot.textContent = '\u270E';
      dot.onclick = (e) => { e.stopPropagation(); selectedColor = pt.value; openColorPicker(pt.value); buildPalette(); };
      btn.appendChild(dot);
    }
    if (pt.custom && deleteMode) {
      const del = document.createElement('span'); del.className = 'color-delete'; del.textContent = '\u00D7';
      del.onclick = (e) => { e.stopPropagation(); removePartType(pt.value); };
      btn.appendChild(del);
    }
    if (pt.custom) {
      btn.addEventListener('mousedown', () => { palLpTimer = setTimeout(() => { deleteMode = true; buildPalette(); }, 500); });
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); palLpTimer = setTimeout(() => { deleteMode = true; buildPalette(); }, 500); }, { passive: false });
      const cancel = () => { if (palLpTimer) { clearTimeout(palLpTimer); palLpTimer = null; } };
      btn.addEventListener('mouseup', cancel); btn.addEventListener('touchend', cancel);
      btn.addEventListener('mouseleave', cancel); btn.addEventListener('touchcancel', cancel);
    }
    btn.onclick = () => { if (deleteMode) { deleteMode = false; buildPalette(); return; } selectedColor = pt.value; buildPalette(); };
    el.appendChild(btn);
  });
  const addBtn = document.createElement('button'); addBtn.className = 'palette-add'; addBtn.textContent = '+';
  addBtn.onclick = () => openAddType(); el.appendChild(addBtn);
}

function buildPartVisibility() {
  const el = document.getElementById('partVisibility'); el.innerHTML = '';
  const row = document.createElement('div'); row.className = 'part-vis-row';
  PART_TYPES.forEach(pt => {
    if (pt.value === 0) return;
    const chip = document.createElement('span');
    chip.className = 'vis-chip' + (partVisible[pt.value] ? '' : ' hidden');
    chip.innerHTML = `<span class="vis-swatch" style="background:${pt.color}"></span>${lang === 'ja' ? pt.labelJa : pt.label}`;
    chip.onclick = () => { partVisible[pt.value] = !partVisible[pt.value]; buildPartVisibility(); render(); };
    row.appendChild(chip);
  });
  el.appendChild(row);
}

// ── Add/Remove types ──
function openAddType() {
  if (PART_TYPES.length >= 12) { toast(T('toast-type-max')); return; }
  document.getElementById('addTypeLabel').textContent = T('add-type');
  document.getElementById('addTypeConfirm').textContent = T('add-btn');
  document.getElementById('addTypeInput').value = '';
  document.getElementById('addTypeOverlay').classList.add('open');
  setTimeout(() => document.getElementById('addTypeInput').focus(), 200);
}
function closeAddType() { document.getElementById('addTypeOverlay').classList.remove('open'); }
function confirmAddType() {
  const name = document.getElementById('addTypeInput').value.trim(); if (!name) return;
  const val = nextTypeValue++;
  customColors[val] = '#888888'; partVisible[val] = true;
  PART_TYPES.push(makePartType({ value: val, label: name, labelJa: name, color: '#888888', custom: true }));
  closeAddType(); selectedColor = val; buildPalette(); buildPartVisibility();
  openColorPicker(val); toast(T('toast-type-added'));
}

function removePartType(val) {

  for (let r = 0; r < GRID_H; r++) for (let c = 0; c < GRID_W; c++) if (grid[r][c] === val) grid[r][c] = 0;

// ── Color Picker ──
let colorPickerTarget = null;
function generate256Palette() {
  const colors = [];
  for (let i = 0; i < 16; i++) { const v = Math.round(255 - i*(255/15)); colors.push('#'+v.toString(16).padStart(2,'0').repeat(3)); }
  const lS=[90,82,74,66,58,50,45,40,35,30,25,20,16,12,8], sS=[60,70,80,85,90,95,95,90,85,80,75,70,65,60,55];
  for (let row=0;row<15;row++) for (let col=0;col<16;col++) colors.push(hslToHex(col*(360/16),sS[row],lS[row]));
  return colors;
}
function hslToHex(h,s,l) { s/=100;l/=100; const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l), f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))); const x=n=>Math.round(f(n)*255).toString(16).padStart(2,'0'); return '#'+x(0)+x(8)+x(4); }
function buildColorGrid() {
  const el = document.getElementById('colorGrid'); el.innerHTML = '';
  generate256Palette().forEach(hex => {
    const sw = document.createElement('button'); sw.className = 'color-swatch';
    if (colorPickerTarget !== null && customColors[colorPickerTarget] === hex) sw.classList.add('active');
    sw.style.background = hex; sw.onclick = () => { customColors[colorPickerTarget] = hex; buildPalette(); buildPartVisibility(); buildColorGrid(); render(); };
    el.appendChild(sw);
  });
}
function openColorPicker(val) {
  colorPickerTarget = val;
  const pt = PART_TYPES.find(p => p.value === val); const name = pt ? (lang==='ja'?pt.labelJa:pt.label) : '';
  document.getElementById('colorPickerLabel').textContent = lang==='ja' ? name+T('pick-color') : T('pick-color')+' '+name;
  buildColorGrid(); document.getElementById('colorPickerOverlay').classList.add('open');
}
function closeColorPicker() { document.getElementById('colorPickerOverlay').classList.remove('open'); colorPickerTarget = null; }

// ── Hi-res editor preview for programmatic assets ──
function renderHiResEditorPreview(cardCode, slotType) {
  const card = CARD_DATA[cardCode];
  const cvs = document.getElementById('hiResPreviewCanvas');
  const ctx = cvs.getContext('2d');
  const frameStyle = (store.settings && store.settings.frameStyle) || 'classic';
  const dpr = window.devicePixelRatio || 2;

  let drawW, drawH;
  if (slotType === 'frame' || slotType === 'back') {
    drawW = 192; drawH = 288; // 32×48 * 6
  } else if (slotType === 'icon') {
    drawW = 192; drawH = 192; // 8×8 * 24
  } else if (slotType === 'points') {
    drawW = 216; drawH = 144; // 12×8 * 18
  }

  cvs.width = drawW * dpr; cvs.height = drawH * dpr;
  cvs.style.width = drawW + 'px'; cvs.style.height = drawH + 'px';
  ctx.clearRect(0, 0, cvs.width, cvs.height);

  // Clear hi-res cache to force re-render at this size
  clearHiResCache(slotType === 'frame' ? 'frame' : slotType === 'back' ? 'back' : slotType === 'icon' ? 'icon' : 'points');

  if (slotType === 'frame') {
    drawHiResFrame(ctx, frameStyle, card.tier, 0, 0, drawW * dpr, drawH * dpr);
  } else if (slotType === 'back') {
    drawHiResBack(ctx, frameStyle, card.tier, 0, 0, drawW * dpr, drawH * dpr);
  } else if (slotType === 'icon') {
    drawHiResIcon(ctx, card.category, card.tier, 0, 0, drawW * dpr);
  } else if (slotType === 'points') {
    drawHiResPoints(ctx, card.points, card.tier, 0, 0, drawW * dpr, drawH * dpr);
  }
}

const gridCanvas = document.getElementById('gridCanvas');
const gridCtx = gridCanvas.getContext('2d');

function renderGrid() {
  const isMobile = window.innerWidth <= 700;
  const sidebar = document.getElementById('editorSidebar');
  const hasSidebar = sidebar && sidebar.style.display !== 'none' && !isMobile;
  const availW = hasSidebar ? Math.max(250, window.innerWidth - 400) : window.innerWidth - (isMobile ? 40 : 80);
  const maxW = Math.min(availW, GRID_W <= 12 ? 280 : isMobile ? Math.min(window.innerWidth - 40, 360) : hasSidebar ? 360 : 420);
  const cellPx = Math.max(2, Math.floor(maxW / Math.max(GRID_W, GRID_H * 0.67)));
  const totalW = cellPx * GRID_W, totalH = cellPx * GRID_H;
  gridCanvas.width = totalW; gridCanvas.height = totalH;
  gridCanvas.style.width = totalW+'px'; gridCanvas.style.height = totalH+'px';

  gridCtx.fillStyle = '#F5F5F5'; gridCtx.fillRect(0, 0, totalW, totalH);
  const hasAnyFxGrid = Object.values(partEffects).some(fx => fx && Object.values(fx).some(v => v === true));
  for (let r = 0; r < GRID_H; r++) for (let c = 0; c < GRID_W; c++) {
    const val = grid[r][c]; if (val === 0) continue;
    gridCtx.globalAlpha = partVisible[val] ? 1 : 0.15;
    const baseColor = customColors[val] || '#F5F5F5';
    const fx = partEffects[val];
    const partHasFx = fx && Object.values(fx).some(v => v === true);
    if (partHasFx && cellPx >= 4) {
      const subDiv = Math.min(Math.floor(cellPx / 2), 4);
      const sw = cellPx / subDiv;
      const x = c * cellPx, y = r * cellPx;
      for (let sr = 0; sr < subDiv; sr++) for (let sc = 0; sc < subDiv; sc++) {
        gridCtx.fillStyle = applyFxToColorSub(baseColor, val, r, c, sr, sc, subDiv, GRID_W, GRID_H, grid, fxAnimTime, true);
        gridCtx.fillRect(x + sc * sw, y + sr * sw, Math.ceil(sw), Math.ceil(sw));
      }
    } else {
      gridCtx.fillStyle = (hasAnyFxGrid && partHasFx) ? applyFxToColorSub(baseColor, val, r, c, 0, 0, 1, GRID_W, GRID_H, grid, fxAnimTime, true) : baseColor;
      gridCtx.fillRect(c*cellPx, r*cellPx, cellPx, cellPx);
    }
    gridCtx.globalAlpha = 1;
  }
  // Canvas-native post-processing: Gradient + Emboss overlays
  PART_TYPES.forEach(pt => {
    if (pt.value === 0) return;
    applyAllCanvasEffects(gridCtx, pt.value, grid, GRID_W, GRID_H, cellPx, cellPx, 0, 0, fxAnimTime);
  });
  // Skip guide lines during animation/effect playback to avoid artifacts
  const isAnimating = animFrameId || (typeof fxAnimId !== 'undefined' && fxAnimId);
  if (!isAnimating) {
    gridCtx.strokeStyle = 'rgba(0,0,0,0.08)'; gridCtx.lineWidth = 0.5;
    for (let i = 0; i <= GRID_W; i++) { gridCtx.beginPath(); gridCtx.moveTo(i*cellPx,0); gridCtx.lineTo(i*cellPx,totalH); gridCtx.stroke(); }
    for (let i = 0; i <= GRID_H; i++) { gridCtx.beginPath(); gridCtx.moveTo(0,i*cellPx); gridCtx.lineTo(totalW,i*cellPx); gridCtx.stroke(); }
    if (GRID_W >= 16) {
      // Show base pixel boundaries when decomposed
      const guideW = baseResW || 8, guideH = baseResH || 8;
      const stepX = GRID_W / guideW, stepY = GRID_H / guideH;
      if (stepX >= 2) {
        gridCtx.strokeStyle = 'rgba(139,105,20,0.25)'; gridCtx.lineWidth = 1;
        for (let i = 0; i <= GRID_W; i += stepX) { gridCtx.beginPath(); gridCtx.moveTo(i*cellPx,0); gridCtx.lineTo(i*cellPx,totalH); gridCtx.stroke(); }
        for (let i = 0; i <= GRID_H; i += stepY) { gridCtx.beginPath(); gridCtx.moveTo(0,i*cellPx); gridCtx.lineTo(totalW,i*cellPx); gridCtx.stroke(); }
      } else {
        gridCtx.strokeStyle = 'rgba(0,0,0,0.18)'; gridCtx.lineWidth = 1;
        for (let i = 0; i <= GRID_W; i += 8) { gridCtx.beginPath(); gridCtx.moveTo(i*cellPx,0); gridCtx.lineTo(i*cellPx,totalH); gridCtx.stroke(); }
        for (let i = 0; i <= GRID_H; i += 8) { gridCtx.beginPath(); gridCtx.moveTo(0,i*cellPx); gridCtx.lineTo(totalW,i*cellPx); gridCtx.stroke(); }
      }
    }
  }
}

// State: { "1": { gradient: true, emboss: false, emboss_str: 50, ... }, ... }
let partEffects = {};
let selectedFxPart = null;

function getPartFx(partVal) {
  if (!partEffects[partVal]) partEffects[partVal] = {};
  return partEffects[partVal];
}

function buildFxPresets() {
  const container = document.getElementById('fxPresets');
  if (!container) return;
  container.innerHTML = '';
  Object.keys(FX_PRESETS).forEach(key => {
    const btn = document.createElement('button');
    btn.textContent = T('fx-preset-' + key);
    btn.style.cssText = 'cursor:pointer;padding:4px 12px;border-radius:14px;border:1px solid var(--card-border);background:var(--card-bg);font-size:12px;font-weight:500;transition:all 0.15s;';
    btn.onmouseenter = () => { btn.style.background = 'var(--accent)'; btn.style.color = '#fff'; btn.style.borderColor = 'var(--accent)'; };
    btn.onmouseleave = () => { btn.style.background = 'var(--card-bg)'; btn.style.color = ''; btn.style.borderColor = 'var(--card-border)'; };
    btn.onclick = () => applyFxPreset(key);
    container.appendChild(btn);
  });
}

function applyFxPreset(presetKey) {
  const preset = FX_PRESETS[presetKey];
  if (!preset) return;
  const template = preset._all;
  // Find all unique non-zero part values in the grid
  const usedParts = new Set();
  for (let r = 0; r < GRID_H; r++) for (let c = 0; c < GRID_W; c++) { if (grid[r][c] !== 0) usedParts.add(grid[r][c]); }
  usedParts.forEach(partVal => { partEffects[partVal] = JSON.parse(JSON.stringify(template)); });
  buildFxPresets();
  buildFxPartChips();
  buildFxControls();
  render();
  if (hasAnimatedFx()) startFxAnimLoop();
  else stopFxAnimLoop();
}

function applyFxToAllParts() {
  if (selectedFxPart === null) return;
  const srcFx = getPartFx(selectedFxPart);
  const usedParts = new Set();
  for (let r = 0; r < GRID_H; r++) for (let c = 0; c < GRID_W; c++) { if (grid[r][c] !== 0) usedParts.add(grid[r][c]); }
  usedParts.forEach(partVal => { if (partVal !== selectedFxPart) partEffects[partVal] = JSON.parse(JSON.stringify(srcFx)); });
  buildFxPartChips();
  buildFxControls();
  render();
  if (hasAnimatedFx()) startFxAnimLoop();
  else stopFxAnimLoop();
}

function buildFxPartChips() {
  const container = document.getElementById('fxPartChips');
  if (!container) return;
  container.innerHTML = '';
  PART_TYPES.forEach(pt => {
    if (pt.value === 0) return; // skip Empty
    const chip = document.createElement('div');
    chip.className = 'anim-chip' + (selectedFxPart === pt.value ? ' active' : '');
    const dot = document.createElement('span');
    dot.className = 'chip-dot';
    dot.style.background = customColors[pt.value] || '#888';
    chip.appendChild(dot);
    const label = document.createElement('span');
    label.textContent = lang === 'ja' ? (pt.labelJa || pt.label) : pt.label;
    chip.appendChild(label);
    // Star indicator if any effect is on
    const fx = getPartFx(pt.value);
    const hasAny = FX_DEFS.some(d => fx[d.id]);
    if (hasAny) {
      const star = document.createElement('span');
      star.className = 'chip-star';
      star.textContent = '★';
      chip.appendChild(star);
    }
    chip.onclick = () => { selectedFxPart = pt.value; buildFxPartChips(); buildFxControls(); };
    container.appendChild(chip);

  // "Apply to All" button
  if (selectedFxPart !== null) {
    const allBtn = document.createElement('div');
    allBtn.className = 'anim-chip';
    allBtn.style.cssText = 'cursor:pointer;background:#e8e8ff;border:1px dashed #99a;font-size:11px;';

    container.appendChild(allBtn);
  }
}

const FX_CATEGORIES = ['basic', 'texture', 'element', 'decoration'];

function buildFxControls() {
  const container = document.getElementById('fxControls');
  if (!container) return;
  if (selectedFxPart === null) { container.style.display = 'none'; return; }
  container.style.display = '';
  container.innerHTML = '';
  const fx = getPartFx(selectedFxPart);
  FX_CATEGORIES.forEach(cat => {
    const defsInCat = FX_DEFS.filter(d => d.category === cat);
    if (defsInCat.length === 0) return;
    const header = document.createElement('div');
    header.style.cssText = 'font-size:11px;color:#999;margin-top:8px;margin-bottom:2px;text-transform:uppercase;letter-spacing:0.5px;';

    container.appendChild(header);
