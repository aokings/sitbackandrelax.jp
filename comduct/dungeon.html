<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>comduct · dungeon（簡易トルネコ）</title>
    <style>
      /* ============================================================
         潜行 UI 文法（docs/DESIGN-companions.md）
         ・ゲーム画面を全画面／潜行中に見たい情報は半透明オーバレイ
         ・設定切り替え系は ☰ に格納＝普段は引っ込めて最大化
         ・白テーマ・文字大きめ・タッチ余白確保
         ============================================================ */
      :root {
        --bg: #eef2f8;
        --panel: #ffffff;
        --line: #dce3ec;
        --text: #1b2532;
        --muted: #5b6472;
        --accent: #2e74f0;
        --tint: #e7f0ff;
        --hp: #31b36b;
        --mp: #3b82f6;
        --danger: #e5484d;
        --track: #e5eaf1;
      }
      html,
      body {
        touch-action: manipulation;
        overscroll-behavior: none;
        background: var(--bg);
        color: var(--text);
      }
      #topbar { display: none; } /* 全画面化のため通常のヘッダは畳む */

      /* 全画面ステージ */
      #app { position: fixed; inset: 0; padding: 0; margin: 0; display: block; }
      #left {
        position: absolute;
        inset: 0;
        display: block;
        background: linear-gradient(180deg, #e9eff7 0%, #d5e0ec 100%);
        overflow: hidden;
      }
      /* ゲーム画面（2D 追従窓）＝中央・アスペクト維持で最大化。3D 時は隠され voxel が重なる */
      #board {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(100vw, calc((100vh - 12px) * 748 / 440));
        height: auto;
        background: #0f1115;
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 8px 30px rgba(27, 37, 50, 0.14);
      }
      /* トルネコ式オーバレイ地図（主人公中央・半透明・床だけ・透ける）＝2層視界 */
      #minimap {
        position: absolute; left: 0; top: 0; z-index: 5; display: none;
        pointer-events: none;
      }

      /* オーバレイ共通パネル（ダークガラス：暗いダンジョンの上で透けて見える＋明るい文字で読める） */
      .ov {
        position: absolute;
        z-index: 8;
        background: rgba(14, 19, 28, 0.42);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 14px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.38);
        backdrop-filter: blur(18px) saturate(1.2);
        -webkit-backdrop-filter: blur(18px) saturate(1.2);
      }

      /* 左上：文脈チップ＋実況フィード */
      #ctxbar {
        left: 14px; top: 14px; max-width: min(52vw, 460px);
        padding: 11px 16px; font-size: 16px; font-weight: 800; color: #f2f5fa;
      }
      #status { color: #f2f5fa; }
      #log {
        left: 14px; top: 66px; width: min(52vw, 420px); max-height: 42vh; overflow-y: auto;
        padding: 11px 14px; display: flex; flex-direction: column; gap: 5px;
        font-size: 14.5px; color: #c4ccd8; line-height: 1.55; font-weight: 600;
      }
      #log div { color: #c4ccd8; }
      #log div:first-child { color: #ffffff; font-weight: 800; } /* 直近イベントを強調 */

      /* 右上：頻用トグル 🗺🧊 ＋ ☰ メニュー */
      #topright { position: absolute; right: 14px; top: 14px; z-index: 12; display: flex; gap: 8px; align-items: center; background: none; box-shadow: none; border: none; }
      #topright button {
        width: 48px; height: 44px; padding: 0; font-size: 18px; border-radius: 12px;
        background: rgba(14, 19, 28, 0.42); color: #e6eaf1; border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.32); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      }
      #topright button.on { background: var(--accent); color: #fff; border-color: var(--accent); }

      /* ☰ メニュー（設定系をまとめて格納・普段は非表示） */
      #menupanel {
        right: 14px; top: 66px; width: min(90vw, 340px); max-height: 78vh; overflow-y: auto; z-index: 13;
        padding: 12px; display: flex; flex-direction: column; gap: 8px;
        background: rgba(255, 255, 255, 0.97); border: 1px solid var(--line); color: var(--text);
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.32); backdrop-filter: none; -webkit-backdrop-filter: none;
      }
      #menupanel[hidden] { display: none; }
      #menupanel .mgroup { display: flex; flex-wrap: wrap; gap: 6px; }
      #menupanel button { font-size: 13px; padding: 8px 12px; }
      .depthjump { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; }
      .depthjump input { width: 46px; background: #fff; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 6px; font-size: 13px; }

      /* ボタン（明るく・大きめ） */
      button {
        background: #fff; color: var(--text); border: 1px solid var(--line);
        border-radius: 10px; padding: 9px 14px; font-size: 14px; cursor: pointer;
      }
      button:hover { border-color: #c4d0de; background: #f5f8fc; }

      /* 下：パーティ HUD ── 容器は透明・各員のカードだけガラス風に浮かせる */
      #party {
        left: 14px; right: 14px; bottom: 14px; z-index: 9;
        display: flex; gap: 12px; align-items: stretch;
        background: none; border: none; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none;
        padding: 0; overflow-x: auto;
      }
      #party .pc {
        flex: 1 1 0; min-width: 168px;
        display: flex; flex-direction: column; gap: 7px;
        background: rgba(14, 19, 28, 0.44); border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 14px;
        padding: 11px 13px;
        box-shadow: 0 8px 26px rgba(0, 0, 0, 0.38);
        backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2);
      }
      #party .pc.down { opacity: 0.5; }
      #party .pc.danger { border: 2px solid var(--danger); box-shadow: 0 8px 26px rgba(229, 72, 77, 0.4); }
      #party .pc-top { display: flex; align-items: center; gap: 9px; }
      #party .g {
        display: inline-flex; align-items: center; justify-content: center;
        width: 30px; height: 30px; border-radius: 50%; color: #fff; font-weight: 800; font-size: 15px;
        border: 2px solid rgba(255,255,255,0.85); box-shadow: 0 0 0 1px rgba(0,0,0,0.2);
      }
      #party .pc-nm { font-weight: 800; font-size: 16px; color: #ffffff; }
      #party .pc-lv { font-size: 12px; font-weight: 700; color: #9aa4b2; }
      #party .pc-ord { margin-left: auto; }
      #party .pc-badge { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 8px; background: rgba(46, 116, 240, 0.28); color: #a9c8ff; }
      #party .pc-badge.wait { background: rgba(255,255,255,0.12); color: #b8c0cc; }
      #party .pc-badge.goto { background: rgba(46, 116, 240, 0.28); color: #a9c8ff; }
      #party .pc-badge.req { background: rgba(214, 51, 132, 0.28); color: #ffb0d4; }
      #party .pc-badge.dead { background: rgba(255,255,255,0.1); color: #9aa4b2; }
      #party .bar { height: 9px; border-radius: 5px; background: rgba(255,255,255,0.16); overflow: hidden; }
      #party .bar.mp { height: 6px; }
      #party .bar i { display: block; height: 100%; border-radius: 5px; }
      #party .bar.hp i { background: #3ad07f; }
      #party .bar.mp i { background: #4f92ff; }
      #party .pc-nums { font-size: 13px; font-weight: 700; color: #b9c1cd; display: flex; gap: 11px; flex-wrap: wrap; }
      #party .pc-nums b { color: #ffffff; font-weight: 800; }
      #party .pc-caps { display: flex; gap: 5px; flex-wrap: wrap; }
      #party .cap { font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 6px; letter-spacing: 0.02em; }
      #party .cap.heal { background: rgba(49,179,107,0.22); color: #7ee7ab; }
      #party .cap.shoot { background: rgba(79,146,255,0.22); color: #a9c8ff; }
      #party .cap.cast { background: rgba(123,91,214,0.3); color: #cbb8ff; }
      #party .pc-badge.heal { background: rgba(49,179,107,0.26); color: #7ee7ab; }
      #party .pc-badge.guard { background: rgba(230,160,28,0.28); color: #f4c667; }
      #party .pc-badge.allout { background: rgba(229,72,77,0.26); color: #ff9ea1; }

      /* 作戦パネル（全員に命じる）＝リアクティブ連携 */
      #sakusen { right: 14px; bottom: 14px; width: 300px; z-index: 9; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
      #sakusen .sklabel { font-size: 12px; font-weight: 700; color: #aab3c0; }
      #sakusen .skrow { display: flex; gap: 7px; }
      #sakusen .skbtn {
        flex: 1 1 0; padding: 9px 6px; border-radius: 10px; font-size: 13px; font-weight: 800; text-align: center; line-height: 1.2;
        background: rgba(255,255,255,0.1); color: #e6eaf1; border: 1px solid rgba(255,255,255,0.18);
      }
      #sakusen .skbtn:hover { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.28); }
      #sakusen .skbtn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
      body.mode-pc #party { right: 322px; } /* 作戦パネルの分だけ右を空ける */
      body.mode-mobile #sakusen { left: 14px; right: 14px; width: auto; bottom: 312px; padding: 8px 10px; }
      body.mode-mobile #sakusen .sklabel { display: none; }
      body.mode-mobile #sakusen .skbtn { padding: 8px 4px; font-size: 12px; }

      /* 装備・持ち物・呪文（☰ 内） */
      #bag {
        background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
        padding: 8px 10px; font-size: 12px; color: var(--muted);
        display: flex; flex-direction: column; gap: 4px;
      }
      #bag .baghd { color: var(--text); font-weight: 700; }
      #bag .bagrow { display: flex; align-items: center; gap: 8px; }
      #bag .bagn { flex: 1; }
      #bag .bagbtn { font-size: 11px; padding: 4px 10px; }
      #bag .eqd { font-size: 11px; color: var(--accent); opacity: 0.85; }
      #cmdform { display: flex; gap: 8px; }
      #cmdinput {
        flex: 1; background: #fff; border: 1px solid var(--line); border-radius: 8px;
        color: var(--text); padding: 9px 12px; font-size: 13px;
      }
      #cmdinput:focus { outline: none; border-color: var(--accent); }
      .hint {
        font-size: 12px; color: var(--muted); line-height: 1.65;
        background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px;
      }
      .hint b { color: var(--text); }

      /* 移動パッド（下・半透明・モバイルで表示） */
      #pad {
        display: none; position: absolute; z-index: 10;
        left: 50%; bottom: 128px; transform: translateX(-50%);
        grid-template-columns: repeat(3, 58px); grid-auto-rows: 58px; gap: 7px;
      }
      #pad .pb {
        font-size: 22px; padding: 0; border-radius: 14px; line-height: 1; color: #eef2f8;
        background: rgba(14, 19, 28, 0.44); border: 1px solid rgba(255,255,255,0.16);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.34); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      }
      #pad #pad-center { font-size: 14px; background: rgba(255,255,255,0.14); color: #cfd6e0; }
      #padopts { display: none; }

      /* 表示モード（PC ⇄ モバイル手動切替・起動時は自動判定） */
      body.mode-mobile #pad { display: grid; bottom: 14px; } /* パッドは最下部・親指位置 */
      body.mode-mobile #party { bottom: 214px; } /* パッドの上にパーティ HUD を退避（重なり防止） */
      body.mode-mobile #ctxbar { max-width: 60vw; font-size: 14px; }
      body.mode-mobile #log { width: 62vw; top: 56px; max-height: 24vh; }

      /* 装備オーバーレイ（街でもダンジョンでも同じ画面） */
      #equip { display: none; position: fixed; inset: 0; background: rgba(27, 37, 50, 0.42); z-index: 50; align-items: center; justify-content: center; }
      #equippanel { width: min(440px, 92vw); max-height: 86vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: 0 20px 60px rgba(27,37,50,0.3); }
      #equiphd { display: flex; align-items: center; justify-content: space-between; font-weight: 800; color: var(--text); margin-bottom: 12px; }
      #equiphd button { font-size: 12px; padding: 6px 12px; }
      .eqmembers { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
      .eqm { font-size: 12px; padding: 6px 10px; border-radius: 8px; background: #f5f8fc; border: 1px solid var(--line); color: var(--muted); }
      .eqm.on { border-color: var(--accent); color: var(--text); }
      .eqstats { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
      .eqslots { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
      .eqslot { font-size: 13px; color: var(--muted); } .eqslot b { color: var(--text); }
      .eqlist { display: flex; flex-direction: column; gap: 4px; }
    </style>
    <script type="module" crossorigin src="./assets/dungeon-ex-nVq1e.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/dungeon-CUDl0B5M.css">
  </head>
  <body>
    <header id="topbar">
      <span class="brand">comduct</span>
      <span class="sub">dungeon — 簡易トルネコ（ローグライク本体）</span>
    </header>
    <main id="app">
      <section id="left">
        <canvas id="board" width="748" height="440"></canvas>
        <canvas id="minimap" width="208" height="126"></canvas>

        <!-- 左上：文脈チップ＋実況フィード -->
        <div id="ctxbar" class="ov"><span id="status">…</span></div>
        <section id="log" class="ov"></section>

        <!-- 右上：頻用トグル＋☰ -->
        <div id="topright">
          <button id="mapmode" type="button" title="地図">🗺</button>
          <button id="voxmode" type="button" title="3D">🧊</button>
          <button id="menubtn" type="button" title="メニュー">☰</button>
        </div>

        <!-- ☰ メニュー（設定系を格納・普段は非表示） -->
        <div id="menupanel" class="ov" hidden>
          <div class="mgroup">
            <button id="descend" type="button">降りる（&gt;）</button>
            <button id="equipbtn" type="button">🛡 装備（i）</button>
            <button id="composemode" type="button">🧑 編成</button>
            <button id="aimmode" type="button">🏹 狙う: OFF</button>
          </div>
          <div class="mgroup">
            <button id="layoutmode" type="button">🖥 PC</button>
            <button id="turnmode" type="button">🧭 向きモード: OFF</button>
            <button id="reset" type="button">もう一度</button>
            <span class="depthjump">🪜<input id="startdepth" type="number" min="1" max="30" value="3" />階へ<button id="godepth" type="button">直行</button></span>
          </div>
          <section id="bag"></section>
          <form id="cmdform" autocomplete="off">
            <input id="cmdinput" placeholder="@リン 待て ／ @ガロ 来い ／ 集合" />
            <button type="submit">送る</button>
          </form>
          <div class="hint">
            <b>主人公</b>＝矢印/WASD/QEZC(斜め)/テンキーで <b>8方向移動</b>（敵に当たると攻撃）・Space＝待つ・&gt;＝階段。<b>Shift＋方向＝その場で向きだけ変える</b>。<br />
            <b>仲間に命じる</b>＝<b>仲間をクリック→行き先をクリック</b>。同じ仲間をもう一度クリックで<b>追従に戻す</b>。テキスト：<b>@リン 待て</b> ／ <b>@ガロ 来い</b> ／ <b>集合</b>。命令はターンを消費しません。<br />
            <span style="opacity: 0.7"><b>🧊3D</b>＝<b>↑前進／↓後退／←→ 回転</b>・<b>Shift＋↑↓＝仰角</b>・ホイール＝ズーム。</span>
          </div>
        </div>
        <div id="padopts"></div>

        <!-- 下：パーティ HUD -->
        <section id="party" class="ov"></section>

        <!-- 作戦（全員に命じる）＝リアクティブ連携 -->
        <section id="sakusen" class="ov">
          <div class="sklabel">作戦（全員に命じる）</div>
          <div class="skrow">
            <button class="skbtn" type="button" data-stance="guard">守れ</button>
            <button class="skbtn" type="button" data-stance="shoot">撃て</button>
            <button class="skbtn" type="button" data-stance="allout">全力</button>
          </div>
          <div class="skrow">
            <button class="skbtn" type="button" data-stance="heal">回復優先</button>
            <button class="skbtn" type="button" data-stance="retreat">下がれ</button>
            <button class="skbtn" type="button" data-stance="conserve">温存</button>
          </div>
        </section>

        <!-- 移動パッド（モバイル） -->
        <div id="pad" aria-label="移動パッド">
          <button class="pb" type="button" data-dx="-1" data-dy="-1">↖</button>
          <button class="pb" type="button" data-dx="0" data-dy="-1">↑</button>
          <button class="pb" type="button" data-dx="1" data-dy="-1">↗</button>
          <button class="pb" type="button" data-dx="-1" data-dy="0">←</button>
          <button class="pb" id="pad-center" type="button" data-dx="0" data-dy="0">待つ</button>
          <button class="pb" type="button" data-dx="1" data-dy="0">→</button>
          <button class="pb" type="button" data-dx="-1" data-dy="1">↙</button>
          <button class="pb" type="button" data-dx="0" data-dy="1">↓</button>
          <button class="pb" type="button" data-dx="1" data-dy="1">↘</button>
        </div>
      </section>
    </main>
    <div id="equip">
      <div id="equippanel">
        <div id="equiphd"><span id="modaltitle">装備を整える</span><button id="equipclose" data-eqclose type="button">閉じる（Esc）</button></div>
        <div id="equipbody"></div>
      </div>
    </div>
  </body>
</html>
