<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>comduct · tracer-0（対岸ボタン・アーカイブ）</title>
    <style>
      /* コーチ：常に「つぎ何をするか」を大きく出す（迷わせない） */
      #coach {
        background: linear-gradient(180deg, rgba(255, 224, 106, 0.16), rgba(255, 224, 106, 0.06));
        border: 1px solid var(--accent);
        border-radius: 10px;
        color: var(--text);
        font-size: 15px;
        line-height: 1.5;
        padding: 12px 14px;
        margin-bottom: 10px;
        min-height: 24px;
        font-weight: 600;
      }
      #legend {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        font-size: 12px;
        color: var(--muted);
        padding: 2px;
      }
      #legend b {
        color: var(--text);
        font-weight: 600;
      }
      #legend .sw {
        display: inline-block;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        vertical-align: -3px;
        margin-right: 4px;
      }
      #controls {
        flex-wrap: wrap;
      }
      #controls .cmdbtn {
        border-color: #2c3a4a;
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.7;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 11px;
      }
      .hint b {
        color: var(--text);
      }
    </style>
    <script type="module" crossorigin src="./assets/tracer0-Oomf7bXW.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/style-CfgLRWOo.js">
    <link rel="stylesheet" crossorigin href="./assets/style-CUDl0B5M.css">
  </head>
  <body>
    <header id="topbar">
      <span class="brand">comduct</span>
      <span class="sub">tracer-0（対岸ボタン・<b>アーカイブ実験版</b>）— 畳んだ実験。探索の本線は <a href="/dungeon.html" style="color: #6ec8ff">/dungeon.html</a></span>
    </header>
    <main id="app">
      <section id="left">
        <div id="coach">…</div>
        <canvas id="board" width="546" height="378"></canvas>
        <div id="status">…</div>
        <div id="controls">
          <button id="cmd-rin-switch" class="cmdbtn" type="button">リン → スイッチ</button>
          <button id="cmd-garo-cross" class="cmdbtn" type="button">ガロ(鍵) → 対岸</button>
          <button id="reset" type="button">もう一度</button>
        </div>
        <div id="legend">
          <span><span class="sw" style="background: #ffe06a"></span><b>主人公</b>＝矢印キー/クリック</span>
          <span><span class="sw" style="background: #46c7bf"></span><b>リン</b>＝クリックで命じる</span>
          <span><span class="sw" style="background: #9b8cff"></span><b>ガロ🔑</b>＝鍵持ち</span>
          <span>◎スイッチ（踏む間だけ橋）／🔒対岸の扉（鍵で開く）</span>
        </div>
      </section>
      <aside id="right">
        <section class="hint">
          <b>遊び方は3つだけ</b><br />
          ① <b>主人公</b>は矢印キー（か隣マスのクリック）で動く。待機＝Space。<br />
          ② <b>仲間</b>はクリックで選んで、行き先をクリック（ボタンでも可）。<br />
          ③ スイッチは<b>踏みっぱ</b>。誰かが残って踏み、鍵🔑のガロを対岸へ渡せば扉が開く。<br />
          <span style="opacity: 0.7">上の黄色いコーチが、つぎの一手を常に教えます。</span>
        </section>
        <section id="chatlog"></section>
        <form id="chatform" autocomplete="off">
          <input id="chatinput" placeholder="（任意）文字でも：リン スイッチ ／ ガロ 対岸" />
          <button type="submit">送る</button>
        </form>
      </aside>
    </main>
  </body>
</html>
