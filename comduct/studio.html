<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title data-i18n="tool.studio.title">comduct · スタジオ（統合ワークスペース）</title>
    <style>
      /* ============================================================
         §studio W1 — シェルの常設 chrome（DESIGN-maker-workspace §4-a）。
         ・topbar（world/言語/トークン印）＋左レール（PC）／下タブ（モバイル・900px 境界）
         ・#phost＝パネルの host（排他 mount）。パネルの style は markup と共に注入され
           dispose で丸ごと消える＝シェルはパネル CSS に依存しない（ここで完結）。
         ・パネル内の .langpick/.worldpick はシェルが二重にならないよう非表示
           （standalone stub では従来どおり見える）。
         ============================================================ */
      :root {
        --bg: #12161f; --panel: #1a2130; --line: #2b3547;
        --text: #e8edf5; --muted: #8b96a8; --accent: #5b9bff; --tint: #223048;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; background: var(--bg); color: var(--text); font: 14px/1.55 ui-rounded, "Hiragino Maru Gothic ProN", "Noto Sans Thai Sub", "Noto Sans Viet Sub", system-ui, sans-serif; }
      #studio { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
      #stutop { display: flex; align-items: center; gap: 10px; padding: 5px 12px; border-bottom: 1px solid var(--line); background: var(--panel); flex: 0 0 auto; }
      #stutop .brand { font-weight: 700; font-size: 13px; color: #cfe3ff; }
      #stutop .brand .sub { color: var(--muted); font-weight: 400; font-size: 11px; }
      #stutop select { background: #232c3e; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font: inherit; font-size: 12px; max-width: 13em; }
      #stutop .pick { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
      #stutop .spacer { margin-left: auto; }
      #stuworldlbl { color: var(--muted); font-size: 11px; font-family: ui-monospace, Menlo, monospace; }
      /* R3面：account chip＝「誰として作っているか」（world 切替の隣・whoami の表示層） */
      #stuacct { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: #cfe3ff; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; background: #232c3e; white-space: nowrap; }
      #stuacct.off { color: var(--muted); border-style: dashed; background: transparent; }
      #stuacct.oauth { cursor: pointer; } /* R3 認証：OAuth ログイン済＝クリックでログアウト */
      #stuloginbtn { background: var(--tint, #232c3e); color: var(--text); border: 1px solid var(--accent, #4a90d9); border-radius: 999px; padding: 1px 10px; font: inherit; font-size: 11px; cursor: pointer; white-space: nowrap; }
      #stutoken { font-size: 13px; }
      /* R4面：🔌LLM 席（BYO-LLM＝authoring 支援・鍵はブラウザ保持＝サーバ非経由） */
      .llmseat { background: #232c3e; color: #cfe3ff; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font: inherit; font-size: 11px; cursor: pointer; white-space: nowrap; }
      .llmseat.off { color: var(--muted); border-style: dashed; background: transparent; }
      #stullmdlg { margin: auto; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; width: min(480px, calc(100vw - 24px)); max-height: calc(100dvh - 40px); overflow-y: auto; font: inherit; } /* margin:auto＝上の * リセットに勝って中央寄せ */
      #stullmdlg::backdrop { background: rgba(0, 0, 0, 0.55); }
      #stullmdlg .llmhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
      #stullmdlg .llmx { background: transparent; color: var(--muted); border: none; font: inherit; font-size: 14px; cursor: pointer; }
      #stullmdlg .llmnote, #stullmdlg .llmcors { color: var(--muted); font-size: 11px; margin: 4px 0; }
      #stullmdlg .llmgrid { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; margin: 8px 0; font-size: 12px; }
      #stullmdlg input, #stullmdlg select { background: #232c3e; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font: inherit; font-size: 12px; width: 100%; max-width: 100%; }
      #stullmdlg .llmgrid span { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      #stullmdlg .llmmask { color: var(--muted); font-size: 10px; font-family: ui-monospace, Menlo, monospace; }
      #stullmdlg .llmrow { display: flex; gap: 8px; margin: 8px 0 4px; flex-wrap: wrap; }
      #stullmdlg .llmrow button { background: var(--tint); color: var(--text); border: 1px solid var(--accent); border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
      #stullmdlg .llmstatus { min-height: 1.2em; font-size: 11px; color: var(--muted); }
      #stullmdlg .llmstatus.ok { color: #7fd48a; }
      #stullmdlg .llmstatus.bad { color: #ff9a8a; }
      #stullmdlg .llmhr { border: none; border-top: 1px solid var(--line); margin: 10px 0; }
      #stullmdlg .llmout { list-style: none; margin: 6px 0 0; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
      #stullmdlg .llmout li { display: flex; align-items: baseline; gap: 6px; }
      #stullmdlg .llmout .llmraw { color: var(--muted); font-size: 11px; display: block; }
      #stullmdlg .llmcp { background: transparent; border: 1px solid var(--line); border-radius: 5px; color: var(--text); font-size: 11px; cursor: pointer; padding: 0 4px; flex: 0 0 auto; }
      #stubody { flex: 1; display: flex; min-height: 0; }
      #sturail { width: 58px; flex: 0 0 auto; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 6px; padding: 8px 5px; }
      .railbtn, .tabbtn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; background: transparent; color: var(--text); border: 1px solid transparent; border-radius: 8px; padding: 6px 2px; font: inherit; cursor: pointer; }
      .railbtn .ic, .tabbtn .ic { font-size: 19px; }
      .railbtn .lb, .tabbtn .lb { font-size: 9px; color: var(--muted); max-width: 52px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .railbtn:hover, .tabbtn:hover { border-color: #4a648f; }
      .railbtn.on, .tabbtn.on { background: var(--tint); border-color: var(--accent); }
      .railbtn.on .lb, .tabbtn.on .lb { color: #cfe3ff; }
      #phost { flex: 1; min-width: 0; min-height: 0; position: relative; }
      /* パネル注入 markup の言語/ワールドピッカーはシェルが持つ＝二重表示を畳む（standalone では出る） */
      #phost .langpick, #phost .worldpick { display: none; }
      #stutabs { display: none; flex: 0 0 auto; border-top: 1px solid var(--line); background: var(--panel); padding: 4px 6px calc(4px + env(safe-area-inset-bottom)); gap: 6px; z-index: 20; }
      #stutabs .tabbtn { flex: 1; min-height: 48px; }
      @media (max-width: 900px) {
        #sturail { display: none; }
        #stutabs { display: flex; }
        #stutop { overflow-x: auto; }
        #stuworldlbl { display: none; }
      }
    </style>
    <script type="module" crossorigin src="./assets/studio-C4l3Mpju.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/i18n-D_93wjAr.js">
    <link rel="modulepreload" crossorigin href="./assets/creator-auth-q666652w.js">
    <link rel="modulepreload" crossorigin href="./assets/preload-helper-Dp1pzeXC.js">
    <link rel="stylesheet" crossorigin href="./assets/studio-B7ujmJDW.css">
  </head>
  <body>
    <div id="studio">
      <div id="stutop">
        <span class="brand">comduct <span class="sub">studio</span></span>
        <span class="pick worldpick">🗺<select id="stuWorld" title="World / ワールド"></select></span><!-- API 無し＝initWorldSwitcher が .worldpick ごと隠す（絵文字も残らない） -->
        <span id="stuworldlbl"></span>
        <span id="stuacct" hidden></span><!-- R3面：誰として作っているか（whoami の表示層・main.ts が埋める） -->
        <span id="stulogin"></span><!-- R3 認証：🐙GitHub ログイン（サーバに OAuth 設定がある同一オリジンだけ・main.ts が埋める） -->
        <span class="spacer"></span>
        <span id="stullm"></span><!-- R4面：🔌LLM 席（BYO-LLM・llm.ts が埋める＝鍵はこの端末のみ） -->
        <span id="stutoken"></span>
        <span class="pick">🌐<select id="stuLang" title="Language / 言語"></select></span>
      </div>
      <div id="stubody">
        <div id="sturail"></div>
        <div id="phost"></div>
      </div>
      <div id="stutabs"></div>
    </div>
  </body>
</html>
