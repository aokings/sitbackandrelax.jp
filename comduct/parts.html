<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>comduct · 部品棚（選ぶ＋いじる＋⭐）</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif; touch-action: none; }
      #ui { position: fixed; top: 8px; left: 8px; z-index: 10; color: #cdd3dd; font-size: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; max-width: calc(100vw - 16px); }
      #ui button, #ui select { background: #1b2230; color: #cdd3dd; border: 1px solid #3a4458; border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; max-width: 46vw; }
      #ui button.on { background: #2a4a3a; border-color: #4a7a5a; }
      #ui button.star { background: #4a3a1a; border-color: #8a6a2a; }
      #knobs { position: fixed; top: 76px; left: 8px; z-index: 10; color: #cdd3dd; font-size: 12px; background: rgba(16,20,29,.88); border: 1px solid #2a3244; border-radius: 10px; padding: 10px 12px; width: min(300px, calc(100vw - 32px)); max-height: calc(100vh - 170px); overflow-y: auto; touch-action: pan-y; }
      @media (max-height: 900px) and (max-width: 480px) { #knobs { max-height: 44vh; } } /* スマホ＝姿が隠れない高さに */
      #knobs.folded { display: none; }
      #knobs h3 { margin: 6px 0 4px; font-size: 12px; color: #9fb4d8; font-weight: 600; }
      #knobs .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
      #knobs .row label { width: 86px; color: #8a96a8; flex: none; }
      #knobs .row input[type=range] { flex: 1; min-width: 90px; accent-color: #6ee7a8; }
      #knobs .row input[type=color] { width: 34px; height: 22px; border: none; background: none; padding: 0; }
      #knobs .row select { flex: 1; min-width: 90px; background: #1b2230; color: #cdd3dd; border: 1px solid #3a4458; border-radius: 6px; padding: 3px 6px; font-size: 11px; }
      #knobs .val { width: 34px; text-align: right; color: #cdd3dd; flex: none; }
      #knobs .slotchips { display: flex; gap: 4px; flex-wrap: wrap; margin: 2px 0 6px; }
      #knobs .slotchips button { background: #1b2230; color: #cdd3dd; border: 1px solid #3a4458; border-radius: 6px; padding: 3px 8px; font-size: 11px; cursor: pointer; }
      #knobs .slotchips button.on { background: #2a4a3a; border-color: #4a7a5a; }
      #knobs .slotchips button.empty { opacity: .55; }
      #knobs .sub { color: #6c7686; font-size: 10.5px; line-height: 1.5; }
      #info { position: fixed; bottom: 8px; left: 8px; right: 8px; color: #9aa6b8; font-size: 11px; line-height: 1.7; z-index: 10; }
      #info b { color: #cdd3dd; }
    </style>

  <body>
    <div id="ui">
      <select id="creature"></select>
      <select id="shelfsel" title="どの棚（truth / 提案）で組むか"></select>
      <button id="light">明所</button>
      <button id="fold" title="ノブパネルを畳む/開く（スマホで姿を見る）">▤</button>
      <button id="reset">リセット</button>
      <button id="promote" class="star" hidden>⭐採用</button>
    </div>
    <div id="knobs"></div>
    <div id="info"></div>
