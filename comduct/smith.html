<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>comduct · 工房（能力/実体エディタ P7・開発ツール）</title>
    <style>
      /* ============================================================
         P7 能力＋実体エディタ（DESIGN-abilities.md・forge/sculpt の隣）
         ・左＝種別タブ＋フォーム（数値/enum＋効果プリミティブの合成）
         ・中＝プレビュー（対象範囲の幾何＋溜めゲージの手番シミュ）＋バリデーション
         ・右＝協働ループ（truth／future・⭐promote は人間ゲート）
         ============================================================ */
      :root {
        --bg: #12161f; --panel: #1a2130; --line: #2b3547;
        --text: #e8edf5; --muted: #8b96a8; --accent: #ffb347; --tint: #2e2412;
        --ok: #7fd17f; --warn: #ffd166; --err: #ff7a6e;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; background: var(--bg); color: var(--text); font: 14px/1.55 ui-rounded, "Hiragino Maru Gothic ProN", system-ui, sans-serif; }
      #app { display: flex; height: 100vh; }
      #side { width: 360px; min-width: 320px; border-right: 1px solid var(--line); padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 9px; }
      #side h1 { font-size: 15px; }
      .sub { color: var(--muted); font-size: 11px; }
      h2 { font-size: 12px; color: var(--accent); border-bottom: 1px solid var(--line); padding-bottom: 3px; margin-top: 3px; }
      button, select, input[type="text"], input[type="number"] { background: #232c3e; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font: inherit; font-size: 12px; cursor: pointer; }
      input[type="text"], input[type="number"] { cursor: text; }
      button:hover { border-color: var(--accent); }
      button.on { background: var(--accent); color: #0d1017; border-color: var(--accent); font-weight: 700; }
      button.big { background: var(--tint); border-color: var(--accent); padding: 8px 10px; font-weight: 700; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      .kv { display: flex; align-items: center; gap: 6px; font-size: 12px; flex-wrap: wrap; }
      .kv .lbl { color: var(--muted); font-size: 11px; min-width: 4.2em; }
      .kv input[type="text"] { flex: 1; min-width: 0; }
      .kv input.num { width: 4.2em; }
      .fx { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; display: flex; flex-direction: column; gap: 5px; }
      .fx .row { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
      #mid { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      #stage { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
      #pv { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; gap: 16px; flex-wrap: wrap; }
      #pvgrid { image-rendering: pixelated; background: #0d1117; border-radius: 8px; }
      #gauge { display: flex; flex-direction: column; gap: 6px; min-width: 240px; }
      #gaugebar { height: 18px; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: #0d1117; }
      #gaugebar i { display: block; height: 100%; background: linear-gradient(to right, #8a5a12, var(--warn)); width: 0%; transition: width 0.15s; }
      #lint { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 12px; }
      #lint .ok { color: var(--ok); }
      #lint .err { color: var(--err); white-space: pre-wrap; }
      #foot { border-top: 1px solid var(--line); background: var(--panel); padding: 7px 12px; font-size: 12px; color: var(--muted); display: flex; gap: 14px; }
      #msg { color: var(--ok); }
      #loop { width: 320px; min-width: 270px; border-left: 1px solid var(--line); padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 12px; display: flex; flex-direction: column; gap: 5px; }
      .card .id { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--muted); }
      .card .who { font-size: 10px; color: var(--warn); }
      .card .row { display: flex; gap: 6px; flex-wrap: wrap; }
      .live { color: var(--muted); font-size: 11px; }
      details.hist summary { cursor: pointer; color: var(--muted); font-size: 11px; }
      .tag { display: inline-block; background: #232c3e; border-radius: 5px; padding: 0 6px; font-size: 10px; color: var(--muted); margin-right: 4px; }
    </style>
    <script type="module" crossorigin src="./assets/smith-DXp_Bdwr.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/ability-C4TqW-bP.js">
  </head>
  <body>
    <div id="app">
      <div id="side">
        <h1>🔨 工房 — 能力/実体エディタ <span class="sub">P7</span></h1>
        <div class="sub">数値と enum の合成だけ＝決定論の語彙。保存は future（truth 不変）・採用は ⭐（人間ゲート）。<a href="./forge.html" style="color:#8fb7ff">鍛冶場</a>・<a href="./sculpt.html" style="color:#8fb7ff">彫房</a>・<a href="./dungeon.html" style="color:#8fb7ff">実機</a></div>
        <div class="kv" id="tabs">
          <button id="tab-tech" class="on" type="button">⚡ 特技</button>
          <button id="tab-spell" type="button">✦ 呪文</button>
          <button id="tab-item" type="button">🗡 実体</button>
        </div>
        <div id="form"></div>
        <button class="big" id="save" type="button">💾 提案として保存（future）</button>
      </div>
      <div id="mid">
        <div id="stage">
          <div id="lint"></div>
          <div id="pv">
            <div>
              <div class="sub" id="pvcap">対象の幾何</div>
              <canvas id="pvgrid" width="220" height="220"></canvas>
            </div>
            <div id="gauge">
              <div class="sub">溜めゲージ（手番シミュ・Lv/熟練で速く）</div>
              <div id="gaugebar"><i></i></div>
              <div class="kv">
                <button id="g-step" type="button">＋1手</button>
                <button id="g-reset" type="button">リセット</button>
                <span class="lbl">Lv</span><input class="num" id="g-lv" type="number" value="1" min="1" max="30" />
                <span class="lbl">使用回数</span><input class="num" id="g-use" type="number" value="0" min="0" max="40" />
              </div>
              <div class="sub" id="gaugetext"></div>
              <div class="sub" id="summary"></div>
            </div>
          </div>
        </div>
        <div id="foot"><span id="hint">保存は truth を変えない。右の一覧に future が並び、⭐promote だけが truth を更新する。</span><span id="msg"></span></div>
      </div>
      <div id="loop">
        <h2>⭐ 提案（future）</h2>
        <div id="proposals"></div>
        <h2>📜 truth（採用済み）</h2>
        <div id="truth"></div>
      </div>
    </div>
  </body>
</html>
