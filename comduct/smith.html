<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title data-i18n="tool.smith.title">comduct · 工房（能力/実体/敵エディタ P7＋R1・開発ツール）</title>
    <style>
      /* ============================================================
         P7 能力＋実体エディタ（DESIGN-abilities.md・forge/sculpt の隣）
         ・左＝種別タブ＋フォーム（数値/enum＋効果プリミティブの合成）
         ・中＝プレビュー（対象範囲の幾何＋溜めゲージの手番シミュ）＋バリデーション
         ・右＝協働ループ（truth／future・⭐promote は人間ゲート）
         ・§tool-i18n：UI 文字列は data-i18n / t()（tool.* キー・6言語）。ja は原文と同文。
         ============================================================ */
      :root {
        --bg: #12161f; --panel: #1a2130; --line: #2b3547;
        --text: #e8edf5; --muted: #8b96a8; --accent: #ffb347; --tint: #2e2412;
        --ok: #7fd17f; --warn: #ffd166; --err: #ff7a6e;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; background: var(--bg); color: var(--text); font: 14px/1.55 ui-rounded, "Hiragino Maru Gothic ProN", "Noto Sans Thai Sub", "Noto Sans Viet Sub", system-ui, sans-serif; }
      #app { display: flex; height: 100vh; height: 100dvh; }
      #side { width: 360px; min-width: 320px; border-right: 1px solid var(--line); padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 9px; }
      #side h1 { font-size: 15px; }
      .sub { color: var(--muted); font-size: 11px; }
      h2 { font-size: 12px; color: var(--accent); border-bottom: 1px solid var(--line); padding-bottom: 3px; margin-top: 3px; }
      button, select, input[type="text"], input[type="number"] { background: #232c3e; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font: inherit; font-size: 12px; cursor: pointer; }
      input[type="text"], input[type="number"] { cursor: text; }
      button:hover { border-color: var(--accent); }
      button.on { background: var(--accent); color: #0d1017; border-color: var(--accent); font-weight: 700; }
      button.big { background: var(--tint); border-color: var(--accent); padding: 8px 10px; font-weight: 700; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      .kv { display: flex; align-items: center; gap: 6px; font-size: 12px; flex-wrap: wrap; }
      .kv .lbl { color: var(--muted); font-size: 11px; min-width: 4.2em; }
      .kv input[type="text"] { flex: 1; min-width: 0; }
      .kv input.num { width: 4.2em; }
      .fx { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; display: flex; flex-direction: column; gap: 5px; }
      .fx .row { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
      #mid { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      #stage { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
      #pv { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; gap: 16px; flex-wrap: wrap; }
      #pvgrid { image-rendering: pixelated; background: #0d1117; border-radius: 8px; }
      #gauge { display: flex; flex-direction: column; gap: 6px; min-width: 240px; }
      #gaugebar { height: 18px; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: #0d1117; }
      #gaugebar i { display: block; height: 100%; background: linear-gradient(to right, #8a5a12, var(--warn)); width: 0%; transition: width 0.15s; }
      #lint { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 12px; }
      #lint .ok { color: var(--ok); }
      #lint .err { color: var(--err); white-space: pre-wrap; }
      #foot { border-top: 1px solid var(--line); background: var(--panel); padding: 7px 12px; font-size: 12px; color: var(--muted); display: flex; gap: 14px; }
      #msg { color: var(--ok); }
      #loop { width: 320px; min-width: 270px; border-left: 1px solid var(--line); padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 12px; display: flex; flex-direction: column; gap: 5px; }
      .card .id { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--muted); }
      .card .who { font-size: 10px; color: var(--warn); }
      .card .row { display: flex; gap: 6px; flex-wrap: wrap; }
      .live { color: var(--muted); font-size: 11px; }
      details.hist summary { cursor: pointer; color: var(--muted); font-size: 11px; }
      .tag { display: inline-block; background: #232c3e; border-radius: 5px; padding: 0 6px; font-size: 10px; color: var(--muted); margin-right: 4px; }
      /* §tool-i18n：6言語ピッカー（ゲームの ☰ と同じ #langmode 流儀） */
      .langpick { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
      #langmode { max-width: 12em; }
      /* ⭐2段確認（決定⑥・M2 共通 tool-shelf）：promote タップ→確認バー→確定。PC/モバイル共通 */
      .confirmbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; background: #33290f; border: 1px solid var(--warn); border-radius: 6px; padding: 6px 8px; font-size: 11px; }
      .confirmbar span { color: var(--warn); }
      /* 幾何プレビュー＝触れるもの（M2 §3「数値も指で」）：帯ドラッグ=射程・タップ=かたち */
      #pvgrid { touch-action: none; cursor: crosshair; }
      #pvhint { flex-basis: 100%; }
      /* 溜め満タン＝金縁パンチ（ゲームの hotbar 表現と一致） */
      #gaugebar.full { border-color: var(--warn); box-shadow: 0 0 10px rgba(255, 209, 102, 0.55); animation: gpunch 0.3s; }
      @keyframes gpunch { 0% { transform: scale(1); } 40% { transform: scale(1.05); } 100% { transform: scale(1); } }
      #g-step { min-width: 5.5em; }
      /* ±ステッパ（M2 §3）：モバイルだけ表示＝PC は従来の number input のまま */
      .stepbtn { display: none; }
      .stepwrap { display: inline-flex; align-items: center; gap: 4px; }
      /* ── M2 モバイル部品（デスクトップでは非表示） ───────────────────────── */
      #mbar, #mbot, #mscroll, .sheet, #veil, #mtoast { display: none; }
      #mbar { gap: 6px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--panel); overflow-x: auto; flex: 0 0 auto; }
      #mbar #tabs { display: flex; gap: 6px; flex: 1 1 auto; }
      #mbar button { min-height: 44px; min-width: 44px; font-size: 13px; flex: 0 0 auto; }
      #mbot { gap: 8px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--panel); flex: 0 0 auto; }
      #mbot #save { flex: 1; min-height: 52px; }
      #mtoast { position: fixed; left: 50%; bottom: calc(72px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: rgba(18, 22, 31, 0.92); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 12px; z-index: 28; max-width: 92%; }
      #veil { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); z-index: 29; }
      .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bg); border-top: 1px solid var(--accent); border-radius: 14px 14px 0 0; max-height: 78vh; max-height: 78dvh; flex-direction: column; box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.5); }
      .sheet .sheethead { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
      .sheet .sheethead b { color: #cfe3ff; }
      .sheet .sheethead button { min-width: 44px; min-height: 38px; }
      .sheet .sheetbody { overflow-y: auto; min-height: 0; padding: 0 12px 12px; }
      .sheet #loop { width: auto; min-width: 0; border-left: none; }
      @media (max-width: 900px) {
        #app { flex-direction: column; }
        #side, #mid, #app > #loop { display: none; } /* 中身は JS がモバイル枠へ移動済（シート内の #loop は生きる） */
        #mbar, #mbot { display: flex; }
        #mbar { padding-top: calc(6px + env(safe-area-inset-top)); } /* notch 側（viewport-fit=cover） */
        #mscroll { display: flex; flex-direction: column; gap: 10px; flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 10px; }
        /* プレビュー＝sticky カード（フォームをスクロールしても手応えが見える・§3） */
        #mscroll #pv { position: sticky; top: 0; z-index: 6; gap: 8px 10px; padding: 8px 10px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45); }
        #mscroll #pvgrid { width: min(38vw, 160px); height: min(38vw, 160px); }
        #mscroll #gauge { min-width: 0; flex: 1 1 180px; gap: 4px; }
        #mscroll #pv .sub { font-size: 10px; }
        #mscroll #form { display: flex; flex-direction: column; gap: 9px; }
        .kv { row-gap: 8px; }
        .kv input[type="text"], .kv input[type="number"], .kv select, #form button { min-height: 44px; }
        .kv input[type="text"], .kv input[type="number"] { font-size: 16px; } /* iOS の自動ズームを避ける */
        .stepbtn { display: inline-flex; align-items: center; justify-content: center; width: 44px; min-height: 44px; font-size: 18px; flex: 0 0 auto; }
        #gauge .kv input[type="number"] { min-height: 44px; }
        #g-step { min-height: 48px; font-size: 14px; }
      }
    </style>
    <script type="module" crossorigin src="./assets/smith-C4hVLzwy.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/i18n-CXlb-lBn.js">
    <link rel="modulepreload" crossorigin href="./assets/monster-DrmSxb2o.js">
    <link rel="modulepreload" crossorigin href="./assets/tool-shelf-zTfC8lmB.js">
    <link rel="modulepreload" crossorigin href="./assets/creator-auth-C2cecs39.js">
    <link rel="modulepreload" crossorigin href="./assets/world-ui-DYbuMfd_.js">
    <link rel="stylesheet" crossorigin href="./assets/world-ui-B7ujmJDW.css">
  </head>
  <body>
    <div id="app">
      <div id="side">
        <div id="about" style="display:flex;flex-direction:column;gap:9px">
          <h1><span data-i18n="tool.smith.h1">🔨 工房 — 能力/実体/敵エディタ</span> <span class="sub">P7＋R1</span></h1>
          <div class="sub"><span data-i18n="tool.smith.intro">数値と enum の合成だけ＝決定論の語彙。保存は future（truth 不変）・採用は ⭐（人間ゲート）。</span><a href="./forge.html" style="color:#8fb7ff" data-i18n="tool.smith.linkForge">鍛冶場</a>・<a href="./sculpt.html" style="color:#8fb7ff" data-i18n="tool.smith.linkSculpt">彫房</a>・<a href="./dungeon.html" style="color:#8fb7ff" data-i18n="tool.smith.linkGame">実機</a></div>
          <div class="kv"><span class="langpick worldpick">🗺<select id="worldmode" title="World / ワールド"></select></span><span class="langpick">🌐<select id="langmode" title="Language / 言語"></select></span></div>
        </div>
        <div class="kv" id="tabs">
          <button id="tab-tech" class="on" type="button" data-i18n="tool.smith.tab.tech">⚡ 特技</button>
          <button id="tab-spell" type="button" data-i18n="tool.smith.tab.spell">✦ 呪文</button>
          <button id="tab-item" type="button" data-i18n="tool.smith.tab.item">🗡 実体</button>
          <button id="tab-mon" type="button" data-i18n="tool.smith.tab.mon">👹 敵</button>
        </div>
        <div id="form"></div>
        <button class="big" id="save" type="button" data-i18n="tool.smith.save">💾 提案として保存（future）</button>
      </div>
      <div id="mid">
        <div id="stage">
          <div id="lint"></div>
          <div id="pv">
            <div>
              <div class="sub" id="pvcap">対象の幾何</div>
              <canvas id="pvgrid" width="220" height="220"></canvas>
            </div>
            <div id="gauge">
              <div class="sub" data-i18n="tool.smith.gaugeHead">溜めゲージ（手番シミュ・Lv/熟練で速く）</div>
              <div id="gaugebar"><i></i></div>
              <div class="kv">
                <button id="g-step" class="big" type="button" data-i18n="tool.smith.gStep" data-i18n-title="tool.smith.gStepTitle" title="長押しで連続手送り">▶ 1手</button>
                <button id="g-reset" type="button" data-i18n="tool.smith.gReset">リセット</button>
                <span class="lbl">Lv</span><input class="num" id="g-lv" type="number" value="1" min="1" max="30" />
                <span class="lbl" data-i18n="tool.smith.gUse">使用回数</span><input class="num" id="g-use" type="number" value="0" min="0" max="40" />
              </div>
              <div class="sub" id="gaugetext"></div>
              <div class="sub" id="summary"></div>
            </div>
            <div class="sub" id="pvhint" data-i18n="tool.smith.pvHint">プレビューは触れる：帯をドラッグ＝射程・タップ＝かたち（敵：タップ＝大きさ・上へドラッグ＝息）</div>
          </div>
        </div>
        <div id="foot"><span id="hint" data-i18n="tool.common.savenote">保存は truth を変えない。右の一覧に future が並び、⭐promote だけが truth を更新する。</span><span id="msg"></span></div>
      </div>
      <div id="loop">
        <h2 data-i18n="tool.smith.futureHead">⭐ 提案（future）</h2>
        <div id="proposals"></div>
        <h2 data-i18n="tool.smith.truthHead">📜 truth（採用済み）</h2>
        <div id="truth"></div>
      </div>
      <!-- M2 モバイル：上=タブ＋📚・中=sticky プレビュー＋フォーム（スクロール）・下=💾 保存。
           パネル DOM は JS がここへ移動＝同一実体（リスナ/i18n/状態 無傷）。PC は mq 外で従来位置へ戻る。 -->
      <div id="mbar">
        <button id="mShelf" type="button" data-i18n-title="tool.smith.mShelf" title="棚（future / truth）">📚</button>
      </div>
      <div id="mscroll"></div>
      <div id="mbot"></div>
    </div>
    <div id="mtoast"></div>
    <div id="veil"></div>
    <div id="sheetLoop" class="sheet">
      <div class="sheethead"><b data-i18n="tool.smith.mShelf">棚（future / truth）</b><button class="shclose" type="button">✕</button></div>
      <div class="sheetbody" id="sheetLoopBody"></div>
    </div>
  </body>
</html>
