<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>四足の動きを見る</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background:#111722; color:#edf3ff; }
    body { margin:0; display:grid; grid-template-rows:auto 1fr; min-height:100vh; }
    header { padding:14px 18px; background:#172234; border-bottom:1px solid #34445c; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
    h1 { font-size:16px; margin:0 12px 0 0; }
    button { font:inherit; color:inherit; background:#263752; border:1px solid #5c7395; border-radius:7px; padding:7px 13px; cursor:pointer; }
    button[aria-pressed="true"] { background:#c26031; border-color:#ffc18f; }
    select { font:inherit; color:inherit; background:#263752; border:1px solid #5c7395; border-radius:7px; padding:7px 9px; }
    #note { color:#b9c8dc; font-size:13px; }
    #metrics { color:#9fd8ff; font:12px ui-monospace, monospace; }
    canvas { width:100%; height:100%; display:block; min-height:520px; }
  </style>
  <script type="module" crossorigin src="./assets/actorQuadrupedPrototype-BCZL-sA8.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="./assets/three.module-BAT99Nro.js">
  <link rel="modulepreload" crossorigin href="./assets/status-BFngDnvf.js">
  <link rel="modulepreload" crossorigin href="./assets/play-input-CvHBVnfg.js">
  <link rel="modulepreload" crossorigin href="./assets/render-voxel-B1ERWxhq.js">
</head>
<body>
  <header>
    <h1>wolf：7 channel / MAX_BONES 16</h1>
    <button id="walk" aria-pressed="true">1：歩く</button>
    <button id="run" aria-pressed="false">2：走る</button>
    <button id="attack" aria-pressed="false">3：噛みつく</button>
    <button id="pause" aria-pressed="false">Space：一時停止</button>
    <label>接合 <select id="variant"><option value="reserve-1">脚：断面＋予備1セル（採用）</option><option value="closed">断面のみ</option><option value="reserve-2">脚：断面＋予備2セル（比較）</option><option value="open">従来カリング（比較）</option></select></label>
    <button id="whole" aria-pressed="true">全体</button><button id="hips" aria-pressed="false">股</button><button id="neck" aria-pressed="false">首</button>
    <span id="metrics"></span>
    <span id="note">ゲーム・共通試着台・CLIと同じ動きの計算を使います。</span>
    <output id="probe" hidden></output>
  </header>
  <canvas id="stage" aria-label="四足ボーンの試験表示"></canvas>
</body>
</html>
